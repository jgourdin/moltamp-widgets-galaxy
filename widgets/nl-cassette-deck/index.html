<!--
  Cassette Deck — Night Lounge pack for MOLTamp
  Whatever your Mac is playing, on a cassette: the reels spin, the tape winds from one reel to the other as the track goes on, and the VU meters bounce. Previous, play/pause and next buttons drive your music app.
  Author: j0j0 · License: MIT
-->
<div id="cy-root"><canvas id="cy-canvas"></canvas><div id="cy-label"></div></div>

<style>
  #cy-root { position: absolute; inset: 0; overflow: hidden; background: var(--c-chrome-bg); container-type: size; }
  #cy-canvas { display: block; width: 100%; height: 100%; }
  #cy-label {
    position: absolute; left: 8px; bottom: 6px; pointer-events: none; letter-spacing: 0.08em;
    color: var(--c-chrome-dim); text-shadow: 0 0 6px var(--c-chrome-bg);
    font: calc(clamp(8px, 3.4cqw, 12px) * var(--user-text-scale, 1)) 'SF Mono', Menlo, 'Hiragino Sans', monospace;
  }
</style>

<script>
// cyber-kit — shared runtime of the Cyberpunk widget pack (MIT, j0j0).
// Skin colours resolved for canvas use, DPR-aware canvas, pause when hidden, Claude state, telemetry.
var CK = (function () {
  'use strict';

  var hasSdk = typeof window.moltamp !== 'undefined';

  // ------------------------------------------------------------------ skin colours
  var VARS = {
    bg: '--c-chrome-bg', text: '--c-chrome-text', accent: '--c-chrome-accent', dim: '--c-chrome-dim',
    border: '--c-chrome-border', fg: '--t-foreground', termBg: '--t-background', red: '--t-red',
    green: '--t-green', yellow: '--t-yellow', blue: '--t-blue', cyan: '--t-cyan', magenta: '--t-magenta'
  };
  // A colour missing from the skin borrows another skin colour, never a hardcoded value.
  var BORROW = {
    text: ['fg', 'accent'], fg: ['text', 'accent'], accent: ['text', 'fg'], dim: ['text', 'fg'], border: ['dim', 'text'],
    bg: ['termBg'], termBg: ['bg'], red: ['magenta', 'accent'], green: ['cyan', 'accent'], yellow: ['accent', 'red'],
    blue: ['cyan', 'accent'], cyan: ['blue', 'accent'], magenta: ['red', 'accent']
  };
  var probeEl = document.createElement('span');
  probeEl.style.display = 'none';
  (document.body || document.documentElement).appendChild(probeEl);
  var pc = document.createElement('canvas');
  pc.width = pc.height = 1;
  var pctx = pc.getContext('2d', { willReadFrequently: true });
  var rgb = {};
  var c = {};

  // Resolves any CSS colour the skin may use (hex, rgb, var(), color-mix()) to RGB bytes.
  function readVar(name) {
    var raw = getComputedStyle(document.documentElement).getPropertyValue(VARS[name]).trim();
    if (!raw) return null;
    probeEl.style.color = '';
    probeEl.style.color = raw;
    var computed = getComputedStyle(probeEl).color;
    pctx.fillStyle = '#010203';
    pctx.fillStyle = computed;
    if (pctx.fillStyle === '#010203' && computed !== 'rgb(1, 2, 3)') return null;
    pctx.clearRect(0, 0, 1, 1);
    pctx.fillRect(0, 0, 1, 1);
    var d = pctx.getImageData(0, 0, 1, 1).data;
    return [d[0], d[1], d[2]];
  }

  function refreshColors() {
    var name, raw = {};
    for (name in VARS) raw[name] = readVar(name);
    for (name in VARS) {
      var v = raw[name], chain = BORROW[name] || [];
      for (var i = 0; !v && i < chain.length; i++) v = raw[chain[i]];
      if (!v) {
        // Last resort: the host's own text colour, still a skin value.
        probeEl.style.color = '';
        var m = /(\d+)\D+(\d+)\D+(\d+)/.exec(getComputedStyle(document.body || document.documentElement).color) || [0, 128, 128, 128];
        v = [+m[1], +m[2], +m[3]];
      }
      rgb[name] = v;
      c[name] = 'rgb(' + v[0] + ',' + v[1] + ',' + v[2] + ')';
    }
  }
  refreshColors();

  function rgba(name, a) {
    var v = rgb[name] || rgb.text;
    return 'rgba(' + v[0] + ',' + v[1] + ',' + v[2] + ',' + a + ')';
  }

  function mix(a, b, t, alpha) {
    var x = rgb[a] || rgb.text, y = rgb[b] || rgb.text;
    var r = Math.round(x[0] + (y[0] - x[0]) * t), g = Math.round(x[1] + (y[1] - x[1]) * t), bl = Math.round(x[2] + (y[2] - x[2]) * t);
    return alpha === undefined ? 'rgb(' + r + ',' + g + ',' + bl + ')' : 'rgba(' + r + ',' + g + ',' + bl + ',' + alpha + ')';
  }

  function lum(name) {
    var v = rgb[name] || rgb.text;
    return (0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2]) / 255;
  }

  // ------------------------------------------------------------------ sdk wrappers
  // moltamp.poll only: it cleans itself up when the widget unloads (store rule: no raw setInterval).
  function poll(ms, fn) {
    if (hasSdk && moltamp.poll) return moltamp.poll(ms, fn);
    return function () {};
  }

  function subscribe(store, selector, cb) {
    if (!hasSdk || !moltamp.subscribe) return function () {};
    try { return moltamp.subscribe(store, selector, cb) || function () {}; } catch (e) { return function () {}; }
  }

  function call(channel) {
    if (!hasSdk || !moltamp.call) return Promise.reject(new Error('no sdk'));
    try { return Promise.resolve(moltamp.call.apply(moltamp, arguments)); } catch (e) { return Promise.reject(e); }
  }

  // ------------------------------------------------------------------ text scale (Settings > Display)
  var textScale = 1;
  if (hasSdk && moltamp.settings) {
    moltamp.settings.read().then(function (cfg) {
      cfg = cfg || {};
      if (typeof cfg.widgetTextScale === 'number') textScale = cfg.widgetTextScale;
      document.documentElement.style.setProperty('--user-text-scale', String(textScale));
    }).catch(function () { /* first run: no settings */ });
  }

  function font(size, weight) {
    return (weight || 'normal') + ' ' + Math.max(7, size * textScale).toFixed(1) +
      'px "SF Mono", Menlo, "Hiragino Sans", "Hiragino Kaku Gothic ProN", monospace';
  }

  // ------------------------------------------------------------------ Claude shell state
  var STATES = ['idle', 'thinking', 'streaming', 'tool-use', 'permission', 'error', 'complete'];
  var state = { name: 'idle', since: performance.now(), seen: false };
  var stateListeners = [];
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.type !== 'moltamp:push' || d.subscriptionId !== 'shell-state' || STATES.indexOf(d.data) < 0) return;
    var prev = state.name;
    state.name = d.data;
    state.since = performance.now();
    state.seen = true;
    for (var i = 0; i < stateListeners.length; i++) {
      try { stateListeners[i](state.name, prev); } catch (err) { /* keep other listeners alive */ }
    }
  });

  function currentState() {
    // "complete" is a moment, not a mode: fall back to idle after a few seconds.
    if (state.name === 'complete' && performance.now() - state.since > 4000) return 'idle';
    return state.name;
  }

  // ------------------------------------------------------------------ terminal telemetry
  var tel = { bytes: 0, activity: 'idle', level: 0, started: false };
  function telemetry() {
    if (!tel.started) {
      tel.started = true;
      subscribe('telemetry', 'bytesPerSec', function (v) { tel.bytes = Number(v) || 0; });
      subscribe('telemetry', 'activity', function (v) { tel.activity = v || 'idle'; });
    }
    return tel;
  }

  // 0..1 terminal energy, log-scaled bytes plus the activity level, smoothed by the caller's dt.
  function telemetryLevel(dt) {
    var target = Math.min(1, Math.log(1 + tel.bytes) / Math.log(1 + 200000)) * 0.75 +
      (tel.activity === 'high' ? 0.35 : tel.activity === 'low' ? 0.15 : 0);
    tel.level += (Math.min(1, target) - tel.level) * (1 - Math.exp(-(dt || 0.016) / 0.5));
    return tel.level;
  }

  // ------------------------------------------------------------------ Claude Code hook events
  // event.events is a ring buffer of the last ~200 hook payloads from every session; callers only
  // want what is new, so entries are de-duplicated by timestamp, hook, tool and session.
  var evSeen = {}, evQueue = [], evListeners = [], evStarted = false;
  function eventKey(e) { return [e._ts, e._hook || e.hook_event_name, e.tool_name, e._session || e.session_id].join('|'); }
  function onEvents(cb) {
    evListeners.push(cb);
    if (evStarted) return;
    evStarted = true;
    var first = true;
    subscribe('event', 'events', function (v) {
      var list = Array.isArray(v) ? v : v && typeof v === 'object' ? Object.keys(v).map(function (k) { return v[k]; }) : [];
      var fresh = [];
      for (var i = 0; i < list.length; i++) {
        var e = list[i];
        if (!e || typeof e !== 'object') continue;
        var k = eventKey(e);
        if (evSeen[k]) continue;
        evSeen[k] = true;
        evQueue.push(k);
        fresh.push(e);
      }
      while (evQueue.length > 800) delete evSeen[evQueue.shift()];
      var history = first;
      first = false;
      if (fresh.length) for (var j = 0; j < evListeners.length; j++) {
        try { evListeners[j](fresh, history); } catch (err) { /* keep other listeners alive */ }
      }
    });
  }

  // A failure is read from the tool's response or the hook name, never from its input
  // (a command that merely contains the word "error" is not a failure).
  function isFailure(e) {
    var hook = String(e.hook_event_name || e._hook || '');
    if (/fail|error/i.test(hook)) return true;
    var r = e.tool_response;
    if (!r || typeof r !== 'object') return false;
    if (r.is_error === true || r.isError === true || r.success === false || r.interrupted === true) return true;
    var code = r.exitCode !== undefined ? r.exitCode : r.exit_code !== undefined ? r.exit_code : r.code;
    if (typeof code === 'number' && code !== 0) return true;
    return typeof r.error === 'string' && r.error.length > 0;
  }

  function toolLabel(name) {
    name = String(name || '?');
    if (name.indexOf('mcp__') !== 0) return name;
    // mcp__plugin_chrome-devtools-mcp_chrome-devtools__take_screenshot -> chrome-devtools
    var server = name.split('__')[1] || 'mcp';
    server = server.replace(/^plugin_/, '').replace(/^claude_ai_/, '').split('_').pop();
    return 'mcp:' + server;
  }

  // ------------------------------------------------------------------ canvas + loop
  // Paused while off screen (hidden tab) or while the whole page is hidden; both must clear to resume.
  var onScreen = true, pageVisible = !document.hidden, watching = false;
  function visibleNow() { return onScreen && pageVisible; }
  function watch(el) {
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (entries) { onScreen = entries[entries.length - 1].isIntersecting; }).observe(el);
    }
    if (!watching) {
      watching = true;
      document.addEventListener('visibilitychange', function () { pageVisible = !document.hidden; });
    }
  }

  function surface(el) {
    var s = { el: el, ctx: el.getContext('2d'), w: 0, h: 0, dpr: 1, resized: true };
    s.fit = function () {
      var dpr = Math.min(2, window.devicePixelRatio || 1);
      var w = Math.max(1, el.clientWidth), h = Math.max(1, el.clientHeight);
      if (w !== s.w || h !== s.h || dpr !== s.dpr) {
        s.w = w; s.h = h; s.dpr = dpr;
        el.width = Math.round(w * dpr);
        el.height = Math.round(h * dpr);
        s.resized = true;
      }
      s.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return s;
    };
    watch(el);
    return s;
  }

  function loop(fn, fpsCap) {
    var last = 0, lastDraw = 0, logged = false, cap = fpsCap || 60;
    function frame(now) {
      requestAnimationFrame(frame);
      if (!visibleNow()) { last = 0; return; }
      if (now - lastDraw < 1000 / cap - 2) return;
      var dt = last ? Math.min((now - last) / 1000, 0.1) : 1 / 60;
      last = lastDraw = now;
      try { fn(dt, now / 1000); } catch (e) {
        if (!logged) { logged = true; console.error('[cyber-kit]', e); }
      }
    }
    requestAnimationFrame(frame);
  }

  function resetCtx(ctx) {
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.shadowBlur = 0;
    ctx.lineWidth = 1;
    ctx.setLineDash([]);
  }

  // ------------------------------------------------------------------ small utils
  function hash(str) {
    var h = 2166136261;
    str = String(str);
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return ((h >>> 0) % 100000) / 100000;
  }

  function prng(seed) {
    var a = (seed * 4294967296) >>> 0 || 1;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = Math.imul(a ^ (a >>> 15), a | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function fmtBytes(b) {
    if (hasSdk && moltamp.fmt && moltamp.fmt.bytes) return moltamp.fmt.bytes(b);
    var u = ['B', 'KB', 'MB', 'GB'], i = 0;
    while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
    return b.toFixed(i ? 1 : 0) + ' ' + u[i];
  }

  // Skin switches update CSS variables live; re-resolve once a second.
  poll(1000, refreshColors);

  return {
    c: c, rgb: rgb, rgba: rgba, mix: mix, lum: lum, refreshColors: refreshColors,
    poll: poll, subscribe: subscribe, call: call, font: font,
    state: currentState, stateInfo: state, onState: function (cb) { stateListeners.push(cb); },
    telemetry: telemetry, telemetryLevel: telemetryLevel,
    onEvents: onEvents, isFailure: isFailure, toolLabel: toolLabel,
    surface: surface, loop: loop, resetCtx: resetCtx, isVisible: visibleNow,
    hash: hash, prng: prng, fmtBytes: fmtBytes,
    meta: (hasSdk && moltamp.meta) || { context: 'panel' }
  };
})();

// Cassette Deck: music.nowPlaying on a spinning cassette, with transport buttons and VU meters.
(function () {
  'use strict';
  var canvas = document.getElementById('cy-canvas');
  var S = CK.surface(canvas);
  var label = document.getElementById('cy-label');
  var np = null, linked = true, polledAt = 0, trackKey = '', slide = 0, t = 0, lastText = '';
  var rotL = 0, rotR = 0, vu = [0, 0], peak = [0, 0], vuTarget = [0, 0], vuClock = 0;
  var art = { url: '', img: null, ok: false };
  var buttons = [], hover = -1, pressed = { i: -1, t: 0 };

  // ------------------------------------------------------------------ data
  function str(v) { return v === undefined || v === null ? '' : String(v); }
  function seconds(v, ms) { var n = Number(v); return isFinite(n) && n > 0 ? (ms ? n / 1000 : n) : 0; }

  function read() {
    CK.call('music.nowPlaying').then(function (r) {
      linked = true;
      if (!r || typeof r !== 'object' || !(r.title || r.name)) { np = null; return; }
      // Durations above ten hours can only be milliseconds.
      var ms = Number(r.duration) > 36000;
      np = {
        title: str(r.title || r.name), artist: str(r.artist || r.artists || r.albumArtist), album: str(r.album),
        duration: seconds(r.duration, ms), position: seconds(r.position, ms), playing: r.isPlaying !== false && r.isPlaying !== 0,
        artwork: str(r.artworkUrl || r.artwork)
      };
      polledAt = performance.now();
      var key = np.title + '|' + np.artist;
      if (key !== trackKey) { if (trackKey) slide = 1; trackKey = key; }
      loadArt(np.artwork);
    }).catch(function () { linked = false; np = null; });
  }
  read();
  CK.poll(1000, read);

  // The widget CSP only lets data: and blob: images through; anything else keeps the drawn label.
  function loadArt(url) {
    if (url === art.url) return;
    art = { url: url, img: null, ok: false };
    if (!/^(data|blob):/i.test(url)) return;
    var img = new Image();
    img.onload = function () { if (art.url === url) { art.img = img; art.ok = true; } };
    img.src = url;
  }

  function position() {
    if (!np) return 0;
    var p = np.position + (np.playing ? (performance.now() - polledAt) / 1000 : 0);
    return np.duration ? Math.min(np.duration, p) : p;
  }

  function clock(s) {
    s = Math.max(0, Math.floor(s));
    var m = Math.floor(s / 60), r = s % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
  }

  // ------------------------------------------------------------------ transport
  var ACTIONS = ['music.previous', 'music.playPause', 'music.next'];
  function hit(e) {
    var r = canvas.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    for (var i = 0; i < buttons.length; i++) {
      var b = buttons[i];
      if (x >= b.x && x <= b.x + b.s && y >= b.y && y <= b.y + b.s) return i;
    }
    return -1;
  }
  // Left button only: right-click and ctrl-click belong to MOLTamp's slot menu.
  canvas.addEventListener('click', function (e) {
    if (e.button !== 0 || e.ctrlKey) return;
    var i = hit(e);
    if (i < 0) return;
    pressed = { i: i, t: 1 };
    if (i === 1 && np) { np.position = position(); polledAt = performance.now(); np.playing = !np.playing; }
    CK.call(ACTIONS[i]).catch(function () { /* the next poll shows the real state */ });
    setTimeout(read, 300);
  });
  canvas.addEventListener('mousemove', function (e) { hover = hit(e); canvas.style.cursor = hover >= 0 ? 'pointer' : ''; });
  canvas.addEventListener('mouseleave', function () { hover = -1; canvas.style.cursor = ''; });

  // ------------------------------------------------------------------ drawing helpers
  function rrect(ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // Text that does not fit scrolls slowly inside its box instead of being cut, resting at the start of each lap.
  function marquee(ctx, text, x, y, maxW, speed) {
    var tw = ctx.measureText(text).width;
    if (tw <= maxW) { ctx.fillText(text, x, y); return; }
    var gap = maxW * 0.35, rest = 2.5, lap = (tw + gap) / speed + rest, off = Math.max(0, (t % lap) - rest) * speed;
    ctx.save();
    ctx.beginPath(); ctx.rect(x, y - 1000, maxW, 2000); ctx.clip();
    ctx.fillText(text, x - off, y);
    ctx.fillText(text, x - off + tw + gap, y);
    ctx.restore();
  }

  function hubDraw(ctx, x, y, r, rot, col) {
    ctx.strokeStyle = col;
    ctx.lineWidth = Math.max(1, r * 0.22);
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.stroke();
    ctx.lineWidth = Math.max(1, r * 0.18);
    ctx.beginPath();
    for (var k = 0; k < 6; k++) {
      var a = rot + k * Math.PI / 3;
      ctx.moveTo(x + Math.cos(a) * r * 0.45, y + Math.sin(a) * r * 0.45);
      ctx.lineTo(x + Math.cos(a) * r * 0.9, y + Math.sin(a) * r * 0.9);
    }
    ctx.stroke();
  }

  function drawCassette(ctx, x, y, cw, ch, light) {
    var shell = CK.mix('bg', 'fg', light ? 0.1 : 0.17), edge = CK.mix('bg', 'fg', light ? 0.25 : 0.32);
    var paper = light ? CK.mix('bg', 'fg', 0.03) : CK.mix('fg', 'bg', 0.1), ink = light ? CK.c.fg : CK.c.bg;
    var tape = CK.mix('bg', 'red', light ? 0.35 : 0.3);
    // Shell
    rrect(ctx, x, y, cw, ch, ch * 0.07);
    ctx.fillStyle = shell; ctx.fill();
    ctx.strokeStyle = edge; ctx.lineWidth = Math.max(1, ch * 0.012); ctx.stroke();
    // Screws
    ctx.fillStyle = edge;
    [[0.045, 0.07], [0.955, 0.07], [0.045, 0.93], [0.955, 0.93], [0.5, 0.9]].forEach(function (p) {
      ctx.beginPath(); ctx.arc(x + cw * p[0], y + ch * p[1], Math.max(1.2, ch * 0.022), 0, 6.283); ctx.fill();
    });
    // Label
    var lx = x + cw * 0.07, ly = y + ch * 0.08, lw = cw * 0.86, lh = ch * 0.62;
    rrect(ctx, lx, ly, lw, lh, ch * 0.03);
    ctx.fillStyle = paper; ctx.fill();
    ctx.fillStyle = CK.c.accent; ctx.fillRect(lx, ly + lh * 0.3, lw, lh * 0.07);
    ctx.fillStyle = CK.c.magenta; ctx.fillRect(lx, ly + lh * 0.38, lw, lh * 0.04);
    ctx.fillStyle = CK.c.cyan; ctx.fillRect(lx, ly + lh * 0.43, lw, lh * 0.025);
    // Side letter, title and artist
    var artS = art.ok ? lh * 0.27 : 0;
    ctx.fillStyle = ink;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.font = CK.font(Math.max(9, lh * 0.2), 'bold');
    ctx.fillText('A', lx + lw * 0.03, ly + lh * 0.15);
    var tx = lx + lw * 0.03 + lh * 0.2, tmax = lw - (tx - lx) - lw * 0.03 - (artS ? artS + lw * 0.02 : 0);
    ctx.font = 'italic ' + CK.font(Math.max(8, lh * 0.13), 'bold');
    marquee(ctx, np.title, tx, ly + lh * 0.1, tmax, 22);
    ctx.font = 'italic ' + CK.font(Math.max(7, lh * 0.1));
    ctx.globalAlpha = 0.75;
    marquee(ctx, np.artist + (np.album ? ' — ' + np.album : ''), tx, ly + lh * 0.22, tmax, 18);
    ctx.globalAlpha = 1;
    if (art.ok) ctx.drawImage(art.img, lx + lw - artS - lw * 0.02, ly + lh * 0.03, artS, artS);
    // Window with the two tape packs; their radii follow the progress (tape area is conserved).
    var wx = x + cw * 0.25, wy = ly + lh * 0.52, ww = cw * 0.5, wh = lh * 0.4;
    var hubR = ch * 0.07, maxR = ch * 0.22, prog = np.duration ? position() / np.duration : 0;
    var rl = Math.sqrt(hubR * hubR + (maxR * maxR - hubR * hubR) * (1 - prog));
    var rr = Math.sqrt(hubR * hubR + (maxR * maxR - hubR * hubR) * prog);
    var hy = wy + wh / 2, hl = x + cw * 0.33, hr = x + cw * 0.67;
    rrect(ctx, wx, wy, ww, wh, wh * 0.18);
    ctx.fillStyle = CK.mix('bg', 'fg', light ? 0.06 : 0.04); ctx.fill();
    ctx.save();
    rrect(ctx, wx, wy, ww, wh, wh * 0.18); ctx.clip();
    ctx.fillStyle = tape;
    ctx.beginPath(); ctx.arc(hl, hy, rl, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(hr, hy, rr, 0, 6.283); ctx.fill();
    ctx.fillStyle = CK.rgba('fg', 0.06);
    ctx.fillRect(wx, wy, ww, wh * 0.35);
    ctx.restore();
    var hubCol = light ? CK.mix('bg', 'fg', 0.55) : CK.mix('fg', 'bg', 0.15);
    hubDraw(ctx, hl, hy, hubR, rotL, hubCol);
    hubDraw(ctx, hr, hy, hubR, rotR, hubCol);
    // Bottom bridge with the tape running past the head openings
    var by = y + ch * 0.78;
    ctx.beginPath();
    ctx.moveTo(x + cw * 0.2, y + ch); ctx.lineTo(x + cw * 0.26, by); ctx.lineTo(x + cw * 0.74, by); ctx.lineTo(x + cw * 0.8, y + ch);
    ctx.closePath();
    ctx.fillStyle = CK.mix('bg', 'fg', light ? 0.16 : 0.11); ctx.fill();
    ctx.strokeStyle = tape; ctx.lineWidth = Math.max(1, ch * 0.015);
    ctx.beginPath(); ctx.moveTo(x + cw * 0.24, y + ch * 0.965); ctx.lineTo(x + cw * 0.76, y + ch * 0.965); ctx.stroke();
    ctx.fillStyle = CK.rgba('bg', 0.6);
    [0.36, 0.64].forEach(function (p) { ctx.beginPath(); ctx.arc(x + cw * p, y + ch * 0.88, ch * 0.03, 0, 6.283); ctx.fill(); });
  }

  function drawEmpty(ctx, x, y, cw, ch) {
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = CK.rgba('dim', 0.7);
    ctx.lineWidth = 1;
    rrect(ctx, x, y, cw, ch, ch * 0.07); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = CK.rgba('dim', 0.9);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = CK.font(Math.max(10, ch * 0.16), 'bold');
    ctx.fillText(linked ? '⏏  NO TAPE' : '⏏  NO SIGNAL', x + cw / 2, y + ch * 0.45);
    ctx.font = CK.font(Math.max(8, ch * 0.08));
    ctx.fillText(linked ? 'play something on your Mac' : 'media info unavailable', x + cw / 2, y + ch * 0.65);
  }

  function drawButton(ctx, i, x, y, s, playing) {
    buttons[i] = { x: x, y: y, s: s };
    var press = pressed.i === i ? pressed.t : 0;
    rrect(ctx, x, y + press * s * 0.06, s, s, s * 0.18);
    ctx.fillStyle = hover === i ? CK.rgba('accent', 0.3) : CK.mix('bg', 'fg', 0.1);
    ctx.fill();
    ctx.strokeStyle = CK.rgba('accent', hover === i ? 0.9 : 0.45);
    ctx.lineWidth = 1;
    ctx.stroke();
    var cx = x + s / 2, cy = y + s / 2 + press * s * 0.06, u = s * 0.18;
    ctx.fillStyle = np ? CK.c.text : CK.c.dim;
    ctx.beginPath();
    if (i === 1 && playing) {
      ctx.rect(cx - u * 1.1, cy - u * 1.2, u * 0.75, u * 2.4);
      ctx.rect(cx + u * 0.35, cy - u * 1.2, u * 0.75, u * 2.4);
    } else if (i === 1) {
      ctx.moveTo(cx - u * 0.8, cy - u * 1.3); ctx.lineTo(cx + u * 1.3, cy); ctx.lineTo(cx - u * 0.8, cy + u * 1.3);
    } else {
      var d = i === 0 ? -1 : 1;
      ctx.moveTo(cx - d * u * 1.1, cy - u * 1.2); ctx.lineTo(cx + d * u * 0.7, cy); ctx.lineTo(cx - d * u * 1.1, cy + u * 1.2);
      ctx.rect(d > 0 ? cx + u * 0.7 : cx - u * 1.2, cy - u * 1.2, u * 0.5, u * 2.4);
    }
    ctx.fill();
  }

  // Segmented VU meter, horizontal or vertical
  function drawVu(ctx, x, y, len, thick, level, pk, vertical) {
    var n = 12, gap = Math.max(1, len * 0.012), seg = (len - gap * (n - 1)) / n;
    for (var k = 0; k < n; k++) {
      var on = level * n > k, isPeak = Math.round(pk * n) - 1 === k;
      var col = k >= n - 2 ? 'red' : k >= n - 4 ? 'yellow' : 'green';
      ctx.fillStyle = on || isPeak ? CK.rgba(col, 0.9) : CK.rgba('dim', 0.15);
      var p = k * (seg + gap);
      if (vertical) ctx.fillRect(x, y + len - p - seg, thick, seg);
      else ctx.fillRect(x + p, y, seg, thick);
    }
  }

  // Stereo display: title, artist, tape counter, time and a progress line.
  function drawDisplay(ctx, x, y, dw, dh, counter) {
    rrect(ctx, x, y, dw, dh, dh * 0.08);
    ctx.fillStyle = CK.mix('bg', 'fg', 0.05); ctx.fill();
    ctx.strokeStyle = CK.rgba('accent', 0.35); ctx.lineWidth = 1; ctx.stroke();
    var pad = dh * 0.12, tx = x + pad, tw = dw - pad * 2;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    if (!np) {
      ctx.fillStyle = CK.c.dim;
      ctx.font = CK.font(Math.max(9, dh * 0.2), 'bold');
      ctx.fillText(linked ? '⏏ NO TAPE' : '⏏ NO SIGNAL', tx, y + dh * 0.32);
      ctx.font = CK.font(Math.max(8, dh * 0.14));
      ctx.fillText(linked ? 'play something on your Mac' : 'media info unavailable', tx, y + dh * 0.62);
      return;
    }
    ctx.fillStyle = CK.c.fg;
    ctx.font = CK.font(Math.max(9, dh * 0.21), 'bold');
    marquee(ctx, np.title, tx, y + dh * 0.24, tw, 26);
    ctx.fillStyle = CK.c.text;
    ctx.font = CK.font(Math.max(8, dh * 0.15));
    marquee(ctx, np.artist + (np.album ? ' — ' + np.album : ''), tx, y + dh * 0.48, tw, 20);
    ctx.font = CK.font(Math.max(8, dh * 0.15), 'bold');
    ctx.fillStyle = CK.c.accent;
    ctx.fillText(counter, tx, y + dh * 0.72);
    ctx.fillStyle = CK.c.dim;
    ctx.font = CK.font(Math.max(8, dh * 0.14));
    ctx.fillText((np.playing ? '▶ ' : '❚❚ ') + clock(position()) + ' / ' + clock(np.duration), tx + dh * 0.62, y + dh * 0.72);
    var prog = np.duration ? position() / np.duration : 0;
    ctx.fillStyle = CK.rgba('dim', 0.25);
    ctx.fillRect(tx, y + dh * 0.87, tw, Math.max(2, dh * 0.035));
    ctx.fillStyle = CK.c.accent;
    ctx.fillRect(tx, y + dh * 0.87, tw * prog, Math.max(2, dh * 0.035));
  }

  // ------------------------------------------------------------------ frame
  CK.loop(function (dt) {
    S.fit();
    S.resized = false;
    var ctx = S.ctx, w = S.w, h = S.h, light = CK.lum('bg') > 0.5;
    t += dt;
    if (pressed.t > 0) pressed.t = Math.max(0, pressed.t - dt * 5);
    slide = Math.max(0, slide - dt * 2.5);
    ctx.fillStyle = CK.c.bg;
    ctx.fillRect(0, 0, w, h);

    var playing = !!(np && np.playing);
    // Reels turn at constant tape speed: the emptier reel spins faster.
    var chRef = Math.min(h, w / 1.6), hubR = chRef * 0.07, maxR = chRef * 0.22;
    var prog = np && np.duration ? position() / np.duration : 0;
    var rl = Math.sqrt(hubR * hubR + (maxR * maxR - hubR * hubR) * (1 - prog));
    var rr = Math.sqrt(hubR * hubR + (maxR * maxR - hubR * hubR) * prog);
    if (playing) { var v = chRef * 0.12; rotL -= v / rl * dt; rotR -= v / rr * dt; }

    // VU meters: smooth random targets while playing, fall back to rest when paused.
    vuClock -= dt;
    if (vuClock <= 0) {
      vuClock = 0.08;
      for (var c = 0; c < 2; c++) vuTarget[c] = playing ? 0.35 + 0.6 * Math.pow(Math.random(), 0.6) : 0;
    }
    for (c = 0; c < 2; c++) {
      vu[c] += (vuTarget[c] - vu[c]) * (1 - Math.exp(-dt / 0.06));
      peak[c] = Math.max(vu[c], peak[c] - dt * 0.35);
    }

    var wide = w > h * 2.1, cw, ch, cx, cy, bs, bx, byy, gap, vt = 0, vx = 0, disp = null;
    if (wide) {
      // [cassette] [display] [transport] [meters], like a car stereo
      ch = h * 0.8; cw = ch * 1.58;
      if (cw > w * 0.4) { cw = w * 0.4; ch = cw / 1.58; }
      cx = w * 0.02; cy = (h - ch) / 2;
      bs = Math.min(h * 0.38, w * 0.07);
      gap = bs * 0.22;
      vt = Math.max(3, bs * 0.14);
      vx = w - vt * 3.2 - w * 0.015;
      bx = vx - bs * 3 - gap * 2 - bs * 0.45;
      byy = (h - bs) / 2;
      var dx0 = cx + cw + w * 0.025, dw = bx - dx0 - w * 0.025;
      if (dw > 110) disp = { x: dx0, w: dw };
      else bx = cx + cw + Math.max(gap, (vx - cx - cw - bs * 3 - gap * 2) / 2);
    } else {
      cw = Math.min(w * 0.9, h * 0.62 * 1.58); ch = cw / 1.58;
      cx = (w - cw) / 2; cy = h * 0.05;
      bs = Math.min(cw * 0.2, (h - cy - ch) * 0.42);
      gap = bs * 0.3;
      bx = (w - bs * 3 - gap * 2) / 2;
      byy = cy + ch + (h - cy - ch) * 0.16;
    }
    label.style.display = wide ? 'none' : '';
    var off = slide > 0 ? -Math.pow(slide, 2) * ch * 0.5 : 0;
    if (np) {
      ctx.save();
      ctx.globalAlpha = 1 - slide * 0.6;
      drawCassette(ctx, cx, cy + off, cw, ch, light);
      ctx.restore();
    } else {
      drawEmpty(ctx, cx, cy, cw, ch);
    }
    for (var i = 0; i < 3; i++) drawButton(ctx, i, bx + i * (bs + gap), byy, bs, playing);

    var counter = ('000' + Math.floor(position() / 2) % 1000).slice(-3);
    ctx.textBaseline = 'middle';
    if (wide) {
      drawVu(ctx, vx, h * 0.12, h * 0.76, vt, vu[0], peak[0], true);
      drawVu(ctx, vx + vt * 1.8, h * 0.12, h * 0.76, vt, vu[1], peak[1], true);
      if (disp) drawDisplay(ctx, disp.x, h * 0.14, disp.w, h * 0.72, counter);
    } else {
      ctx.font = CK.font(Math.max(9, bs * 0.32), 'bold');
      var vy = byy + bs + (h - byy - bs) * 0.25, vlen = bs * 3 + gap * 2, vh = Math.max(3, Math.min(6, (h - vy) * 0.18));
      // Keep the bottom line free for the label.
      if (vy + vh * 2.7 < h - 20) {
        drawVu(ctx, bx, vy, vlen, vh, vu[0], peak[0], false);
        drawVu(ctx, bx, vy + vh * 1.7, vlen, vh, vu[1], peak[1], false);
      }
      ctx.textAlign = 'right';
      ctx.fillStyle = CK.c.accent;
      ctx.fillText(counter, w - 8, h - 10);
    }
    CK.resetCtx(ctx);

    var text = !np ? (linked ? '⏏ no tape' : '⏏ no media signal')
      : (playing ? '♪ ' : '❚❚ ') + clock(position()) + ' / ' + clock(np.duration) + (playing ? '' : ' · paused');
    if (text !== lastText) { lastText = text; label.textContent = text; }
  }, 30);
})();
</script>
