  var SHADER = {"id": "st-skurr", "title": ".-=its a skurr=-.", "author": "im_paul_hi", "url": "https://www.shadertoy.com/view/Ws2Bzw", "license": "default CC BY-NC-SA 3.0 + embedded MIT noise by Stefan Gustavson (keep notice)", "common": "", "passes": [{"name": "Image", "output": "image", "code": "/*\nprecision highp float;\nuniform vec2 iResolution;\nuniform float iTime;\nuniform float mod1;\nuniform float mod2;\nuniform float mod3;\nuniform float mod4;\nuniform float mod5;\nuniform float mod6;\nuniform float mod7;\nuniform float mod8;\nuniform float mod9;\n*/\n\n/*\n    -sdf functions from iq   \n    \n\n*/\n\n// https://www.shadertoy.com/view/MsjXRt\nvec4 HueShift (in vec3 Color, in float Shift)\n{\n    vec3 P = vec3(0.55735)*dot(vec3(0.55735),Color);\n    \n    vec3 U = Color-P;\n    \n    vec3 V = cross(vec3(0.55735),U);    \n\n    Color = U*cos(Shift*6.2832) + V*sin(Shift*6.2832) + P;\n    \n    return vec4(Color,1.0);\n}\n\n//\n// GLSL textureless classic 2D noise \"cnoise\",\n// with an RSL-style periodic variant \"pnoise\".\n// Author:  Stefan Gustavson (stefan.gustavson@liu.se)\n// Version: 2011-08-22\n//\n// Many thanks to Ian McEwan of Ashima Arts for the\n// ideas for permutation and gradient selection.\n//\n// Copyright (c) 2011 Stefan Gustavson. All rights reserved.\n// Distributed under the MIT license. See LICENSE file.\n// https://github.com/ashima/webgl-noise\n//\n\nvec4 mod289(vec4 x)\n{\n  return x - floor(x * (1.0 / 289.0)) * 289.0;\n}\n\nvec4 permute(vec4 x)\n{\n  return mod289(((x*34.0)+1.0)*x);\n}\n\nvec4 taylorInvSqrt(vec4 r)\n{\n  return 1.79284291400159 - 0.85373472095314 * r;\n}\n\nvec2 fade(vec2 t) {\n  return t*t*t*(t*(t*6.0-15.0)+10.0);\n}\n\n// Classic Perlin noise\nfloat cnoise(vec2 P)\n{\n  vec4 Pi = floor(P.xyxy) + vec4(0.0, 0.0, 1.0, 1.0);\n  vec4 Pf = fract(P.xyxy) - vec4(0.0, 0.0, 1.0, 1.0);\n  Pi = mod289(Pi); // To avoid truncation effects in permutation\n  vec4 ix = Pi.xzxz;\n  vec4 iy = Pi.yyww;\n  vec4 fx = Pf.xzxz;\n  vec4 fy = Pf.yyww;\n\n  vec4 i = permute(permute(ix) + iy);\n\n  vec4 gx = fract(i * (1.0 / 41.0)) * 2.0 - 1.0 ;\n  vec4 gy = abs(gx) - 0.5 ;\n  vec4 tx = floor(gx + 0.5);\n  gx = gx - tx;\n\n  vec2 g00 = vec2(gx.x,gy.x);\n  vec2 g10 = vec2(gx.y,gy.y);\n  vec2 g01 = vec2(gx.z,gy.z);\n  vec2 g11 = vec2(gx.w,gy.w);\n\n  vec4 norm = taylorInvSqrt(vec4(dot(g00, g00), dot(g01, g01), dot(g10, g10), dot(g11, g11)));\n  g00 *= norm.x;\n  g01 *= norm.y;\n  g10 *= norm.z;\n  g11 *= norm.w;\n\n  float n00 = dot(g00, vec2(fx.x, fy.x));\n  float n10 = dot(g10, vec2(fx.y, fy.y));\n  float n01 = dot(g01, vec2(fx.z, fy.z));\n  float n11 = dot(g11, vec2(fx.w, fy.w));\n\n  vec2 fade_xy = fade(Pf.xy);\n  vec2 n_x = mix(vec2(n00, n01), vec2(n10, n11), fade_xy.x);\n  float n_xy = mix(n_x.x, n_x.y, fade_xy.y);\n  return 2.3 * n_xy;\n}\n\n// https://www.shadertoy.com/view/4dsSzr\nvec3 ansiGradient(float t) {\n\treturn mod(floor(t * vec3(8.0, 4.0, 2.0)), 2.0);\n}\n\n// #define AA 0.005\n#define PI 3.14159\n#define TAU 2.0 * PI\n#define gridThickness 0.05\n\nvec3 headColor = vec3(0.45,0.21,0.67);\nvec3 bgColor = vec3(0.95,0.92,0.99);\nvec3 headGooColor = vec3(0.87,0.56,0.40);\nvec3 blackOutlineColor = vec3(0.23,0.24,0.21);\nvec3 gearCol1 = vec3(0.44,0.48,0.80);\nvec3 gearCol2 = vec3(0.36,0.83,0.99);\nvec3 col = vec3(0.95,0.92,0.99);\nfloat blackOutlineWidth = 0.02;\nvec3 mixedCol = vec3(0.0);\nfloat AA = 0.005;\n\n/*********************************************************\n**********************************************************\n**********************************************************\n**********************************************************/\n\nfloat linearStep(float begin, float end, float t) {\n    return clamp((t - begin) / (end - begin), 0.0, 1.0);\n}\n\nfloat map(float value, float min1, float max1, float min2, float max2) {\n  return min2 + (value - min1) * (max2 - min2) / (max1 - min1);\n}\n\nvec2 within(vec2 uv, vec4 rect) {\n    vec2 val = (uv-rect.xy)/(rect.zw-rect.xy);\n    // val.y = remap(val.y, 0.0, 1.0, 1.0, 0.0);\n    val.y = -val.y + 1.0;\n\treturn val;\n}\n\nfloat inside01(vec2 p) {\n    return step(0.0, p.x) * (1.0 - step(1.0, p.x)) * step(0.0, p.y) * (1.0 - step(1.0, p.y));\n}\n\nfloat insideY(vec2 p) {\n    return step(0.0, p.y) * (1.0 - step(1.0, p.y));\n}\n\nfloat insideX(vec2 p) {\n    return step(0.0, p.x) * (1.0 - step(1.0, p.x));\n}\n\nvoid addGrid(vec2 p, inout vec3 col) {\n    float all = inside01(p);\n    vec3 gridOutlineCol = vec3(1.0, 0.0, 0.0);\n    vec3 gridCol = vec3(0.0);\n\n    // add outline\n    float outline = step(p.x, gridThickness);\n    outline += step(1.0 - gridThickness, p.x);\n    outline += step(p.y, gridThickness);\n    outline += step(1.0 - gridThickness, p.y);\n\n    // p.y = -p.y;\n    // p.y += 1.0;\n\n    // float outline = step(0.0, p.y) * (1.0 - step(0.1, p.y));\n\n    col = mix(col, gridOutlineCol, outline * all);\n}\n\nfloat opSmoothUnion( float d1, float d2, float k ) {\n    float h = clamp( 0.5 + 0.5*(d2-d1)/k, 0.0, 1.0 );\n    return mix( d2, d1, h ) - k*h*(1.0-h); \n}\n\nvec3 returnDottedCol(vec2 p, vec3 bgCol, vec3 dotCol) {\n    vec3 dottedCol = vec3(0.0);\n\n    p *= 28.0;\n    p.x += 0.48;\n    p.y *= 2.49;\n    float yIndex = floor(p.y);\n    float xIndex = floor(p.x);\n    p = fract(p);\n\n    // float circle = smoothstep(mod1, mod2, length(p - vec2(0.5)));\n    // circle *= smoothstep(mod3, mod4, length(p - vec2(1.0, 0.0)));\n\n    float circleBool = 0.0;\n\n    float circle = smoothstep(0.3, 0.6, length(p - vec2(0.5)));\n\n    if(mod(xIndex, 2.0) == 0.0 && mod(yIndex, 2.0) == 0.0) {\n        circleBool = 0.0;\n    } else if(mod(xIndex, 2.0) != 0.0 && mod(yIndex, 2.0) == 0.0) {\n        circleBool = 1.0;\n    } else if(mod(xIndex, 2.0) == 0.0 && mod(yIndex, 2.0) != 0.0) {\n        circleBool = 1.0;\n    }\n\n    dottedCol = mix(bgCol, dotCol, (1.0 - circle) * circleBool);\n\n    return dottedCol;\n}\n\nfloat gain(float x, float k) \n{\n    float a = 0.5*pow(2.0*((x<0.5)?x:1.0-x), k);\n    return (x<0.5)?a:1.0-a;\n}\n\nfloat expImpulse( float x, float k )\n{\n    float h = k*x;\n    return h*exp(1.0-h);\n}\n\nfloat customEase(float x, float k) {\n    return pow(x, k);\n}\n\nfloat almostIdentity( float x, float m, float n )\n{\n    if( x>m ) return x;\n    float a = 2.0*n - m;\n    float b = 2.0*m - 3.0*n;\n    float t = x/m;\n    return (a*t + b)*t*t + n;\n}\n\nfloat undulateAngle(int index, float angle, float movementScale, float offsetScale, float timeScale) {\n    float offset = float(index) * offsetScale;\n    float m = angle + sin(iTime * timeScale + offset) * movementScale;\n    return m;\n}\n\n\n\n/*********************************************************\n**********************************************************\n**********************************************************\n**********************************************************/\n\nfloat sdCircle( in vec2 p, in float r ) \n{\n    return length(p)-r;\n}\n\nfloat sdCross( in vec2 p, in vec2 b, float r ) \n{\n    p = abs(p); p = (p.y>p.x) ? p.yx : p.xy;\n    vec2  q = p - b;\n    float k = max(q.y,q.x);\n    vec2  w = (k>0.0) ? q : vec2(b.y-p.x,-k);\n    return sign(k)*length(max(w,0.0)) + r;\n}\n\n\n\nfloat returnTween4Dist(vec2 p, float t, float circleRadius) {\n    // t = normalized time\n    vec2 from = vec2(0.5, 0.66);\n    vec2 to = vec2(0.5, 0.3);\n    float radius = (from.y - to.y) / 2.0;\n    float startAngle = (3.0 * PI) / 2.0;\n    float endAngle = PI;\n    float angle = map(t, 0.0, 1.0, startAngle, endAngle);\n    float angleOffset = -PI * 2.0;\n    // cycle through angle based on t\n    vec2 pos = vec2(sin(angle + angleOffset) * radius, cos(angle + angleOffset) * radius);\n    pos += 0.5;\n    float d = sdCircle(p - pos, circleRadius);\n    return d;\n}\n\nfloat returnTween5Dist(vec2 p, float t, float circleRadius) {\n    // t = normalized time\n    vec2 from = vec2(0.5, 0.32);\n    vec2 to = vec2(0.5, -0.3);\n    vec2 pos = mix(from, to, t);\n    float d = sdCircle(p - pos, circleRadius);\n    return d;\n}\n\nfloat returnTween1Dist(vec2 p, float t, float circleRadius) {\n    // t = normalized time\n    vec2 from = vec2(0.5, 1.0);\n    vec2 to = vec2(0.5, 0.66);\n    vec2 pos = mix(from, to, t);\n    float d = sdCircle(p - pos, circleRadius);\n    return d;\n}\n\nmat2 rotate2d(float _angle){\n    return mat2(cos(_angle),-sin(_angle),\n                sin(_angle),cos(_angle));\n}\n\nvoid makeSecondSwoop(vec2 p, inout float d, float loopTime, inout vec3 col, float time) {\n    p -= vec2(0.28, 0.02);\n    // p -= vec2(0.58, 0.02);  // debug view\n\n    for(int i = 0; i < 5; i++) {\n        float d1 = 0.0;\n        float margin = sin(float(i) + time) * 1.0;\n        float modTime = fract((time + margin) / loopTime);\n        float circleRadius = map(modTime, 0.0, 1.0, 0.0, 0.15);\n\n        if(modTime < 0.5) {\n            d1 = returnTween4Dist(p, linearStep(0.0, 0.5, modTime), circleRadius);\n        } else {\n            d1 = returnTween5Dist(p, linearStep(0.5, 1.0, modTime), circleRadius);\n        }\n       \n        // d1 = smoothstep(0.0, AA, d1);\n        // col = mix(col, vec3(1.0), 1.0 - d1);\n\n        if(i != 0) {\n            d = opSmoothUnion(d, d1, 0.04);\n        }\n    }\n}\n\nfloat returnTween2Dist(vec2 p, float t, float circleRadius) {\n    // t = normalized time\n    vec2 from = vec2(0.5, 0.66);\n    vec2 to = vec2(0.5, 0.33);\n    float radius = (from.y - to.y) / 2.0;\n    float startAngle = PI / 2.0;\n    float endAngle = (3.0 * PI) / 2.0;\n    float angle = map(t, 0.0, 1.0, startAngle, endAngle);\n    float angleOffset = -PI * 0.5;\n    // cycle through angle based on t\n    vec2 pos = vec2(sin(angle + angleOffset) * radius, cos(angle + angleOffset) * radius);\n    pos += 0.5;\n    float d = sdCircle(p - pos, circleRadius);\n    return d;\n}\n\nfloat returnTween3Dist(vec2 p, float t, float circleRadius) {\n    // t = normalized time\n    vec2 from = vec2(0.5, 0.33);\n    vec2 to = vec2(0.66, -0.1);\n    vec2 pos = mix(from, to, t);\n    float d = sdCircle(p - pos, circleRadius);\n    return d;\n}\n\nfloat sdBox( in vec2 p, in vec2 b, float r)\n{\n    vec2 d = abs(p) - (b - r);\n    return length(max(d,0.0)) + min(max(d.x,d.y),0.0) - r;\n}\n\n\nfloat sdSegment( in vec2 p, in vec2 a, in vec2 b )\n{\n    vec2 pa = p-a, ba = b-a;\n    float h = clamp( dot(pa,ba)/dot(ba,ba), 0.0, 1.0 );\n    return length( pa - ba*h );\n}\n\nfloat sdUnevenCapsule( vec2 p, float r1, float r2, float h )\n{\n    p.x = abs(p.x);\n    float b = (r1-r2)/h;\n    float a = sqrt(1.0-b*b);\n    float k = dot(p,vec2(-b,a));\n    if( k < 0.0 ) return length(p) - r1;\n    if( k > a*h ) return length(p-vec2(0.0,h)) - r2;\n    return dot(p, vec2(a,b) ) - r1;\n}\n\n\n\nfloat opSmoothSubtraction( float d1, float d2, float k ) {\n    float h = clamp( 0.5 - 0.5*(d2+d1)/k, 0.0, 1.0 );\n    return mix( d2, -d1, h ) + k*h*(1.0-h); \n}\n\nfloat opSubtraction( float d1, float d2 ) { return max(-d1,d2); }\n\nfloat sdRoundBox( in vec2 p, in vec2 b, in vec4 r ) \n{\n    r.xy = (p.x>0.0)?r.xy : r.zw;\n    r.x  = (p.y>0.0)?r.x  : r.y;\n    \n    vec2 q = abs(p)-b+r.x;\n    return min(max(q.x,q.y),0.0) + length(max(q,0.0)) - r.x;\n}\n\nfloat sdTriangle( in vec2 p, in vec2 p0, in vec2 p1, in vec2 p2 )\n{\n    vec2 e0 = p1-p0, e1 = p2-p1, e2 = p0-p2;\n    vec2 v0 = p -p0, v1 = p -p1, v2 = p -p2;\n    vec2 pq0 = v0 - e0*clamp( dot(v0,e0)/dot(e0,e0), 0.0, 1.0 );\n    vec2 pq1 = v1 - e1*clamp( dot(v1,e1)/dot(e1,e1), 0.0, 1.0 );\n    vec2 pq2 = v2 - e2*clamp( dot(v2,e2)/dot(e2,e2), 0.0, 1.0 );\n    float s = sign( e0.x*e2.y - e0.y*e2.x );\n    vec2 d = min(min(vec2(dot(pq0,pq0), s*(v0.x*e0.y-v0.y*e0.x)),\n                     vec2(dot(pq1,pq1), s*(v1.x*e1.y-v1.y*e1.x))),\n                     vec2(dot(pq2,pq2), s*(v2.x*e2.y-v2.y*e2.x)));\n    return -sqrt(d.x)*sign(d.y);\n}\n\nfloat dot2(in vec2 v ) { return dot(v,v); }\n\n// trapezoid / capped cone, specialized for Y alignment\nfloat sdTrapezoid( in vec2 p, in float r1, float r2, float he )\n{\n    vec2 k1 = vec2(r2,he);\n    vec2 k2 = vec2(r2-r1,2.0*he);\n\n\tp.x = abs(p.x);\n    vec2 ca = vec2(max(0.0,p.x-((p.y<0.0)?r1:r2)), abs(p.y)-he);\n    vec2 cb = p - k1 + k2*clamp( dot(k1-p,k2)/dot2(k2), 0.0, 1.0 );\n    \n    float s = (cb.x < 0.0 && ca.y < 0.0) ? -1.0 : 1.0;\n    \n    return s*sqrt( min(dot2(ca),dot2(cb)) );\n}\n\nfloat sdArc( in vec2 p, in vec2 sca, in vec2 scb, in float ra, float rb )\n{\n    p *= mat2(sca.x,sca.y,-sca.y,sca.x);\n    p.x = abs(p.x);\n    float k = (scb.y*p.x>scb.x*p.y) ? dot(p.xy,scb) : length(p.xy);\n    return sqrt( dot(p,p) + ra*ra - 2.0*ra*k ) - rb;\n}\n\nfloat sdBezier( in vec2 pos, in vec2 A, in vec2 B, in vec2 C )\n{    \n    vec2 a = B - A;\n    vec2 b = A - 2.0*B + C;\n    vec2 c = a * 2.0;\n    vec2 d = A - pos;\n    float kk = 1.0/dot(b,b);\n    float kx = kk * dot(a,b);\n    float ky = kk * (2.0*dot(a,a)+dot(d,b)) / 3.0;\n    float kz = kk * dot(d,a);      \n    float res = 0.0;\n    float p = ky - kx*kx;\n    float p3 = p*p*p;\n    float q = kx*(2.0*kx*kx-3.0*ky) + kz;\n    float h = q*q + 4.0*p3;\n    if( h >= 0.0) \n    { \n        h = sqrt(h);\n        vec2 x = (vec2(h,-h)-q)/2.0;\n        vec2 uv = sign(x)*pow(abs(x), vec2(1.0/3.0));\n        float t = clamp( uv.x+uv.y-kx, 0.0, 1.0 );\n        res = dot2(d + (c + b*t)*t);\n    }\n    else\n    {\n        float z = sqrt(-p);\n        float v = acos( q/(p*z*2.0) ) / 3.0;\n        float m = cos(v);\n        float n = sin(v)*1.732050808;\n        vec3  t = clamp(vec3(m+m,-n-m,n-m)*z-kx,0.0,1.0);\n        res = min( dot2(d+(c+b*t.x)*t.x),\n                   dot2(d+(c+b*t.y)*t.y) );\n        // the third root cannot be the closest\n        // res = min(res,dot2(d+(c+b*t.z)*t.z));\n    }\n    return sqrt( res );\n}\n\n/*********************************************************\n**********************************************************\n**********************************************************\n******************************************************     // Pixel budget keeps heavy raymarchers smooth on Retina or very large panels.
    var budget = opts.maxPixels || 600000;
    if (cw * ch * scale * scale > budget) scale = Math.sqrt(budget / (cw * ch));
    var w = Math.max(1, Math.round(cw * scale));
    var h = Math.max(1, Math.round(ch * scale));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    ensureBuffers(w, h);
    return [w, h];
  }

  function bindInputs(pass) {
    for (var c = 0; c < 4; c++) {
      var inp = pass.byChannel[c], res = null, target = gl.TEXTURE_2D, hasMips = false;
      gl.activeTexture(gl.TEXTURE0 + c);
      chanRes[c * 3] = chanRes[c * 3 + 1] = chanRes[c * 3 + 2] = 0;
      if (inp) {
        if (inp.kind === 'buffer') {
          var b = buffers[inp.buffer];
          if (b && b.pair) {
            res = { tex: b.pair[b.cur].tex, target: gl.TEXTURE_2D };
            hasMips = b.wantMips;
            chanRes[c * 3] = b.w; chanRes[c * 3 + 1] = b.h; chanRes[c * 3 + 2] = 1;
          }
        } else if (inp.res) {
          res = inp.res; target = res.target; hasMips = res.mips;
          chanRes[c * 3] = res.w; chanRes[c * 3 + 1] = res.h; chanRes[c * 3 + 2] = res.d;
        }
      }
      if (res) {
        gl.bindTexture(res.target, res.tex);
        var filter = inp.filter || 'linear';
        if (inp.kind === 'buffer' && filter !== 'nearest' && !rtFormat.linear) filter = 'nearest';
        applySampler(res.target, filter, isGL2 || res.target !== gl.TEXTURE_2D || inp.kind !== 'buffer' ? inp.wrap : 'clamp', hasMips);
      } else {
        gl.bindTexture(gl.TEXTURE_2D, null);
      }
      gl.uniform1i(pass.u.ch[c], c);
    }
  }

  function draw(now) {
    var dt = lastNow ? Math.min((now - lastNow) / 1000, 0.1) : 1 / 60;
    lastNow = now;
    fpsAcc += dt; fpsFrames++;
    if (fpsAcc > 0.5) { fps = fpsFrames / fpsAcc; fpsAcc = 0; fpsFrames = 0; debug.fps = Math.round(fps); }

    updateReactivity(now, dt);
    var simDt = dt * react.speed;
    simTime += simDt;
    if (audioTex) updateFakeAudio(simTime);

    var size = resize(), w = size[0], h = size[1];
    var date = new Date();
    var secs = date.getHours() * 3600 + date.getMinutes() * 60 + date.getSeconds() + date.getMilliseconds() / 1000;
    for (var c = 0; c < 4; c++) chanTime[c] = simTime;
    if (!clickFrame) mouse[3] = -Math.abs(mouse[3]);

    for (var i = 0; i < passes.length; i++) {
      var p = passes[i], target = null, b = null;
      if (p.output !== 'image') { b = buffers[p.output]; target = b.pair[1 - b.cur]; }
      gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fb : null);
      gl.viewport(0, 0, w, h);
      gl.useProgram(p.prog);
      bindInputs(p);
      gl.uniform3f(p.u.iResolution, w, h, 1);
      gl.uniform1f(p.u.iTime, simTime);
      gl.uniform1f(p.u.iTimeDelta, simDt);
      gl.uniform1f(p.u.iFrameRate, fps);
      gl.uniform1i(p.u.iFrame, frameNo);
      gl.uniform4f(p.u.iMouse, mouse[0], mouse[1], mouse[2], mouse[3]);
      gl.uniform4f(p.u.iDate, date.getFullYear(), date.getMonth(), date.getDate(), secs);
      gl.uniform1f(p.u.iSampleRate, 44100);
      gl.uniform4f(p.u.iMoltamp, react.energy, react.speed, (STATES[react.state] || STATES.unknown).code, react.pulse);
      if (p.u.iChannelTime) gl.uniform1fv(p.u.iChannelTime, chanTime);
      if (p.u.iChannelResolution) gl.uniform3fv(p.u.iChannelResolution, chanRes);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      if (b) {
        b.cur = 1 - b.cur;
        if (b.wantMips) { gl.bindTexture(gl.TEXTURE_2D, b.pair[b.cur].tex); gl.generateMipmap(gl.TEXTURE_2D); }
      }
    }
    clickFrame = false;
    frameNo++;
    debug.frame = frameNo;
  }

  var lastDraw = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    if (contextLost || gl.isContextLost()) { lastNow = 0; return; }
    if (!started) {
      if (ext.parallel && !passes.every(function (p) { return gl.getProgramParameter(p.prog, ext.parallel.COMPLETION_STATUS_KHR); })) return;
      started = true;
      if (!finishLink()) { started = 'failed'; return; }
      debug.ready = true;
    }
    if (started !== true || !isVisible()) { lastNow = 0; return; }
    var cap = opts.fpsCap || 60;
    if (now - lastDraw < 1000 / cap - 2) return;
    lastDraw = now;
    draw(now);
  }

  // Per-widget overrides persisted with moltamp.settings: { scale, maxPixels, fpsCap, speed, reactive }.
  (function () {
    if (!window.moltamp || !moltamp.settings) { requestAnimationFrame(loop); return; }
    moltamp.settings.read().then(function (saved) {
      saved = saved || {};
      ['scale', 'maxPixels', 'fpsCap', 'speed', 'reactive'].forEach(function (k) { if (saved[k] !== undefined) opts[k] = saved[k]; });
      reactive = opts.reactive !== false;
    }).catch(function () { /* first run: no settings yet */ }).then(function () { requestAnimationFrame(loop); });
  })();
})();

</script>
