<!--
  Taxi Meter — Mission Control pack for MOLTamp
  A retro taxi meter for your Claude session: the fare rolls on mechanical drums while Claude works, with tokens, API time, the hourly rate and a lifetime odometer. The roof lamp tells you whether Claude is for hire, on a fare or out of service.
  Author: j0j0 · License: MIT
-->
<div id="cy-root"><canvas id="cy-canvas"></canvas><div id="cy-label"></div></div>

<style>
  #cy-root { position: absolute; inset: 0; overflow: hidden; background: var(--c-chrome-bg); container-type: size; }
  #cy-canvas { display: block; width: 100%; height: 100%; }
  #cy-label {
    position: absolute; left: 8px; bottom: 6px; pointer-events: none; letter-spacing: 0.08em;
    color: var(--c-chrome-dim); text-shadow: 0 0 6px var(--c-chrome-bg);
    font: calc(clamp(8px, 3.4cqw, 12px) * var(--user-text-scale, 1)) 'SF Mono', Menlo, 'Hiragino Sans', monospace;
  }
</style>

<script>
// cyber-kit — shared runtime of the Cyberpunk widget pack (MIT, j0j0).
// Skin colours resolved for canvas use, DPR-aware canvas, pause when hidden, Claude state, telemetry.
var CK = (function () {
  'use strict';

  var hasSdk = typeof window.moltamp !== 'undefined';

  // ------------------------------------------------------------------ skin colours
  var VARS = {
    bg: '--c-chrome-bg', text: '--c-chrome-text', accent: '--c-chrome-accent', dim: '--c-chrome-dim',
    border: '--c-chrome-border', fg: '--t-foreground', termBg: '--t-background', red: '--t-red',
    green: '--t-green', yellow: '--t-yellow', blue: '--t-blue', cyan: '--t-cyan', magenta: '--t-magenta'
  };
  // A colour missing from the skin borrows another skin colour, never a hardcoded value.
  var BORROW = {
    text: ['fg', 'accent'], fg: ['text', 'accent'], accent: ['text', 'fg'], dim: ['text', 'fg'], border: ['dim', 'text'],
    bg: ['termBg'], termBg: ['bg'], red: ['magenta', 'accent'], green: ['cyan', 'accent'], yellow: ['accent', 'red'],
    blue: ['cyan', 'accent'], cyan: ['blue', 'accent'], magenta: ['red', 'accent']
  };
  var probeEl = document.createElement('span');
  probeEl.style.display = 'none';
  (document.body || document.documentElement).appendChild(probeEl);
  var pc = document.createElement('canvas');
  pc.width = pc.height = 1;
  var pctx = pc.getContext('2d', { willReadFrequently: true });
  var rgb = {};
  var c = {};

  // Resolves any CSS colour the skin may use (hex, rgb, var(), color-mix()) to RGB bytes.
  function readVar(name) {
    var raw = getComputedStyle(document.documentElement).getPropertyValue(VARS[name]).trim();
    if (!raw) return null;
    probeEl.style.color = '';
    probeEl.style.color = raw;
    var computed = getComputedStyle(probeEl).color;
    pctx.fillStyle = '#010203';
    pctx.fillStyle = computed;
    if (pctx.fillStyle === '#010203' && computed !== 'rgb(1, 2, 3)') return null;
    pctx.clearRect(0, 0, 1, 1);
    pctx.fillRect(0, 0, 1, 1);
    var d = pctx.getImageData(0, 0, 1, 1).data;
    return [d[0], d[1], d[2]];
  }

  function refreshColors() {
    var name, raw = {};
    for (name in VARS) raw[name] = readVar(name);
    for (name in VARS) {
      var v = raw[name], chain = BORROW[name] || [];
      for (var i = 0; !v && i < chain.length; i++) v = raw[chain[i]];
      if (!v) {
        // Last resort: the host's own text colour, still a skin value.
        probeEl.style.color = '';
        var m = /(\d+)\D+(\d+)\D+(\d+)/.exec(getComputedStyle(document.body || document.documentElement).color) || [0, 128, 128, 128];
        v = [+m[1], +m[2], +m[3]];
      }
      rgb[name] = v;
      c[name] = 'rgb(' + v[0] + ',' + v[1] + ',' + v[2] + ')';
    }
  }
  refreshColors();

  function rgba(name, a) {
    var v = rgb[name] || rgb.text;
    return 'rgba(' + v[0] + ',' + v[1] + ',' + v[2] + ',' + a + ')';
  }

  function mix(a, b, t, alpha) {
    var x = rgb[a] || rgb.text, y = rgb[b] || rgb.text;
    var r = Math.round(x[0] + (y[0] - x[0]) * t), g = Math.round(x[1] + (y[1] - x[1]) * t), bl = Math.round(x[2] + (y[2] - x[2]) * t);
    return alpha === undefined ? 'rgb(' + r + ',' + g + ',' + bl + ')' : 'rgba(' + r + ',' + g + ',' + bl + ',' + alpha + ')';
  }

  function lum(name) {
    var v = rgb[name] || rgb.text;
    return (0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2]) / 255;
  }

  // ------------------------------------------------------------------ sdk wrappers
  // moltamp.poll only: it cleans itself up when the widget unloads (store rule: no raw setInterval).
  function poll(ms, fn) {
    if (hasSdk && moltamp.poll) return moltamp.poll(ms, fn);
    return function () {};
  }

  function subscribe(store, selector, cb) {
    if (!hasSdk || !moltamp.subscribe) return function () {};
    try { return moltamp.subscribe(store, selector, cb) || function () {}; } catch (e) { return function () {}; }
  }

  function call(channel) {
    if (!hasSdk || !moltamp.call) return Promise.reject(new Error('no sdk'));
    try { return Promise.resolve(moltamp.call.apply(moltamp, arguments)); } catch (e) { return Promise.reject(e); }
  }

  // ------------------------------------------------------------------ text scale (Settings > Display)
  var textScale = 1;
  if (hasSdk && moltamp.settings) {
    moltamp.settings.read().then(function (cfg) {
      cfg = cfg || {};
      if (typeof cfg.widgetTextScale === 'number') textScale = cfg.widgetTextScale;
      document.documentElement.style.setProperty('--user-text-scale', String(textScale));
    }).catch(function () { /* first run: no settings */ });
  }

  function font(size, weight) {
    return (weight || 'normal') + ' ' + Math.max(7, size * textScale).toFixed(1) +
      'px "SF Mono", Menlo, "Hiragino Sans", "Hiragino Kaku Gothic ProN", monospace';
  }

  // ------------------------------------------------------------------ Claude shell state
  var STATES = ['idle', 'thinking', 'streaming', 'tool-use', 'permission', 'error', 'complete'];
  var state = { name: 'idle', since: performance.now(), seen: false };
  var stateListeners = [];
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.type !== 'moltamp:push' || d.subscriptionId !== 'shell-state' || STATES.indexOf(d.data) < 0) return;
    var prev = state.name;
    state.name = d.data;
    state.since = performance.now();
    state.seen = true;
    for (var i = 0; i < stateListeners.length; i++) {
      try { stateListeners[i](state.name, prev); } catch (err) { /* keep other listeners alive */ }
    }
  });

  function currentState() {
    // "complete" is a moment, not a mode: fall back to idle after a few seconds.
    if (state.name === 'complete' && performance.now() - state.since > 4000) return 'idle';
    return state.name;
  }

  // ------------------------------------------------------------------ terminal telemetry
  var tel = { bytes: 0, activity: 'idle', level: 0, started: false };
  function telemetry() {
    if (!tel.started) {
      tel.started = true;
      subscribe('telemetry', 'bytesPerSec', function (v) { tel.bytes = Number(v) || 0; });
      subscribe('telemetry', 'activity', function (v) { tel.activity = v || 'idle'; });
    }
    return tel;
  }

  // 0..1 terminal energy, log-scaled bytes plus the activity level, smoothed by the caller's dt.
  function telemetryLevel(dt) {
    var target = Math.min(1, Math.log(1 + tel.bytes) / Math.log(1 + 200000)) * 0.75 +
      (tel.activity === 'high' ? 0.35 : tel.activity === 'low' ? 0.15 : 0);
    tel.level += (Math.min(1, target) - tel.level) * (1 - Math.exp(-(dt || 0.016) / 0.5));
    return tel.level;
  }

  // ------------------------------------------------------------------ Claude Code hook events
  // event.events is a ring buffer of the last ~200 hook payloads from every session; callers only
  // want what is new, so entries are de-duplicated by timestamp, hook, tool and session.
  var evSeen = {}, evQueue = [], evListeners = [], evStarted = false;
  function eventKey(e) { return [e._ts, e._hook || e.hook_event_name, e.tool_name, e._session || e.session_id].join('|'); }
  function onEvents(cb) {
    evListeners.push(cb);
    if (evStarted) return;
    evStarted = true;
    var first = true;
    subscribe('event', 'events', function (v) {
      var list = Array.isArray(v) ? v : v && typeof v === 'object' ? Object.keys(v).map(function (k) { return v[k]; }) : [];
      var fresh = [];
      for (var i = 0; i < list.length; i++) {
        var e = list[i];
        if (!e || typeof e !== 'object') continue;
        var k = eventKey(e);
        if (evSeen[k]) continue;
        evSeen[k] = true;
        evQueue.push(k);
        fresh.push(e);
      }
      while (evQueue.length > 800) delete evSeen[evQueue.shift()];
      var history = first;
      first = false;
      if (fresh.length) for (var j = 0; j < evListeners.length; j++) {
        try { evListeners[j](fresh, history); } catch (err) { /* keep other listeners alive */ }
      }
    });
  }

  // A failure is read from the tool's response or the hook name, never from its input
  // (a command that merely contains the word "error" is not a failure).
  function isFailure(e) {
    var hook = String(e.hook_event_name || e._hook || '');
    if (/fail|error/i.test(hook)) return true;
    var r = e.tool_response;
    if (!r || typeof r !== 'object') return false;
    if (r.is_error === true || r.isError === true || r.success === false || r.interrupted === true) return true;
    var code = r.exitCode !== undefined ? r.exitCode : r.exit_code !== undefined ? r.exit_code : r.code;
    if (typeof code === 'number' && code !== 0) return true;
    return typeof r.error === 'string' && r.error.length > 0;
  }

  function toolLabel(name) {
    name = String(name || '?');
    if (name.indexOf('mcp__') !== 0) return name;
    // mcp__plugin_chrome-devtools-mcp_chrome-devtools__take_screenshot -> chrome-devtools
    var server = name.split('__')[1] || 'mcp';
    server = server.replace(/^plugin_/, '').replace(/^claude_ai_/, '').split('_').pop();
    return 'mcp:' + server;
  }

  // ------------------------------------------------------------------ canvas + loop
  // Paused while off screen (hidden tab) or while the whole page is hidden; both must clear to resume.
  var onScreen = true, pageVisible = !document.hidden, watching = false;
  function visibleNow() { return onScreen && pageVisible; }
  function watch(el) {
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (entries) { onScreen = entries[entries.length - 1].isIntersecting; }).observe(el);
    }
    if (!watching) {
      watching = true;
      document.addEventListener('visibilitychange', function () { pageVisible = !document.hidden; });
    }
  }

  function surface(el) {
    var s = { el: el, ctx: el.getContext('2d'), w: 0, h: 0, dpr: 1, resized: true };
    s.fit = function () {
      var dpr = Math.min(2, window.devicePixelRatio || 1);
      var w = Math.max(1, el.clientWidth), h = Math.max(1, el.clientHeight);
      if (w !== s.w || h !== s.h || dpr !== s.dpr) {
        s.w = w; s.h = h; s.dpr = dpr;
        el.width = Math.round(w * dpr);
        el.height = Math.round(h * dpr);
        s.resized = true;
      }
      s.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return s;
    };
    watch(el);
    return s;
  }

  function loop(fn, fpsCap) {
    var last = 0, lastDraw = 0, logged = false, cap = fpsCap || 60;
    function frame(now) {
      requestAnimationFrame(frame);
      if (!visibleNow()) { last = 0; return; }
      if (now - lastDraw < 1000 / cap - 2) return;
      var dt = last ? Math.min((now - last) / 1000, 0.1) : 1 / 60;
      last = lastDraw = now;
      try { fn(dt, now / 1000); } catch (e) {
        if (!logged) { logged = true; console.error('[cyber-kit]', e); }
      }
    }
    requestAnimationFrame(frame);
  }

  function resetCtx(ctx) {
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.shadowBlur = 0;
    ctx.lineWidth = 1;
    ctx.setLineDash([]);
  }

  // ------------------------------------------------------------------ small utils
  function hash(str) {
    var h = 2166136261;
    str = String(str);
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return ((h >>> 0) % 100000) / 100000;
  }

  function prng(seed) {
    var a = (seed * 4294967296) >>> 0 || 1;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = Math.imul(a ^ (a >>> 15), a | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function fmtBytes(b) {
    if (hasSdk && moltamp.fmt && moltamp.fmt.bytes) return moltamp.fmt.bytes(b);
    var u = ['B', 'KB', 'MB', 'GB'], i = 0;
    while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
    return b.toFixed(i ? 1 : 0) + ' ' + u[i];
  }

  // Skin switches update CSS variables live; re-resolve once a second.
  poll(1000, refreshColors);

  return {
    c: c, rgb: rgb, rgba: rgba, mix: mix, lum: lum, refreshColors: refreshColors,
    poll: poll, subscribe: subscribe, call: call, font: font,
    state: currentState, stateInfo: state, onState: function (cb) { stateListeners.push(cb); },
    telemetry: telemetry, telemetryLevel: telemetryLevel,
    onEvents: onEvents, isFailure: isFailure, toolLabel: toolLabel,
    surface: surface, loop: loop, resetCtx: resetCtx, isVisible: visibleNow,
    hash: hash, prng: prng, fmtBytes: fmtBytes,
    meta: (hasSdk && moltamp.meta) || { context: 'panel' }
  };
})();

// Taxi Meter: stats.read cost, tokens and API time on a retro meter with rolling mechanical drums.
(function () {
  'use strict';
  var S = CK.surface(document.getElementById('cy-canvas'));
  var label = document.getElementById('cy-label');
  var RATE_WINDOW = 10 * 60e3;
  var data = { fare: null, tokens: null, api: null, total: null, model: '' }, shown = { fare: 0, total: 0 };
  var samples = [], linked = false, t = 0, lastText = '', paid = 0;

  function num(v) {
    if (typeof v === 'string') v = parseFloat(v.replace(/[$,\s]/g, ''));
    return typeof v === 'number' && isFinite(v) ? v : null;
  }
  function pick(o, paths) {
    for (var i = 0; i < paths.length; i++) {
      var v = o, parts = paths[i].split('.');
      for (var j = 0; j < parts.length && v !== null && v !== undefined; j++) v = v[parts[j]];
      v = num(v);
      if (v !== null) return v;
    }
    return null;
  }
  // "claude-opus-5-5" -> "OPUS 5.5"
  function plate(m) {
    m = m && typeof m === 'object' ? m.display_name || m.id || '' : String(m || '');
    var x = /(opus|sonnet|haiku|fable)[-\s]?(\d+)(?:[-.](\d+))?/i.exec(m);
    return x ? (x[1] + ' ' + x[2] + (x[3] ? '.' + x[3] : '')).toUpperCase() : m.replace(/^claude-/i, '').toUpperCase().slice(0, 14);
  }

  function read() {
    CK.call('stats.read').then(function (s) {
      s = s || {};
      data.fare = pick(s, ['cost', 'cost.total_cost_usd', 'cost.totalCostUsd', 'costUsd', 'cost_usd', 'totalCost', 'sessionCost']);
      var tin = pick(s, ['tokensIn', 'tokens_in', 'inputTokens']), tout = pick(s, ['tokensOut', 'tokens_out', 'outputTokens']);
      data.tokens = tin !== null || tout !== null ? (tin || 0) + (tout || 0) : pick(s, ['tokens']);
      data.api = pick(s, ['apiTime', 'api_time', 'cost.total_api_duration_ms']);
      data.total = pick(s, ['totalTokens', 'total_tokens']);
      data.model = plate(s.model);
      linked = data.fare !== null;
      if (linked) {
        var now = Date.now();
        // A lower fare means a new session started: restart the rate measurement.
        if (samples.length && data.fare < samples[samples.length - 1][1]) samples = [];
        samples.push([now, data.fare]);
        while (samples.length && now - samples[0][0] > RATE_WINDOW) samples.shift();
      }
    }).catch(function () { linked = false; });
  }
  read();
  CK.poll(3000, read);
  CK.onState(function (st) { if (st === 'complete') paid = 1; });

  function perHour() {
    if (samples.length < 3) return null;
    var a = samples[0], b = samples[samples.length - 1], dt = (b[0] - a[0]) / 3600e3;
    return dt > 1 / 60 ? (b[1] - a[1]) / dt : null;
  }
  function hms(ms) {
    var s = Math.floor(ms / 1000), hh = Math.floor(s / 3600), mm = Math.floor(s % 3600 / 60), ss = s % 60;
    return (hh ? hh + ':' : '') + ('0' + mm).slice(-2) + ':' + ('0' + ss).slice(-2);
  }
  function kfmt(n) { return n >= 1e6 ? (n / 1e6).toFixed(n >= 1e8 ? 0 : 1) + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'k' : String(Math.round(n)); }

  // Mechanical drums: the lowest one rolls continuously, each higher one turns while the one below passes 9 -> 0.
  function drums(ctx, v, n, x, y, cw, ch, dec, on, colors) {
    for (var i = 0; i < n; i++) {
      var dx = x + (n - 1 - i) * cw, p = v / Math.pow(10, i), d = Math.floor(p) % 10, r;
      if (i === 0) r = p - Math.floor(p);
      else { var lo = v / Math.pow(10, i - 1); r = Math.floor(lo) % 10 === 9 ? lo - Math.floor(lo) : 0; }
      var g = ctx.createLinearGradient(0, y, 0, y + ch);
      g.addColorStop(0, colors.drumEdge); g.addColorStop(0.5, colors.drum); g.addColorStop(1, colors.drumEdge);
      ctx.fillStyle = g;
      ctx.fillRect(dx + 1, y, cw - 2, ch);
      ctx.save();
      ctx.beginPath(); ctx.rect(dx + 1, y, cw - 2, ch); ctx.clip();
      ctx.fillStyle = colors.digit;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = CK.font(ch * 0.78, 'bold');
      // Leading zeros stay blank on the integer part
      var lead = i > dec && v < Math.pow(10, i);
      if (on && !lead) {
        ctx.fillText(String(d), dx + cw / 2, y + ch / 2 - r * ch);
        ctx.fillText(String((d + 1) % 10), dx + cw / 2, y + ch / 2 + ch - r * ch);
      } else if (!on) {
        ctx.fillText('-', dx + cw / 2, y + ch / 2);
      }
      ctx.restore();
      if (dec && i === dec) {
        var dot = Math.max(3, ch * 0.08);
        ctx.fillStyle = CK.c.accent;
        ctx.beginPath(); ctx.arc(dx + cw, y + ch - dot * 1.2, dot / 2, 0, 6.283); ctx.fill();
      }
    }
  }

  function lamp(ctx, x, y, w, h, st) {
    var on = !linked ? ['回送', 'OUT OF SERVICE', 'yellow'] : paid > 0.05 ? ['支払', 'PAY', 'cyan'] :
      st === 'idle' || st === 'complete' ? ['空車', 'FOR HIRE', 'red'] : st === 'permission' ? ['停車', 'WAITING FOR YOU', 'magenta'] :
      st === 'error' ? ['故障', 'BREAKDOWN', 'red'] : ['賃走', 'ON FARE', 'green'];
    var blink = st === 'permission' || st === 'error' ? Math.sin(t * 6) > 0 : true;
    ctx.fillStyle = CK.mix('bg', 'fg', 0.06);
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = CK.rgba(on[2], 0.6);
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    if (blink) {
      var g = ctx.createRadialGradient(x + w / 2, y + h / 2, 0, x + w / 2, y + h / 2, w / 1.6);
      g.addColorStop(0, CK.rgba(on[2], 0.35));
      g.addColorStop(1, CK.rgba(on[2], 0));
      ctx.fillStyle = g;
      ctx.fillRect(x, y, w, h);
    }
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = blink ? CK.c[on[2]] : CK.rgba(on[2], 0.35);
    var big = Math.min(h * 0.55, w / 3.2);
    ctx.font = CK.font(big, 'bold');
    ctx.fillText(on[0], x + w / 2, y + h * (h > 34 ? 0.4 : 0.5));
    if (h > 34) {
      ctx.font = CK.font(Math.min(h * 0.18, w / 11));
      ctx.fillText(on[1], x + w / 2, y + h * 0.78);
    }
  }

  function small(ctx, title, value, x, y, w, size) {
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.font = CK.font(Math.max(7, size * 0.62));
    ctx.fillStyle = CK.c.dim;
    ctx.fillText(title, x, y);
    ctx.font = CK.font(size, 'bold');
    ctx.fillStyle = CK.c.text;
    ctx.fillText(value, x, y + size * 0.85);
  }

  CK.loop(function (dt) {
    S.fit();
    S.resized = false;
    var ctx = S.ctx, w = S.w, h = S.h, st = CK.state(), light = CK.lum('bg') > 0.5;
    t += dt;
    paid *= Math.exp(-dt * 0.5);
    var ease = 1 - Math.exp(-dt / 0.7);
    ['fare', 'total'].forEach(function (k) {
      // Drum units: cents for the fare, tenths of a million tokens for the odometer.
      var target = data[k] === null ? 0 : k === 'fare' ? data[k] * 100 : data[k] / 1e6 * 10;
      shown[k] += (target - shown[k]) * ease;
      if (Math.abs(target - shown[k]) < 0.002) shown[k] = target;
    });
    var colors = {
      drum: light ? CK.mix('bg', 'fg', 0.82) : CK.mix('bg', 'fg', 0.08),
      drumEdge: light ? CK.mix('bg', 'fg', 0.95) : CK.mix('bg', 'termBg', 0.5),
      digit: light ? CK.c.bg : CK.c.fg
    };

    ctx.fillStyle = CK.c.bg;
    ctx.fillRect(0, 0, w, h);
    // Casing
    var m = Math.max(4, Math.min(w, h) * 0.05), bx = m, by = m, bw = w - 2 * m, bh = h - 2 * m;
    ctx.fillStyle = CK.mix('bg', 'dim', 0.1);
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = CK.rgba('dim', 0.45);
    ctx.lineWidth = 1.5;
    ctx.strokeRect(bx + 0.5, by + 0.5, bw - 1, bh - 1);

    var wide = bw > bh * 2.2, rate = perHour(), on = data.fare !== null;
    // The wide meter already shows every readout; the label line would cover the roof lamp.
    if (wide !== label.hidden) label.hidden = wide;
    if (wide) {
      // Lamp | fare drums | small readouts
      var lw = Math.min(bw * 0.2, bh * 1.6), ch = Math.min(bh * 0.62, (bw - lw) / 9.5), cw = ch * 0.68;
      lamp(ctx, bx + m, by + m, lw, bh - 2 * m, st);
      var fx = bx + lw + m * 2.5, fy = by + (bh - ch) / 2;
      ctx.fillStyle = CK.c.dim;
      ctx.font = CK.font(Math.max(7, ch * 0.24));
      ctx.textAlign = 'left';
      ctx.textBaseline = 'bottom';
      ctx.fillText('料金 FARE $', fx, fy - 2);
      drums(ctx, shown.fare, 6, fx, fy, cw, ch, 2, on, colors);
      var sx = fx + cw * 6 + m * 2, size = Math.max(8, Math.min(bh * 0.17, (bx + bw - sx) / 8));
      if (bx + bw - sx > 60) {
        small(ctx, 'TOKENS', data.tokens !== null ? kfmt(data.tokens) : '--', sx, by + m, 0, size);
        small(ctx, 'API TIME', data.api !== null ? hms(data.api) : '--', sx, by + bh / 2, 0, size);
        if (bx + bw - sx > 150) {
          small(ctx, 'RATE', rate !== null ? '$' + rate.toFixed(2) + '/h' : '--', sx + (bx + bw - sx) / 2, by + m, 0, size);
          small(ctx, 'TOTAL', data.total !== null ? kfmt(data.total) + ' tok' : '--', sx + (bx + bw - sx) / 2, by + bh / 2, 0, size);
        }
      }
    } else {
      var lh = Math.max(18, bh * 0.2);
      lamp(ctx, bx + m, by + m, bw - 2 * m, lh, st);
      var ch2 = Math.min(bh * 0.24, (bw - 2 * m) / 4.6), cw2 = ch2 * 0.68, fw = cw2 * 6;
      var fx2 = bx + (bw - fw) / 2, fy2 = by + m + lh + ch2 * 0.55;
      ctx.fillStyle = CK.c.dim;
      ctx.font = CK.font(Math.max(7, ch2 * 0.22));
      ctx.textAlign = 'left';
      ctx.textBaseline = 'bottom';
      ctx.fillText('料金 FARE $', fx2, fy2 - 2);
      drums(ctx, shown.fare, 6, fx2, fy2, cw2, ch2, 2, on, colors);
      var size2 = Math.max(8, Math.min(bh * 0.06, bw / 14)), ry = fy2 + ch2 + m * 1.5, col2 = bx + m + (bw - 2 * m) / 2;
      if (ry + size2 * 2 < by + bh) {
        small(ctx, 'TOKENS', data.tokens !== null ? kfmt(data.tokens) : '--', bx + m * 2, ry, 0, size2);
        small(ctx, 'API TIME', data.api !== null ? hms(data.api) : '--', col2, ry, 0, size2);
      }
      var ry2 = ry + size2 * 2.4;
      if (ry2 + size2 * 2 < by + bh) {
        small(ctx, 'RATE', rate !== null ? '$' + rate.toFixed(2) + '/h' : '--', bx + m * 2, ry2, 0, size2);
        small(ctx, 'MODEL', data.model || '--', col2, ry2, 0, size2);
      }
      // Lifetime odometer in tenths of a million tokens
      var oh = Math.min(size2 * 1.5, (bw - 2 * m) / 9), oy = by + bh - m - oh;
      if (oy > ry2 + size2 * 2.4 && data.total !== null) {
        var ow = oh * 0.62;
        ctx.fillStyle = CK.c.dim;
        ctx.font = CK.font(Math.max(7, oh * 0.5));
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText('TOTAL M tok', bx + m * 2, oy + oh / 2);
        drums(ctx, shown.total, 6, bx + bw - m * 2 - ow * 6, oy, ow, oh, 1, true, colors);
      }
    }
    if (!on) {
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = CK.font(Math.max(8, Math.min(w / 40, 11)));
      ctx.fillStyle = CK.c.yellow;
      ctx.fillText('fare needs the MOLTamp status line', w / 2, by + bh - m - 4);
    }
    CK.resetCtx(ctx);

    var text = !on ? '料金 · out of service' + (data.total !== null ? ' · lifetime ' + kfmt(data.total) + ' tok' : '')
      : '料金 · $' + data.fare.toFixed(2) + (data.tokens !== null ? ' · ' + kfmt(data.tokens) + ' tok' : '') + (data.model ? ' · ' + data.model : '');
    if (text !== lastText) { lastText = text; label.textContent = text; }
  }, 30);
})();
