  Waiting Arcade — Mission Control pack for MOLTamp
  A pocket space shooter for the moments Claude is busy; it pauses itself and calls you back the moment Claude finishes or needs you. Click to play.

-->
<div id="cy-root"><canvas id="cy-canvas"></canvas><div id="cy-label"></div></div>

<style>
  #cy-root { position: absolute; inset: 0; overflow: hidden; background: var(--c-chrome-bg); container-type: size; }
  #cy-canvas { display: block; width: 100%; height: 100%; }
  #cy-label {
    position: absolute; left: 8px; bottom: 6px; pointer-events: none; letter-spacing: 0.08em;
    color: var(--c-chrome-dim); text-shadow: 0 0 6px var(--c-chrome-bg);
    font: calc(clamp(8px, 3.4cqw, 12px) * var(--user-text-scale, 1)) 'SF Mono', Menlo, 'Hiragino Sans', monospace;
  }
</style>

<script>
// cyber-kit — shared runtime of the Cyberpunk widget pack (MIT, j0j0).
// Skin colours resolved for canvas use, DPR-aware canvas, pause when hidden, Claude state, telemetry.
var CK = (function () {
  'use strict';

  var hasSdk = typeof window.moltamp !== 'undefined';

  // ------------------------------------------------------------------ skin colours
  var VARS = {
    bg: '--c-chrome-bg', text: '--c-chrome-text', accent: '--c-chrome-accent', dim: '--c-chrome-dim',
    border: '--c-chrome-border', fg: '--t-foreground', termBg: '--t-background', red: '--t-red',
    green: '--t-green', yellow: '--t-yellow', blue: '--t-blue', cyan: '--t-cyan', magenta: '--t-magenta'
  };
  // A colour missing from the skin borrows another skin colour, never a hardcoded value.
  var BORROW = {
    text: ['fg', 'accent'], fg: ['text', 'accent'], accent: ['text', 'fg'], dim: ['text', 'fg'], border: ['dim', 'text'],
    bg: ['termBg'], termBg: ['bg'], red: ['magenta', 'accent'], green: ['cyan', 'accent'], yellow: ['accent', 'red'],
    blue: ['cyan', 'accent'], cyan: ['blue', 'accent'], magenta: ['red', 'accent']
  };
  var probeEl = document.createElement('span');
  probeEl.style.display = 'none';
  (document.body || document.documentElement).appendChild(probeEl);
  var pc = document.createElement('canvas');
  pc.width = pc.height = 1;
  var pctx = pc.getContext('2d', { willReadFrequently: true });
  var rgb = {};
  var c = {};

  // Resolves any CSS colour the skin may use (hex, rgb, var(), color-mix()) to RGB bytes.
  function readVar(name) {
    var raw = getComputedStyle(document.documentElement).getPropertyValue(VARS[name]).trim();
    if (!raw) return null;
    probeEl.style.color = '';
    probeEl.style.color = raw;
    var computed = getComputedStyle(probeEl).color;
    pctx.fillStyle = '#010203';
    pctx.fillStyle = computed;
    if (pctx.fillStyle === '#010203' && computed !== 'rgb(1, 2, 3)') return null;
    pctx.clearRect(0, 0, 1, 1);
    pctx.fillRect(0, 0, 1, 1);
    var d = pctx.getImageData(0, 0, 1, 1).data;
    return [d[0], d[1], d[2]];
  }

  function refreshColors() {
    var name, raw = {};
    for (name in VARS) raw[name] = readVar(name);
    for (name in VARS) {
      var v = raw[name], chain = BORROW[name] || [];
      for (var i = 0; !v && i < chain.length; i++) v = raw[chain[i]];
      if (!v) {
        // Last resort: the host's own text colour, still a skin value.
        probeEl.style.color = '';
        var m = /(\d+)\D+(\d+)\D+(\d+)/.exec(getComputedStyle(document.body || document.documentElement).color) || [0, 128, 128, 128];
        v = [+m[1], +m[2], +m[3]];
      }
      rgb[name] = v;
      c[name] = 'rgb(' + v[0] + ',' + v[1] + ',' + v[2] + ')';
    }
  }
  refreshColors();

  function rgba(name, a) {
    var v = rgb[name] || rgb.text;
    return 'rgba(' + v[0] + ',' + v[1] + ',' + v[2] + ',' + a + ')';
  }

  function mix(a, b, t, alpha) {
    var x = rgb[a] || rgb.text, y = rgb[b] || rgb.text;
    var r = Math.round(x[0] + (y[0] - x[0]) * t), g = Math.round(x[1] + (y[1] - x[1]) * t), bl = Math.round(x[2] + (y[2] - x[2]) * t);
    return alpha === undefined ? 'rgb(' + r + ',' + g + ',' + bl + ')' : 'rgba(' + r + ',' + g + ',' + bl + ',' + alpha + ')';
  }

  function lum(name) {
    var v = rgb[name] || rgb.text;
    return (0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2]) / 255;
  }

  // ------------------------------------------------------------------ sdk wrappers
  // moltamp.poll only: it cleans itself up when the widget unloads (store rule: no raw setInterval).
  function poll(ms, fn) {
    if (hasSdk && moltamp.poll) return moltamp.poll(ms, fn);
    return function () {};
  }

  function subscribe(store, selector, cb) {
    if (!hasSdk || !moltamp.subscribe) return function () {};
    try { return moltamp.subscribe(store, selector, cb) || function () {}; } catch (e) { return function () {}; }
  }

  function call(channel) {
    if (!hasSdk || !moltamp.call) return Promise.reject(new Error('no sdk'));
    try { return Promise.resolve(moltamp.call.apply(moltamp, arguments)); } catch (e) { return Promise.reject(e); }
  }

  // ------------------------------------------------------------------ text scale (Settings > Display)
  var textScale = 1;
  if (hasSdk && moltamp.settings) {
    moltamp.settings.read().then(function (cfg) {
      cfg = cfg || {};
      if (typeof cfg.widgetTextScale === 'number') textScale = cfg.widgetTextScale;
      document.documentElement.style.setProperty('--user-text-scale', String(textScale));
    }).catch(function () { /* first run: no settings */ });
  }

  function font(size, weight) {
    return (weight || 'normal') + ' ' + Math.max(7, size * textScale).toFixed(1) +
      'px "SF Mono", Menlo, "Hiragino Sans", "Hiragino Kaku Gothic ProN", monospace';
  }

  // ------------------------------------------------------------------ Claude shell state
  var STATES = ['idle', 'thinking', 'streaming', 'tool-use', 'permission', 'error', 'complete'];
  var state = { name: 'idle', since: performance.now(), seen: false };
  var stateListeners = [];
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.type !== 'moltamp:push' || d.subscriptionId !== 'shell-state' || STATES.indexOf(d.data) < 0) return;
    var prev = state.name;
    state.name = d.data;
    state.since = performance.now();
    state.seen = true;
    for (var i = 0; i < stateListeners.length; i++) {
      try { stateListeners[i](state.name, prev); } catch (err) { /* keep other listeners alive */ }
    }
  });

  function currentState() {
    // "complete" is a moment, not a mode: fall back to idle after a few seconds.
    if (state.name === 'complete' && performance.now() - state.since > 4000) return 'idle';
    return state.name;
  }

  // ------------------------------------------------------------------ terminal telemetry
  var tel = { bytes: 0, activity: 'idle', level: 0, started: false };
  function telemetry() {
    if (!tel.started) {
      tel.started = true;
      subscribe('telemetry', 'bytesPerSec', function (v) { tel.bytes = Number(v) || 0; });
      subscribe('telemetry', 'activity', function (v) { tel.activity = v || 'idle'; });
    }
    return tel;
  }

  // 0..1 terminal energy, log-scaled bytes plus the activity level, smoothed by the caller's dt.
  function telemetryLevel(dt) {
    var target = Math.min(1, Math.log(1 + tel.bytes) / Math.log(1 + 200000)) * 0.75 +
      (tel.activity === 'high' ? 0.35 : tel.activity === 'low' ? 0.15 : 0);
    tel.level += (Math.min(1, target) - tel.level) * (1 - Math.exp(-(dt || 0.016) / 0.5));
    return tel.level;
  }

  // ------------------------------------------------------------------ Claude Code hook events
  // event.events is a ring buffer of the last ~200 hook payloads from every session; callers only
  // want what is new, so entries are de-duplicated by timestamp, hook, tool and session.
  var evSeen = {}, evQueue = [], evListeners = [], evStarted = false;
  function eventKey(e) { return [e._ts, e._hook || e.hook_event_name, e.tool_name, e._session || e.session_id].join('|'); }
  function onEvents(cb) {
    evListeners.push(cb);
    if (evStarted) return;
    evStarted = true;
    var first = true;
    subscribe('event', 'events', function (v) {
      var list = Array.isArray(v) ? v : v && typeof v === 'object' ? Object.keys(v).map(function (k) { return v[k]; }) : [];
      var fresh = [];
      for (var i = 0; i < list.length; i++) {
        var e = list[i];
        if (!e || typeof e !== 'object') continue;
        var k = eventKey(e);
        if (evSeen[k]) continue;
        evSeen[k] = true;
        evQueue.push(k);
        fresh.push(e);
      }
      while (evQueue.length > 800) delete evSeen[evQueue.shift()];
      var history = first;
      first = false;
      if (fresh.length) for (var j = 0; j < evListeners.length; j++) {
        try { evListeners[j](fresh, history); } catch (err) { /* keep other listeners alive */ }
      }
    });
  }

  // A failure is read from the tool's response or the hook name, never from its input
  // (a command that merely contains the word "error" is not a failure).
  function isFailure(e) {
    var hook = String(e.hook_event_name || e._hook || '');
    if (/fail|error/i.test(hook)) return true;
    var r = e.tool_response;
    if (!r || typeof r !== 'object') return false;
    if (r.is_error === true || r.isError === true || r.success === false || r.interrupted === true) return true;
    var code = r.exitCode !== undefined ? r.exitCode : r.exit_code !== undefined ? r.exit_code : r.code;
    if (typeof code === 'number' && code !== 0) return true;
    return typeof r.error === 'string' && r.error.length > 0;
  }

  function toolLabel(name) {
    name = String(name || '?');
    if (name.indexOf('mcp__') !== 0) return name;
    // mcp__plugin_chrome-devtools-mcp_chrome-devtools__take_screenshot -> chrome-devtools
    var server = name.split('__')[1] || 'mcp';
    server = server.replace(/^plugin_/, '').replace(/^claude_ai_/, '').split('_').pop();
    return 'mcp:' + server;
  }

  // ------------------------------------------------------------------ Claude session stats
  // In MOLTamp 3.2.2, telemetry.read hands over Claude's raw status line payload (context_window, cost,
  // rate_limits) and stats.read only holds lifetime aggregates, contrary to the docs. Both are read so the
  // documented shape (contextPct, cost, rate5h…) still works if a later version fixes stats.read.
  // Resolves to a normalised object, or null when no session data is flowing.
  function sessNum(v) { var n = typeof v === 'string' ? parseFloat(v) : v; return typeof n === 'number' && isFinite(n) ? n : null; }
  function sessPick(o, paths) {
    for (var i = 0; i < paths.length; i++) {
      var v = o, parts = paths[i].split('.');
      for (var j = 0; j < parts.length && v !== null && v !== undefined; j++) v = v[parts[j]];
      v = sessNum(v);
      if (v !== null) return v;
    }
    return null;
  }
  function normaliseSession(s) {
    var rl = s.rate_limits || s.rateLimits || {}, m = s.model;
    var out = {
      contextPct: sessPick(s, ['context_window.used_percentage', 'contextPct', 'context_pct']),
      cost: sessPick(s, ['cost.total_cost_usd', 'cost', 'costUsd', 'cost_usd']),
      tokensIn: sessPick(s, ['context_window.total_input_tokens', 'tokensIn', 'tokens_in']),
      tokensOut: sessPick(s, ['context_window.total_output_tokens', 'tokensOut', 'tokens_out']),
      apiMs: sessPick(s, ['cost.total_api_duration_ms', 'apiTime']),
      model: m && typeof m === 'object' ? String(m.display_name || m.id || '') : String(m || ''),
      modelId: m && typeof m === 'object' ? String(m.id || '') : String(m || ''),
      rate5h: rl.five_hour !== undefined ? rl.five_hour : s.rate5h !== undefined ? s.rate5h : null,
      rate7d: rl.seven_day !== undefined ? rl.seven_day : s.rate7d !== undefined ? s.rate7d : null,
      sessionId: String(s.session_id || s.sessionId || ''),
      raw: s
    };
    var any = out.contextPct !== null || out.cost !== null || out.tokensIn !== null || out.rate5h !== null;
    return any ? out : null;
  }
  // telemetry.read returns whichever session refreshed its status line last; with several Claude sessions open,
  // stay on one while it keeps reporting (within a minute) so readings don't flip between sessions.
  var sessCache = {}, sessFocus = '';
  function readSession() {
    return call('telemetry.read').catch(function () { return null; }).then(function (t) {
      var fromStatus = t && typeof t === 'object' ? normaliseSession(t) : null;
      if (fromStatus) {
        var id = fromStatus.sessionId || 'session', now = Date.now();
        sessCache[id] = { s: fromStatus, at: now };
        var cur = sessCache[sessFocus];
        if (!cur || now - cur.at > 60000) sessFocus = id;
        Object.keys(sessCache).forEach(function (k) { if (now - sessCache[k].at > 3600e3) delete sessCache[k]; });
        return sessCache[sessFocus].s;
      }
      return call('stats.read').then(function (s) { return s && typeof s === 'object' ? normaliseSession(s) : null; })
        .catch(function () { return null; });
    });
  }

  // ------------------------------------------------------------------ canvas + loop
  // Paused while off screen (hidden tab) or while the whole page is hidden; both must clear to resume.
  var onScreen = true, pageVisible = !document.hidden, watching = false;
  function visibleNow() { return onScreen && pageVisible; }
  function watch(el) {
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (entries) { onScreen = entries[entries.length - 1].isIntersecting; }).observe(el);
    }
    if (!watching) {
      watching = true;
      document.addEventListener('visibilitychange', function () { pageVisible = !document.hidden; });
    }
  }

  function surface(el) {
    var s = { el: el, ctx: el.getContext('2d'), w: 0, h: 0, dpr: 1, resized: true };
    s.fit = function () {
      var dpr = Math.min(2, window.devicePixelRatio || 1);
      var w = Math.max(1, el.clientWidth), h = Math.max(1, el.clientHeight);
      if (w !== s.w || h !== s.h || dpr !== s.dpr) {
        s.w = w; s.h = h; s.dpr = dpr;
        el.width = Math.round(w * dpr);
        el.height = Math.round(h * dpr);
        s.resized = true;
      }
      s.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return s;
    };
    watch(el);
    return s;
  }

  function loop(fn, fpsCap) {
    var last = 0, lastDraw = 0, logged = false, cap = fpsCap || 60;
    function frame(now) {
      requestAnimationFrame(frame);
      if (!visibleNow()) { last = 0; return; }
      if (now - lastDraw < 1000 / cap - 2) return;
      var dt = last ? Math.min((now - last) / 1000, 0.1) : 1 / 60;
      last = lastDraw = now;
      try { fn(dt, now / 1000); } catch (e) {
        if (!logged) { logged = true; console.error('[cyber-kit]', e); }
      }
    }
    requestAnimationFrame(frame);
  }

  function resetCtx(ctx) {
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.shadowBlur = 0;
    ctx.lineWidth = 1;
    ctx.setLineDash([]);
  }

  // ------------------------------------------------------------------ small utils
  function hash(str) {
    var h = 2166136261;
    str = String(str);
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return ((h >>> 0) % 100000) / 100000;
  }

  function prng(seed) {
    var a = (seed * 4294967296) >>> 0 || 1;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = Math.imul(a ^ (a >>> 15), a | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function fmtBytes(b) {
    if (hasSdk && moltamp.fmt && moltamp.fmt.bytes) return moltamp.fmt.bytes(b);
    var u = ['B', 'KB', 'MB', 'GB'], i = 0;
    while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
    return b.toFixed(i ? 1 : 0) + ' ' + u[i];
  }

  // Skin switches update CSS variables live; re-resolve once a second.
  poll(1000, refreshColors);

  return {
    c: c, rgb: rgb, rgba: rgba, mix: mix, lum: lum, refreshColors: refreshColors,
    poll: poll, subscribe: subscribe, call: call, font: font,
    state: currentState, stateInfo: state, onState: function (cb) { stateListeners.push(cb); },
    telemetry: telemetry, telemetryLevel: telemetryLevel,
    onEvents: onEvents, isFailure: isFailure, toolLabel: toolLabel, readSession: readSession,
    surface: surface, loop: loop, resetCtx: resetCtx, isVisible: visibleNow,
    hash: hash, prng: prng, fmtBytes: fmtBytes,
    meta: (hasSdk && moltamp.meta) || { context: 'panel' }
  };
})();

// Waiting Arcade: a small invaders game; pauses itself and calls you back when Claude finishes or needs you.
(function () {
  'use strict';
  var canvas = document.getElementById('cy-canvas');
  var S = CK.surface(canvas);
  var label = document.getElementById('cy-label');
  var SPRITES = [
    ['...##...', '..####..', '.######.', '##.##.##', '########', '..#..#..', '.#.##.#.', '#.#..#.#'],
    ['...##...', '..####..', '.######.', '##.##.##', '########', '.#.##.#.', '#......#', '.#....#.'],
    ['..#..#..', '...##...', '..####..', '.##..##.', '########', '#.####.#', '#.#..#.#', '...##...'],
    ['..#..#..', '#..##..#', '#.####.#', '###..###', '########', '.######.', '..#..#..', '.#....#.']
  ];
  var ROW_TONE = ['magenta', 'cyan', 'green', 'yellow'];
  var BUSY = { thinking: 1, streaming: 1, 'tool-use': 1 };
  var cfg = {}, G = null, stars = [], t = 0, lastText = '', wasBusy = false;
  var keys = { left: false, right: false, fire: false }, mouseX = null, firePressed = false;

  if (window.moltamp && moltamp.settings) {
    moltamp.settings.read().then(function (c) { cfg = c || {}; if (G) G.hi = Math.max(G.hi, cfg.hi || 0); }).catch(function () {});
  }
  for (var i = 0; i < 70; i++) stars.push({ x: Math.random(), y: Math.random(), v: 0.02 + Math.random() * 0.08, s: Math.random() < 0.2 ? 1.6 : 1 });

  function newGame(mode) {
    G = { mode: mode, score: 0, hi: (G && G.hi) || cfg.hi || 0, lives: 3, wave: 1, inv: [], dir: 1, ox: 0, oy: 0,
      shots: [], bombs: [], booms: [], ship: { x: S.w / 2, inv: 0 }, ufo: null, ufoT: 8, cool: 0, march: 0,
      banner: null, bannerTone: 'green', cols: 0, rows: 4, cell: 10 };
    setupWave();
  }

  function setupWave() {
    var w = S.w, h = S.h;
    G.cols = w < 260 ? 6 : 8;
    G.cell = Math.max(8, Math.min(w * 0.78 / G.cols, h * 0.42 / G.rows));
    G.inv = [];
    for (var r = 0; r < G.rows; r++) for (var c = 0; c < G.cols; c++) G.inv.push({ c: c, r: r, alive: true });
    G.ox = (w - G.cols * G.cell) / 2;
    G.oy = h * 0.14;
    G.dir = 1;
    G.shots = []; G.bombs = [];
  }

  function invPos(v) { return { x: G.ox + v.c * G.cell, y: G.oy + v.r * G.cell * 0.85 }; }

  function boom(x, y, tone, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * 6.283, sp = 30 + Math.random() * 90;
      G.booms.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.6 + Math.random() * 0.4, tone: tone });
    }
    if (G.booms.length > 260) G.booms.splice(0, G.booms.length - 260);
  }

  function pause(text, tone) {
    if (!G || G.mode !== 'play') return;
    G.mode = 'paused';
    G.banner = text;
    G.bannerTone = tone;
    keys.left = keys.right = keys.fire = false;
  }

  function saveHi() {
    if (G.score <= (cfg.hi || 0)) return;
    cfg.hi = G.score;
    if (window.moltamp && moltamp.settings) moltamp.settings.write(cfg).catch(function () {});
  }

  // Claude calls you back: the game pauses on the transitions that need your attention.
  CK.onState(function (now) {
    if (now === 'complete' || (now === 'idle' && wasBusy)) pause('✅ CLAUDE IS DONE', 'green');
    else if (now === 'permission') pause('✋ CLAUDE NEEDS YOU', 'yellow');
    else if (now === 'error') pause('💥 CLAUDE HIT AN ERROR', 'red');
    wasBusy = !!BUSY[now];
  });

  // ---- input: click to take control, then keyboard (forwarded by MOLTamp or native) or mouse
  canvas.addEventListener('click', function () {
    if (!G || G.mode === 'attract' || G.mode === 'over') { newGame('play'); return; }
    if (G.mode === 'paused') { G.mode = 'play'; G.banner = null; return; }
    firePressed = true;
  });
  canvas.addEventListener('mousemove', function (e) {
    var r = canvas.getBoundingClientRect();
    mouseX = (e.clientX - r.left) * S.w / r.width;
  });
  canvas.addEventListener('mouseleave', function () { mouseX = null; });

  function onKey(key, down) {
    if (!G || G.mode === 'attract') return false;
    var k = String(key || '').toLowerCase();
    if (down && (G.mode === 'paused' || G.mode === 'over')) {
      if (k === ' ' || k === 'enter' || k === 'p') { if (G.mode === 'over') newGame('play'); else { G.mode = 'play'; G.banner = null; } return true; }
      return false;
    }
    if (k === 'arrowleft' || k === 'a' || k === 'q') { keys.left = down; return true; }
    if (k === 'arrowright' || k === 'd') { keys.right = down; return true; }
    if (k === ' ' || k === 'arrowup' || k === 'w' || k === 'z') { keys.fire = down; if (down) firePressed = true; return true; }
    if (down && (k === 'p' || k === 'escape')) { pause('⏸ PAUSED', 'accent'); return true; }
    return false;
  }
  if (window.moltamp && moltamp.onKeyDown) {
    moltamp.onKeyDown(function (key) { onKey(key, true); });
    if (moltamp.onKeyUp) moltamp.onKeyUp(function (key) { onKey(key, false); });
  }
  window.addEventListener('keydown', function (e) { if (onKey(e.key, true)) e.preventDefault(); });
  window.addEventListener('keyup', function (e) { onKey(e.key, false); });

  // ---- simulation
  function update(dt) {
    var w = S.w, h = S.h, cell = G.cell, ship = G.ship, shipY = h - cell * 0.9, human = G.mode === 'play';
    if (G.mode !== 'play' && G.mode !== 'attract') return;
    var alive = G.inv.filter(function (v) { return v.alive; });
    if (!alive.length) { G.wave++; setupWave(); return; }

    // Ship: keys, mouse, or the attract-mode pilot
    var target = ship.x;
    if (human) {
      if (mouseX !== null) target = mouseX;
      if (keys.left) target = ship.x - w;
      if (keys.right) target = ship.x + w;
    } else {
      var low = alive.reduce(function (a, v) { return v.r >= a.r ? v : a; }, alive[0]);
      target = invPos(low).x + cell / 2 + Math.sin(t * 1.3) * cell * 0.6;
    }
    var maxV = w * 0.9 * dt;
    ship.x += Math.max(-maxV, Math.min(maxV, target - ship.x));
    ship.x = Math.max(cell * 0.6, Math.min(w - cell * 0.6, ship.x));
    ship.inv = Math.max(0, ship.inv - dt);

    G.cool -= dt;
    var wantFire = human ? (firePressed || keys.fire) : Math.random() < dt * 2.5;
    firePressed = false;
    if (wantFire && G.cool <= 0 && G.shots.length < 2) { G.shots.push({ x: ship.x, y: shipY - cell * 0.4 }); G.cool = 0.28; }

    // Formation march: faster as it thins out and with every wave
    var speed = cell * (0.6 + 2.6 * (1 - alive.length / G.inv.length)) * (1 + 0.15 * (G.wave - 1));
    G.ox += G.dir * speed * dt;
    var minC = Infinity, maxC = -Infinity, maxR = 0;
    alive.forEach(function (v) { minC = Math.min(minC, v.c); maxC = Math.max(maxC, v.c); maxR = Math.max(maxR, v.r); });
    var left = G.ox + minC * cell, right = G.ox + (maxC + 1) * cell;
    if ((G.dir > 0 && right > w - cell * 0.2) || (G.dir < 0 && left < cell * 0.2)) { G.dir *= -1; G.oy += cell * 0.35; }
    G.march += dt * speed / cell;

    // Bombs from the lowest invader of a random column
    if (Math.random() < dt * (0.7 + 0.25 * G.wave)) {
      var shooter = alive[(Math.random() * alive.length) | 0], col = alive.filter(function (v) { return v.c === shooter.c; });
      var bottom = col.reduce(function (a, v) { return v.r > a.r ? v : a; }, col[0]), bp = invPos(bottom);
      G.bombs.push({ x: bp.x + cell / 2, y: bp.y + cell * 0.7 });
    }

    // UFO pass
    G.ufoT -= dt;
    if (!G.ufo && G.ufoT <= 0) { G.ufo = { x: -cell, dir: 1 }; G.ufoT = 12 + Math.random() * 10; }
    if (G.ufo) { G.ufo.x += G.ufo.dir * w * 0.25 * dt; if (G.ufo.x > w + cell) G.ufo = null; }

    // Player shots
    for (var i = G.shots.length - 1; i >= 0; i--) {
      var s = G.shots[i];
      s.y -= h * 1.1 * dt;
      var hit = false;
      for (var j = 0; j < alive.length && !hit; j++) {
        var p = invPos(alive[j]);
        if (s.x > p.x + cell * 0.12 && s.x < p.x + cell * 0.88 && s.y > p.y && s.y < p.y + cell * 0.7) {
          alive[j].alive = false; hit = true;
          if (human) G.score += (G.rows - alive[j].r) * 10;
          boom(p.x + cell / 2, p.y + cell * 0.35, ROW_TONE[alive[j].r % 4], 14);
        }
      }
      if (!hit && G.ufo && Math.abs(s.x - G.ufo.x) < cell * 0.6 && Math.abs(s.y - h * 0.07) < cell * 0.35) {
        hit = true; if (human) G.score += 100 + ((Math.random() * 3) | 0) * 100;
        boom(G.ufo.x, h * 0.07, 'red', 24); G.ufo = null;
      }
      if (hit || s.y < 0) G.shots.splice(i, 1);
    }

    // Bombs
    for (i = G.bombs.length - 1; i >= 0; i--) {
      var bmb = G.bombs[i];
      bmb.y += h * 0.42 * dt;
      if (Math.abs(bmb.x - ship.x) < cell * 0.45 && bmb.y > shipY - cell * 0.3 && bmb.y < shipY + cell * 0.3 && ship.inv <= 0) {
        G.bombs.splice(i, 1);
        boom(ship.x, shipY, 'accent', 30);
        ship.inv = 1.6;
        if (human && --G.lives <= 0) { G.mode = 'over'; G.banner = 'GAME OVER'; G.bannerTone = 'red'; saveHi(); }
        continue;
      }
      if (bmb.y > h) G.bombs.splice(i, 1);
    }

    // Invaders reaching the ship line end the game (attract mode just restarts)
    if (G.oy + maxR * cell * 0.85 + cell * 0.7 > shipY - cell * 0.3) {
      if (human) { G.mode = 'over'; G.banner = 'GAME OVER'; G.bannerTone = 'red'; saveHi(); } else setupWave();
    }
    G.hi = Math.max(G.hi, G.score);
  }

  // ---- rendering
  function sprite(ctx, rows, x, y, size, tone) {
    var px = size / 8;
    ctx.fillStyle = CK.c[tone];
    for (var r = 0; r < 8; r++) for (var c = 0; c < 8; c++) if (rows[r][c] === '#') ctx.fillRect(x + c * px, y + r * px, px + 0.3, px + 0.3);
  }

  function center(ctx, text, y, size, tone, box) {
    ctx.font = CK.font(size, 'bold');
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if (box) {
      var tw = ctx.measureText(text).width + size * 1.4;
      ctx.fillStyle = CK.rgba('bg', 0.85);
      ctx.fillRect(S.w / 2 - tw / 2, y - size, tw, size * 2);
      ctx.strokeStyle = CK.c[tone];
      ctx.strokeRect(S.w / 2 - tw / 2 + 0.5, y - size + 0.5, tw - 1, size * 2 - 1);
    }
    ctx.fillStyle = CK.c[tone];
    ctx.fillText(text, S.w / 2, y);
  }

  CK.loop(function (dt) {
    S.fit();
    if (!G || S.resized) { newGame(G && G.mode === 'play' ? 'play' : 'attract'); S.resized = false; }
    var ctx = S.ctx, w = S.w, h = S.h, cell = G.cell, st = CK.state();
    t += dt;
    update(dt);

    ctx.fillStyle = CK.c.bg;
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = CK.c.fg;
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      s.y = (s.y + s.v * dt * (G.mode === 'play' ? 1.6 : 0.6)) % 1;
      ctx.globalAlpha = 0.35;
      ctx.fillRect(s.x * w, s.y * h, s.s, s.s);
    }
    ctx.globalAlpha = 1;

    var frame = Math.floor(G.march * 2) % 2;
    G.inv.forEach(function (v) {
      if (!v.alive) return;
      var p = invPos(v);
      sprite(ctx, SPRITES[(v.r % 2) * 2 + frame], p.x + cell * 0.15, p.y, cell * 0.7, ROW_TONE[v.r % 4]);
    });
    if (G.ufo) {
      ctx.fillStyle = CK.c.red;
      ctx.beginPath(); ctx.ellipse(G.ufo.x, h * 0.07, cell * 0.55, cell * 0.2, 0, 0, 6.283); ctx.fill();
      ctx.fillStyle = CK.c.magenta;
      ctx.beginPath(); ctx.ellipse(G.ufo.x, h * 0.07 - cell * 0.14, cell * 0.25, cell * 0.16, 0, 0, 6.283); ctx.fill();
    }
    var shipY = h - cell * 0.9;
    if (!(G.ship.inv > 0 && Math.sin(t * 30) > 0)) {
      ctx.fillStyle = CK.c.accent;
      ctx.beginPath();
      ctx.moveTo(G.ship.x, shipY - cell * 0.45);
      ctx.lineTo(G.ship.x + cell * 0.45, shipY + cell * 0.25);
      ctx.lineTo(G.ship.x - cell * 0.45, shipY + cell * 0.25);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = CK.c.fg;
    G.shots.forEach(function (s2) { ctx.fillRect(s2.x - 1, s2.y - cell * 0.3, 2, cell * 0.3); });
    ctx.fillStyle = CK.c.red;
    G.bombs.forEach(function (b) { ctx.fillRect(b.x - 1.5, b.y - cell * 0.25, 3, cell * 0.25); });
    for (i = G.booms.length - 1; i >= 0; i--) {
      var bm = G.booms[i];
      bm.x += bm.vx * dt; bm.y += bm.vy * dt; bm.life -= dt;
      if (bm.life <= 0) { G.booms.splice(i, 1); continue; }
      ctx.globalAlpha = Math.min(1, bm.life * 1.6);
      ctx.fillStyle = CK.c[bm.tone];
      ctx.fillRect(bm.x, bm.y, 2, 2);
    }
    ctx.globalAlpha = 1;

    // HUD
    ctx.font = CK.font(Math.max(8, cell * 0.38));
    ctx.textBaseline = 'top';
    ctx.textAlign = 'left';
    ctx.fillStyle = CK.c.text;
    var hud = G.mode === 'attract' ? 'HI ' + G.hi : 'SCORE ' + G.score + '   HI ' + G.hi + '   WAVE ' + G.wave + '   ' + new Array(G.lives + 1).join('♥');
    ctx.fillText(hud, 6, 6);

    // Overlays
    if (G.mode === 'attract') {
      center(ctx, '待機ゲーム WAITING ARCADE', h * 0.66, Math.max(10, Math.min(w / 20, h / 11)), 'accent', true);
      center(ctx, BUSY[st] ? 'Claude is working — click to play' : 'click to play', h * 0.78, Math.max(8, Math.min(w / 32, h / 17)), 'text', false);
    } else if (G.mode === 'paused' || G.mode === 'over') {
      var tone = G.bannerTone, blink = 0.5 + 0.5 * Math.sin(t * 6);
      if (G.mode === 'paused' && tone !== 'accent') {
        ctx.strokeStyle = CK.rgba(tone, 0.35 + 0.6 * blink);
        ctx.lineWidth = 4;
        ctx.strokeRect(2, 2, w - 4, h - 4);
        ctx.lineWidth = 1;
      }
      center(ctx, G.banner, h * 0.48, Math.max(11, Math.min(w / 16, h / 9)), tone, true);
      center(ctx, G.mode === 'over' ? 'SCORE ' + G.score + ' · click to retry' : 'click or press space to resume', h * 0.62, Math.max(8, Math.min(w / 32, h / 18)), 'text', false);
    }
    CK.resetCtx(ctx);

    var text = G.mode === 'play' ? 'ゲーム中 · ←/→ or mouse · space / click fires · P pauses' : G.mode === 'paused' ? '一時停止 · PAUSED' : '待機 · ' + (BUSY[st] ? 'Claude is busy' : 'Claude is idle');
    if (text !== lastText) { lastText = text; label.textContent = text; }
  });
})();
</script>
