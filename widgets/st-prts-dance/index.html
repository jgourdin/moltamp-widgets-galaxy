}

// ---- MOLTamp widget wrapper (shared by both dance widgets) ----
// Needs the core (drawDanceFrame, DANCE_INFO, palettes); speed follows the
// Claude shell state, colours come from the skin's CSS variables.
(function () {
  var root = document.getElementById('dv-root');
  var canvas = document.getElementById('dv-canvas');
  var ctx = canvas.getContext('2d');
  if (!ctx) return;

  var STATE_SPEED = { idle: 0.35, thinking: 0.8, streaming: 1.25, 'tool-use': 1.6, permission: 0.5, error: 0.25, complete: 1.0 };
  var CSS_VARS = {
    bg: '--c-chrome-bg', accent: '--c-chrome-accent', dim: '--c-chrome-dim', blue: '--t-blue',
    cyan: '--t-cyan', magenta: '--t-magenta', yellow: '--t-yellow', text: '--t-foreground'
  };
  var colors = {}, lastKey = '', palette = null;
  var targetSpeed = 1.0, speed = 1.0, frame = 0, last = 0;
  var visible = true, raf = 0, W = 0, H = 0, dpr = 1, dirty = true, shown = -1;
  var opts = { background: null, clip: true, backdrop: true, interpolate: true, overlap: true, showRoom: SHOW_ROOM, showHalo: true, edgeFade: USE_SKIN_PALETTE ? EDGE_FADE : 0 };

  var probe = document.createElement('canvas').getContext('2d');

    var v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();

      lastKey = key;

    if (!visible) return;
    var dt = last ? (now - last) / 1000 : 1 / 60;
    last = now;
    if (!(dt > 0)) dt = 0;
    if (dt > 0.1) dt = 0.1;
    speed += (targetSpeed - speed) * (1 - Math.exp(-dt * 3));
    frame = (frame + dt * DANCE_INFO.fps * speed) % DANCE_INFO.frameCount;

    var step = Math.floor(frame);

      shown = step;

    var d = e.data;
    if (d && d.type === 'moltamp:push' && d.subscriptionId === 'shell-state') {

    }

  }

  window.addEventListener('resize', resize);

  // skin switches update CSS variables live; re-read once a second
  if (window.moltamp && typeof moltamp.poll === 'function') moltamp.poll(1000, readColours);
  else setInterval(readColours, 1000);
  readColours();
  resize();
  start();
})();
</script>
