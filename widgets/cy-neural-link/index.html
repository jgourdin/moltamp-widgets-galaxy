<!--
  Neural Link — Cyberpunk pack for MOLTamp
  A wireframe brain that lights up with Claude: calm at rest, impulses while thinking, data streams while writing, red alert on errors.
  Author: j0j0 · License: MIT
-->
<div id="cy-root"><canvas id="cy-canvas"></canvas><div id="cy-label"></div></div>

<style>
  #cy-root { position: absolute; inset: 0; overflow: hidden; background: var(--c-chrome-bg); container-type: size; }
  #cy-canvas { display: block; width: 100%; height: 100%; }
  #cy-label {
    position: absolute; left: 8px; bottom: 6px; pointer-events: none; letter-spacing: 0.08em;
    color: var(--c-chrome-dim); text-shadow: 0 0 6px var(--c-chrome-bg);
    font: calc(clamp(8px, 3.4cqw, 12px) * var(--user-text-scale, 1)) 'SF Mono', Menlo, 'Hiragino Sans', monospace;
  }
</style>

<script>
// cyber-kit — shared runtime of the Cyberpunk widget pack (MIT, j0j0).
// Skin colours resolved for canvas use, DPR-aware canvas, pause when hidden, Claude state, telemetry.
var CK = (function () {
  'use strict';

  var hasSdk = typeof window.moltamp !== 'undefined';

  // ------------------------------------------------------------------ skin colours
  var VARS = {
    bg: '--c-chrome-bg', text: '--c-chrome-text', accent: '--c-chrome-accent', dim: '--c-chrome-dim',
    border: '--c-chrome-border', fg: '--t-foreground', termBg: '--t-background', red: '--t-red',
    green: '--t-green', yellow: '--t-yellow', blue: '--t-blue', cyan: '--t-cyan', magenta: '--t-magenta'
  };
  // A colour missing from the skin borrows another skin colour, never a hardcoded value.
  var BORROW = {
    text: ['fg', 'accent'], fg: ['text', 'accent'], accent: ['text', 'fg'], dim: ['text', 'fg'], border: ['dim', 'text'],
    bg: ['termBg'], termBg: ['bg'], red: ['magenta', 'accent'], green: ['cyan', 'accent'], yellow: ['accent', 'red'],
    blue: ['cyan', 'accent'], cyan: ['blue', 'accent'], magenta: ['red', 'accent']
  };
  var probeEl = document.createElement('span');
  probeEl.style.display = 'none';
  (document.body || document.documentElement).appendChild(probeEl);
  var pc = document.createElement('canvas');
  pc.width = pc.height = 1;
  var pctx = pc.getContext('2d', { willReadFrequently: true });
  var rgb = {};
  var c = {};

  // Resolves any CSS colour the skin may use (hex, rgb, var(), color-mix()) to RGB bytes.
  function readVar(name) {
    var raw = getComputedStyle(document.documentElement).getPropertyValue(VARS[name]).trim();
    if (!raw) return null;
    probeEl.style.color = '';
    probeEl.style.color = raw;
    var computed = getComputedStyle(probeEl).color;
    pctx.fillStyle = '#010203';
    pctx.fillStyle = computed;
    if (pctx.fillStyle === '#010203' && computed !== 'rgb(1, 2, 3)') return null;
    pctx.clearRect(0, 0, 1, 1);
    pctx.fillRect(0, 0, 1, 1);
    var d = pctx.getImageData(0, 0, 1, 1).data;
    return [d[0], d[1], d[2]];
  }

  function refreshColors() {
    var name, raw = {};
    for (name in VARS) raw[name] = readVar(name);
    for (name in VARS) {
      var v = raw[name], chain = BORROW[name] || [];
      for (var i = 0; !v && i < chain.length; i++) v = raw[chain[i]];
      if (!v) {
        // Last resort: the host's own text colour, still a skin value.
        probeEl.style.color = '';
        var m = /(\d+)\D+(\d+)\D+(\d+)/.exec(getComputedStyle(document.body || document.documentElement).color) || [0, 128, 128, 128];
        v = [+m[1], +m[2], +m[3]];
      }
      rgb[name] = v;
      c[name] = 'rgb(' + v[0] + ',' + v[1] + ',' + v[2] + ')';
    }
  }
  refreshColors();

  function rgba(name, a) {
    var v = rgb[name] || rgb.text;
    return 'rgba(' + v[0] + ',' + v[1] + ',' + v[2] + ',' + a + ')';
  }

  function mix(a, b, t, alpha) {
    var x = rgb[a] || rgb.text, y = rgb[b] || rgb.text;
    var r = Math.round(x[0] + (y[0] - x[0]) * t), g = Math.round(x[1] + (y[1] - x[1]) * t), bl = Math.round(x[2] + (y[2] - x[2]) * t);
    return alpha === undefined ? 'rgb(' + r + ',' + g + ',' + bl + ')' : 'rgba(' + r + ',' + g + ',' + bl + ',' + alpha + ')';
  }

  function lum(name) {
    var v = rgb[name] || rgb.text;
    return (0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2]) / 255;
  }

  // ------------------------------------------------------------------ sdk wrappers
  // moltamp.poll only: it cleans itself up when the widget unloads (store rule: no raw setInterval).
  function poll(ms, fn) {
    if (hasSdk && moltamp.poll) return moltamp.poll(ms, fn);
    return function () {};
  }

  function subscribe(store, selector, cb) {
    if (!hasSdk || !moltamp.subscribe) return function () {};
    try { return moltamp.subscribe(store, selector, cb) || function () {}; } catch (e) { return function () {}; }
  }

  function call(channel) {
    if (!hasSdk || !moltamp.call) return Promise.reject(new Error('no sdk'));
    try { return Promise.resolve(moltamp.call.apply(moltamp, arguments)); } catch (e) { return Promise.reject(e); }
  }

  // ------------------------------------------------------------------ text scale (Settings > Display)
  var textScale = 1;
  if (hasSdk && moltamp.settings) {
    moltamp.settings.read().then(function (cfg) {
      cfg = cfg || {};
      if (typeof cfg.widgetTextScale === 'number') textScale = cfg.widgetTextScale;
      document.documentElement.style.setProperty('--user-text-scale', String(textScale));
    }).catch(function () { /* first run: no settings */ });
  }

  function font(size, weight) {
    return (weight || 'normal') + ' ' + Math.max(7, size * textScale).toFixed(1) +
      'px "SF Mono", Menlo, "Hiragino Sans", "Hiragino Kaku Gothic ProN", monospace';
  }

  // ------------------------------------------------------------------ Claude shell state
  var STATES = ['idle', 'thinking', 'streaming', 'tool-use', 'permission', 'error', 'complete'];
  var state = { name: 'idle', since: performance.now(), seen: false };
  var stateListeners = [];
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.type !== 'moltamp:push' || d.subscriptionId !== 'shell-state' || STATES.indexOf(d.data) < 0) return;
    var prev = state.name;
    state.name = d.data;
    state.since = performance.now();
    state.seen = true;
    for (var i = 0; i < stateListeners.length; i++) {
      try { stateListeners[i](state.name, prev); } catch (err) { /* keep other listeners alive */ }
    }
  });

  function currentState() {
    // "complete" is a moment, not a mode: fall back to idle after a few seconds.
    if (state.name === 'complete' && performance.now() - state.since > 4000) return 'idle';
    return state.name;
  }

  // ------------------------------------------------------------------ terminal telemetry
  var tel = { bytes: 0, activity: 'idle', level: 0, started: false };
  function telemetry() {
    if (!tel.started) {
      tel.started = true;
      subscribe('telemetry', 'bytesPerSec', function (v) { tel.bytes = Number(v) || 0; });
      subscribe('telemetry', 'activity', function (v) { tel.activity = v || 'idle'; });
    }
    return tel;
  }

  // 0..1 terminal energy, log-scaled bytes plus the activity level, smoothed by the caller's dt.
  function telemetryLevel(dt) {
    var target = Math.min(1, Math.log(1 + tel.bytes) / Math.log(1 + 200000)) * 0.75 +
      (tel.activity === 'high' ? 0.35 : tel.activity === 'low' ? 0.15 : 0);
    tel.level += (Math.min(1, target) - tel.level) * (1 - Math.exp(-(dt || 0.016) / 0.5));
    return tel.level;
  }

  // ------------------------------------------------------------------ canvas + loop
  var visible = true;
  function watch(el) {
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (entries) { visible = entries[entries.length - 1].isIntersecting; }).observe(el);
    }
    document.addEventListener('visibilitychange', function () { visible = !document.hidden; });
  }

  function surface(el) {
    var s = { el: el, ctx: el.getContext('2d'), w: 0, h: 0, dpr: 1, resized: true };
    s.fit = function () {
      var dpr = Math.min(2, window.devicePixelRatio || 1);
      var w = Math.max(1, el.clientWidth), h = Math.max(1, el.clientHeight);
      if (w !== s.w || h !== s.h || dpr !== s.dpr) {
        s.w = w; s.h = h; s.dpr = dpr;
        el.width = Math.round(w * dpr);
        el.height = Math.round(h * dpr);
        s.resized = true;
      }
      s.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return s;
    };
    watch(el);
    return s;
  }

  function loop(fn, fpsCap) {
    var last = 0, lastDraw = 0, logged = false, cap = fpsCap || 60;
    function frame(now) {
      requestAnimationFrame(frame);
      if (!visible) { last = 0; return; }
      if (now - lastDraw < 1000 / cap - 2) return;
      var dt = last ? Math.min((now - last) / 1000, 0.1) : 1 / 60;
      last = lastDraw = now;
      try { fn(dt, now / 1000); } catch (e) {
        if (!logged) { logged = true; console.error('[cyber-kit]', e); }
      }
    }
    requestAnimationFrame(frame);
  }

  function resetCtx(ctx) {
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.shadowBlur = 0;
    ctx.lineWidth = 1;
    ctx.setLineDash([]);
  }

  // ------------------------------------------------------------------ small utils
  function hash(str) {
    var h = 2166136261;
    str = String(str);
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return ((h >>> 0) % 100000) / 100000;
  }

  function prng(seed) {
    var a = (seed * 4294967296) >>> 0 || 1;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = Math.imul(a ^ (a >>> 15), a | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function fmtBytes(b) {
    if (hasSdk && moltamp.fmt && moltamp.fmt.bytes) return moltamp.fmt.bytes(b);
    var u = ['B', 'KB', 'MB', 'GB'], i = 0;
    while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
    return b.toFixed(i ? 1 : 0) + ' ' + u[i];
  }

  // Skin switches update CSS variables live; re-resolve once a second.
  poll(1000, refreshColors);

  return {
    c: c, rgb: rgb, rgba: rgba, mix: mix, lum: lum, refreshColors: refreshColors,
    poll: poll, subscribe: subscribe, call: call, font: font,
    state: currentState, stateInfo: state, onState: function (cb) { stateListeners.push(cb); },
    telemetry: telemetry, telemetryLevel: telemetryLevel,
    surface: surface, loop: loop, resetCtx: resetCtx, isVisible: function () { return visible; },
    hash: hash, prng: prng, fmtBytes: fmtBytes,
    meta: (hasSdk && moltamp.meta) || { context: 'panel' }
  };
})();

// Neural Link: a node network shaped like a brain; Claude's state decides how impulses travel.
(function () {
  'use strict';
  var S = CK.surface(document.getElementById('cy-canvas'));
  var label = document.getElementById('cy-label');
  var LABELS = {
    idle: '待機 · IDLE', thinking: '思考 · THINKING', streaming: '送信 · STREAMING', 'tool-use': '実行 · TOOL USE',
    permission: '承認待ち · PERMISSION', error: '警告 · ERROR', complete: '完了 · COMPLETE'
  };
  var TONE = { idle: 'accent', thinking: 'accent', streaming: 'cyan', 'tool-use': 'yellow', permission: 'yellow', error: 'red', complete: 'green' };
  var MAX_PULSES = 120;
  var nodes = [], edges = [], adj = [], pulses = [];
  var spawnAcc = 0, burstAcc = 0, wave = -1, t = 0, lastLabel = '';
  CK.telemetry();

  var brain = null, sulci = null;

  // Side-view brain: cerebrum, cerebellum and brainstem as one path; nodes are sampled inside it.
  function silhouette(w, h) {
    var s = Math.min(w / 1.25, h), ox = (w - s * 1.25) / 2, oy = (h - s) / 2 + s * 0.02;
    function X(v) { return ox + v * s * 1.25; }
    function Y(v) { return oy + v * s; }
    var p = new Path2D();
    p.moveTo(X(0.12), Y(0.55));
    p.bezierCurveTo(X(0.02), Y(0.35), X(0.15), Y(0.08), X(0.42), Y(0.08));
    p.bezierCurveTo(X(0.70), Y(0.04), X(0.95), Y(0.22), X(0.92), Y(0.48));
    p.bezierCurveTo(X(0.91), Y(0.60), X(0.84), Y(0.64), X(0.74), Y(0.62));
    p.bezierCurveTo(X(0.62), Y(0.64), X(0.50), Y(0.70), X(0.36), Y(0.70));
    p.bezierCurveTo(X(0.22), Y(0.70), X(0.15), Y(0.64), X(0.12), Y(0.55));
    p.closePath();
    var cb = new Path2D();
    cb.ellipse(X(0.76), Y(0.70), s * 1.25 * 0.13, s * 0.09, -0.15, 0, 6.283);
    var stem = new Path2D();
    stem.moveTo(X(0.56), Y(0.64)); stem.lineTo(X(0.64), Y(0.64)); stem.lineTo(X(0.63), Y(0.94)); stem.lineTo(X(0.57), Y(0.94)); stem.closePath();
    var all = new Path2D(); all.addPath(p); all.addPath(cb); all.addPath(stem);
    var su = new Path2D();
    su.moveTo(X(0.30), Y(0.52)); su.bezierCurveTo(X(0.42), Y(0.46), X(0.55), Y(0.44), X(0.66), Y(0.50)); // lateral sulcus
    su.moveTo(X(0.47), Y(0.10)); su.bezierCurveTo(X(0.50), Y(0.25), X(0.46), Y(0.35), X(0.50), Y(0.44)); // central sulcus
    su.moveTo(X(0.22), Y(0.25)); su.bezierCurveTo(X(0.28), Y(0.30), X(0.26), Y(0.40), X(0.32), Y(0.44));
    su.moveTo(X(0.70), Y(0.16)); su.bezierCurveTo(X(0.68), Y(0.28), X(0.76), Y(0.34), X(0.74), Y(0.46));
    return { cerebrum: p, all: all, sulci: su };
  }

  function build(w, h) {
    var rnd = CK.prng(0.4242);
    var target = Math.round(Math.min(150, Math.max(45, (w * h) / 950)));
    var tries = 0, shape = silhouette(w, h), ctx = S.ctx;
    brain = shape.all; sulci = shape.sulci;
    nodes = []; edges = []; adj = []; pulses = [];
    ctx.setTransform(1, 0, 0, 1, 0, 0); // isPointInPath works in path units, not device pixels
    while (nodes.length < target && tries++ < target * 80) {
      var x = rnd() * w, y = rnd() * h;
      if (!ctx.isPointInPath(brain, x, y)) continue;
      nodes.push({ x: x, y: y, glow: 0, phase: rnd() * 6.283 });
      adj.push([]);
    }
    ctx.setTransform(S.dpr, 0, 0, S.dpr, 0, 0);
    var seen = {};
    function link(a, b) {
      var lo = Math.min(a, b), hi = Math.max(a, b), key = lo + ':' + hi;
      if (lo === hi || seen[key]) return;
      seen[key] = true;
      edges.push([lo, hi]);
      adj[lo].push(edges.length - 1);
      adj[hi].push(edges.length - 1);
    }
    for (var i = 0; i < nodes.length; i++) {
      var near = [];
      for (var j = 0; j < nodes.length; j++) {
        if (j === i) continue;
        var dx = nodes[i].x - nodes[j].x, dy = nodes[i].y - nodes[j].y;
        near.push([dx * dx + dy * dy, j]);
      }
      near.sort(function (a, b) { return a[0] - b[0]; });
      for (var k = 0; k < 3 && k < near.length; k++) link(i, near[k][1]);
    }
  }

  function other(e, from) { return edges[e][0] === from ? edges[e][1] : edges[e][0]; }

  function spawn(from, kind, hops, speed) {
    if (pulses.length >= MAX_PULSES || !adj[from] || !adj[from].length) return;
    var list = adj[from], e = list[(Math.random() * list.length) | 0];
    if (kind === 'flow') {
      // Data flows left to right: prefer the edge that moves furthest along x.
      var bestX = -1e9;
      for (var i = 0; i < list.length; i++) {
        var nx = nodes[other(list[i], from)].x;
        if (nx > bestX) { bestX = nx; e = list[i]; }
      }
    }
    pulses.push({ e: e, from: from, t: 0, kind: kind, hops: hops, speed: speed });
  }

  function randomNode(leftOnly) {
    for (var i = 0; i < 12; i++) {
      var n = (Math.random() * nodes.length) | 0;
      if (!leftOnly || nodes[n].x < S.w * 0.3) return n;
    }
    return (Math.random() * nodes.length) | 0;
  }

  CK.onState(function (now) { if (now === 'complete') wave = 0; });

  CK.loop(function (dt) {
    S.fit();
    if (S.resized) { build(S.w, S.h); S.resized = false; }
    var ctx = S.ctx, w = S.w, h = S.h, st = CK.state(), tone = TONE[st] || 'accent';
    var energy = CK.telemetryLevel(dt);
    t += dt;

    // Spawning rules per state
    var rate = { idle: 0.6, thinking: 7, streaming: 14 + energy * 20, 'tool-use': 3, permission: 1, error: 10, complete: 2 }[st] || 1;
    spawnAcc += rate * dt;
    while (spawnAcc >= 1 && nodes.length) {
      spawnAcc -= 1;
      if (st === 'streaming') spawn(randomNode(true), 'flow', 14, 1.6 + energy);
      else if (st === 'thinking') spawn(randomNode(), 'impulse', 5, 2.4);
      else if (st === 'error') spawn(randomNode(), 'impulse', 2, 3.5);
      else spawn(randomNode(), 'drift', 1, 0.7);
    }
    if (st === 'tool-use') {
      burstAcc += dt;
      if (burstAcc > 0.6) {
        burstAcc = 0;
        var hub = randomNode();
        for (var q = 0; q < 6; q++) spawn(hub, 'impulse', 3, 2.8);
        nodes[hub].glow = 1;
      }
    }

    // Background
    ctx.fillStyle = CK.c.bg;
    ctx.fillRect(0, 0, w, h);
    var alarm = st === 'error' ? 0.5 + 0.5 * Math.sin(t * 18) : 0;
    if (alarm) {
      ctx.fillStyle = CK.rgba('red', 0.08 * alarm);
      ctx.fillRect(0, 0, w, h);
    }
    var blink = st === 'permission' ? 0.5 + 0.5 * Math.sin(t * 7.5) : 0;
    var breathe = 0.5 + 0.5 * Math.sin(t * (st === 'idle' ? 1.1 : 2.2));

    // Wireframe silhouette
    if (brain) {
      ctx.strokeStyle = CK.mix('dim', st === 'error' ? 'red' : tone, 0.4, 0.35 + 0.15 * breathe);
      ctx.lineWidth = 1.2;
      ctx.stroke(brain);
      ctx.strokeStyle = CK.rgba('dim', 0.18);
      ctx.lineWidth = 1;
      ctx.stroke(sulci);
    }

    // Edges, one batched path
    var jitter = st === 'error' ? 1.2 : 0;
    ctx.beginPath();
    for (var i = 0; i < edges.length; i++) {
      var a = nodes[edges[i][0]], b = nodes[edges[i][1]];
      ctx.moveTo(a.x + (jitter ? (Math.random() - 0.5) * jitter : 0), a.y);
      ctx.lineTo(b.x, b.y + (jitter ? (Math.random() - 0.5) * jitter : 0));
    }
    ctx.strokeStyle = st === 'error' ? CK.rgba('red', 0.35 + 0.3 * alarm) : CK.mix('dim', tone, 0.35 + 0.4 * blink, 0.22 + 0.1 * breathe);
    ctx.lineWidth = 0.8;
    ctx.stroke();

    // Pulses (additive glow)
    ctx.globalCompositeOperation = CK.lum('bg') > 0.5 ? 'source-over' : 'lighter';
    for (i = pulses.length - 1; i >= 0; i--) {
      var p = pulses[i], e = edges[p.e];
      if (!e) { pulses.splice(i, 1); continue; }
      p.t += p.speed * dt;
      var from = nodes[p.from], to = nodes[other(p.e, p.from)];
      if (p.t >= 1) {
        var arrived = other(p.e, p.from);
        nodes[arrived].glow = Math.min(1, nodes[arrived].glow + (p.kind === 'drift' ? 0.3 : 0.7));
        pulses.splice(i, 1);
        if (p.hops > 1 && (p.kind === 'flow' || Math.random() < 0.75)) spawn(arrived, p.kind, p.hops - 1, p.speed);
        continue;
      }
      var x = from.x + (to.x - from.x) * p.t, y = from.y + (to.y - from.y) * p.t;
      var tx = from.x + (to.x - from.x) * Math.max(0, p.t - 0.25), ty = from.y + (to.y - from.y) * Math.max(0, p.t - 0.25);
      var col = p.kind === 'flow' ? 'cyan' : p.kind === 'drift' ? tone : tone;
      ctx.strokeStyle = CK.rgba(col, p.kind === 'drift' ? 0.35 : 0.85);
      ctx.lineWidth = p.kind === 'drift' ? 1 : 1.8;
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(x, y);
      ctx.stroke();
      ctx.fillStyle = CK.rgba(p.kind === 'flow' ? 'fg' : col, 0.95);
      ctx.fillRect(x - 1.2, y - 1.2, 2.4, 2.4);
    }

    // Nodes
    for (i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      n.glow *= Math.exp(-dt * 2.5);
      var g = Math.max(n.glow, st === 'idle' ? 0.15 * (0.5 + 0.5 * Math.sin(t * 1.3 + n.phase)) : 0, blink * 0.6, alarm * 0.5);
      if (g > 0.05) {
        ctx.fillStyle = CK.rgba(st === 'error' ? 'red' : tone, 0.25 * g);
        ctx.beginPath();
        ctx.arc(n.x, n.y, 2 + g * 5, 0, 6.283);
        ctx.fill();
      }
      ctx.fillStyle = CK.mix('dim', st === 'error' ? 'red' : tone, Math.min(1, 0.3 + g));
      ctx.fillRect(n.x - 1.1, n.y - 1.1, 2.2, 2.2);
    }

    // Completion wave from the centre
    if (wave >= 0) {
      wave += dt * 1.4;
      var R = wave * Math.max(w, h) * 0.7;
      ctx.strokeStyle = CK.rgba('green', Math.max(0, 0.8 - wave * 0.8));
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(w / 2, h / 2, R, R * 0.8, 0, 0, 6.283);
      ctx.stroke();
      for (i = 0; i < nodes.length; i++) {
        var dxw = nodes[i].x - w / 2, dyw = (nodes[i].y - h / 2) / 0.8;
        if (Math.abs(Math.sqrt(dxw * dxw + dyw * dyw) - R) < 8) nodes[i].glow = 1;
      }
      if (wave > 1) wave = -1;
    }
    CK.resetCtx(ctx);

    var text = LABELS[st] || st;
    if (text !== lastLabel) {
      lastLabel = text;
      label.textContent = text;
      label.style.color = 'var(' + ({ red: '--t-red', yellow: '--t-yellow', green: '--t-green', cyan: '--t-cyan' }[tone] || '--c-chrome-accent') + ')';
    }
  });
})();
</script>
