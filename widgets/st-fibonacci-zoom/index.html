<script>
  /* Extruded Fibonacci Zoom — Shane — https://www.shadertoy.com/view/sfVGDG — CC BY-NC-SA 3.0 (Shadertoy default)  — https://creativecommons.org/licenses/by-nc-sa/3.0/ */
  var SHADER = {"id": "st-fibonacci-zoom", "title": "Extruded Fibonacci Zoom", "author": "Shane", "url": "https://www.shadertoy.com/view/sfVGDG", "license": "CC BY-NC-SA 3.0 (Shadertoy default)", "common": "\n// PI and 2PI.\n#define PI 3.14159265358979\n#define TAU 6.28318530718\n\n// The so-called golden ratio.\n#define PHI ((1. + sqrt(5.))/2.)\n\n\n// Standard 2D rotation formula.\nmat2 rot2(in float a){ float c = cos(a), s = sin(a); return mat2(c, s, -s, c); }\n\n// Hash without Sine -- Dave Hoskins\n// https://www.shadertoy.com/view/4djSRW\n// 1 out, 2 in...\nfloat hash21(vec2 p) {\n    p = fract(p*vec2(623.34, 456.21));\n    p += dot(p, p + 145.123);\n    return fract(p.x*p.y);\n}\n\n// A slight variation on one of Dave Hoskins's hash functions,\n// which you can find here:\n//\n// Hash without Sine -- Dave Hoskins\n// https://www.shadertoy.com/view/4djSRW\n// 1 out, 3 in...\nfloat hash31(vec3 p3)\n{\n\tp3  = fract(p3*vec3(.6031, .5030, .4973));\n    p3 += dot(p3, p3.zyx + 43.527);\n    return fract((p3.x + p3.y) * p3.z);\n}\n \n\n////////////////\n\n\n// Unsigned distance to the segment joining \"a\" and \"b\".\nfloat distLine(vec2 p, vec2 a, vec2 b){\n\n    p -= a; b -= a;\n    float h = clamp(dot(p, b)/dot(b, b), 0., 1.);\n    return length(p - b*h);\n}\n\n \n// IQ's 2D box formula.\nfloat sBoxS(in vec2 p, in vec2 b, in float rf){\n  \n  vec2 d = abs(p) - b + rf;\n  return min(max(d.x, d.y), 0.) + length(max(d, 0.)) - rf;\n    \n}\n\n// Commutative smooth maximum function. Provided by Tomkh, and taken \n// from Alex Evans's (aka Statix) talk: \n// http://media.lolrus.mediamolecule.com/AlexEvans_SIGGRAPH-2015.pdf\n// Credited to Dave Smith @media molecule.\nfloat smax(float a, float b, float k){\n    \n   float f = max(0., 1. - abs(b - a)/k);\n   return max(a, b) + k*.25*f*f;\n}\n\n\n\n/////////////////////////\n\n// Global scale. Not absolutely necessary to have one, but\n// it's here. The ratio doesn't have to be 1 to 1, but I\n// think it looks neater this way.\nconst vec2 gSc = vec2(1, 1);\n\n// Vertex holder. Not used here.\n//mat4x2 vP;\n\n// Iteration number and quad number.\nint gI, quad;\n\n// Global zoom.\nfloat gZoom;\n\n// Cell coordinates and a final scale value that I've  hacked \n//in at the last minute... I'll tidy up the logic later. :)\nvec2 gP, gSc2;\n\n// This is a copy of the direction ray. If you create a pattern that\n// relies on rotating coordinates, the direction ray needs to rotate\n// in unison. Traversals can be annoying to code sometimes, but the\n// benefits are worth the effort.\nvec2 svRd;\n\n\n// The Fibonacci routine. This is very similar to a regular Fibonacci rectangle\n// partitioning; The only difference is that four rectangles are joined together\n// to give the impression that you're zooming toward a central inflection point.\n//\nvec3 distField(vec2 p){    \n    \n    \n    // 2D coordinate copy.\n    vec2 svP = p;\n     \n    //Get the quadrant. Clockwise from the bottom left.\n    quad = p.x<0.? p.y<0.? 0 : 1 : p.y<0.? 3 : 2;\n \n    \n    // The following is just some space manipulation to rotate on rectangle\n    // around itself four times. Each rectangle is then subdivided to \n    // produce the pattern you see.\n    \n    // Central coordinate ID, of sorts.\n    vec2 ip = vec2(-1, -1)*gSc*.5*vec2(sqrt(5.), 1);\n    \n    // Rotating space and shifting coordinates..\n    p = rot2(PI/2.*float(quad))*p; \n    ip = rot2(-PI/2.*float(quad))*ip;\n    \n    // Rotating the direction ray to match the rotating coordinates.\n    svRd = rot2(PI/2.*float(quad))*svRd; \n     \n    // Shifing back.\n    p -= vec2(-1, -1)*gSc*.5*vec2(sqrt(5.), 1);\n     \n \n    // Global cell coordinate copy.\n    gP = p;\n    \n    ////////////\n    \n    // Subdivsion of rectangles. Because we're used repeat space tricks\n    // above, we only need subdivide one rectangle, and not all four.\n    \n    // Staring scale.\n    vec2 sc = gSc;\n    \n    // Distance variable.\n    float d = 1e5; \n \n \n    // Initializing the iteration variable to zero.\n    gI = 0;\n    \n    // Direction and translation variables.\n    vec2 dir = vec2(0, 0);    \n    vec2 ph2 = vec2(PHI/2., PHI/2. - 1.);\n    \n    // Subdivision: Perform the minimum you can get away with.\n    // This is a pretty common fractal-like subdivision. Partition,\n    // rotate, scale, then continue the process. \n    for(int i = 0; i<16; i++){\n        \n          \n      \n        // The rectangle (square) distance for this cell.\n        vec2 ap = abs(p) - sc/2.;\n        float dI = max(ap.x, ap.y);\n         \n\n        // If we're inside this rectangle, obtain the distance,\n        // then set the required variables, such as scale, local\n        // coordinates, ID, vertices, and so forth.\n        if(dI<0.){\n\n            \n            d = sBoxS(p, sc/2. - .0, sc.x*.2); // Box distance.\n            \n            gI = i; // Iteration number.\n            \n\n            gSc2 = sc; // Overall scale for this object.\n            gP = p; // Cell coordinates.\n            \n            // Vertices. Not used here.\n            //vP = mat4x2(vec2(-.5)*sc, vec2(-.5, .5)*sc, \n            //            vec2(.5)*sc, vec2(.5, -.5)*sc);\n  \n            break;\n\n        }\n        \n        // If we're not inside the cell we need, keep subdividing.\n\n\n        // Turn the direction each iteration.\n        dir = rot2(PI/2.*float(i%4))*vec2(1, 1);\n        dir *= sc*ph2;\n        // Translate and rotate the ID to match. \n        ip += rot2(-PI/2.*float(quad))*dir; \n        \n        // Quarter spiral turn each iteration.\n        ph2 = ph2.yx*vec2(-1, 1);\n        \n        // Translate.\n        p -= dir;\n\n\n        // Reduce the scale by the golder ratio factor.\n        sc /= PHI;\n            \n \n        ////////////// \n    \n    }\n    \n     \n      \n    // Return the distance value of the closed rectangular block\n    // and it's cell center, which doubles as a unique ID. By the\n    // way, you could also return the the tile center and dimensions,\n    // if you wished to render other things.\n      \n    d /= gZoom; \n    \n    return vec3(d, ip);\n}\n\n\n////////////////////////////////\n\n\n// Bidirectional Reflectance Distribution Function (BRDF). \n//\n// If you want a quick crash course in BRDF, see the following:\n// Microfacet BRDF: Theory and Implementation of Basic PBR Materials\n// https://www.youtube.com/watch?v=gya7x9H3mV0&t=730s\n//\n\n// Surface geometry function.\nfloat GGX_Schlick(float nv, float rough) {\n    //float r = rough; // original\n    float r = .5 + .5*rough; // Disney remapping.\n    float k = (r*r)/2.;\n    float denom = nv*(1. - k) + k;\n    return max(nv, .001)/denom;\n}\n\n// Specular calculation.\nvec3 getSpec(vec3 FS, float nh, float nr, float nl, float rough){\n\n    // Microfacet distribution... Most dominant term.\n    // Microfaceted normal distribution function.\n    float alpha = pow(rough, 4.);\n    float b = (nh*nh*(alpha - 1.) + 1.);\n    float D = alpha/(PI*b*b);    \n    \n    // Geometry self shadowing term.\n    // G_Smith calculations.\n    float g1_l = GGX_Schlick(nl, rough);\n    float g1_v = GGX_Schlick(nr, rough);\n    float G = g1_l*g1_v;\n    \n    // Combining the terms above.\n    return FS*D*G/(4.*max(nr, .001))*PI;\n}\n\nvec3 getDiff(vec3 FS, float nl, float type){\n\n    // Diffuse calculations.\n    vec3 diff = nl*(1. - FS); // If not specular, use as diffuse (optional)\n    return diff*(1. - type); // No diffuse for metals.\n}\n\n//////////////////////////////////////", "passes": [{"name": "Image", "output": "image", "code": "/*\n\n    Extruded Fibonacci Zoom\n    -----------------------\n    \n    I like perusing through simple looped animations. The standard single-rectangle\n    Fibonacci zoom comes up every now and again -- The most common form consists of a \n    single golden-ratio rectangle subdivided into self similar squares that traverse\n    a golden spiral pattern. \n    \n    The less common variation involves subdividing the base rectangles in such a way\n    as to create a vanishing point in one of the corners. Four of these base rectangles\n    are then rotated around one another, effectively creating a vanishing point in the \n    center. This particular example involves the latter arrangement.\n    \n    Objects exhibiting the required symmetry and self similarity can be used to create \n    infinite fractal zoom effects. From a math and coding perspective, I know how \n    infinite zooms work, but they still really mess with my sense of perception. :)\n    \n    Most of the Fibonacci zoom effects I see occur in flat 2D form. In fact, I prefer\n    them that way. However, just to be different, I've produced this one in extruded \n    traversal form.\n    \n\n    \n    Related examples:\n    \n    // I've always been a fan of this example. Elegantly written and\n    // presented... which is just another way to say that IQ wrote it. :)\n    // Anyway, if you want to understand the Fibonacci zoom effect, \n    // I'd recommend this.\n    Golden Ratio and Spiral -- iq\n    https://www.shadertoy.com/view/fslyW4\n    \n    \n    // Here's a much cleaner version of the four pronged\n    // Fibonacci square zoom. I really like examples like these. \n    fibonacci windmill -- ufffd\n    https://www.shadertoy.com/view/tcVBzK\n    \n    \n    Reference:\n    \n    Golden Spiral\n    https://en.wikipedia.org/wiki/Golden_spiral\n  \n    \n*/\n \n\n// Max ray distance.\n#define FAR 20.\n\n\n// Scene object ID.\nint objID;\n\n\n// Tri-Planar blending function: Based on an old Nvidia writeup:\n// GPU Gems 3 - Ryan Geiss: http://http.developer.nvidia.com/GPUGems3/gpugems3_ch01.html\nvec3 tex3D(sampler2D tex, in vec3 p, in vec3 n){    \n    \n    // Abosolute normal with a bit of tightning.\n    n = max(abs(n), .001); // max(n*n - .1,, 0.001), etc.\n    n /= dot(n, vec3(1)); \n    //n /= length(n); \n    \n    // Texure samples. One for each plane.\n    vec3 tx = texture(tex, p.zy).xyz;\n    vec3 ty = texture(tex, p.xz).xyz;\n    vec3 tz = texture(tex, p.xy).xyz;\n    \n    // Multiply each texture plane by its normal dominance factor.... or however you wish\n    // to describe it. For instance, if the normal faces up or down, the \"ty\" texture \n    // sample, represnting the XZ plane, will be used, which makes sense.\n    \n    // Textures are stored in sRGB (I think), so you have to convert them to linear space \n    // (squaring is a rough approximation) prior to working with them... or something like\n    // that. :) Once the final color value is gamma corrected, you should see correct \n    // looking colors.\n    return mat3(tx*tx, ty*ty, tz*tz)*n;\n} \n \n\n\n// IQ's extrusion formula.\nfloat opExtrusion(in float sdf, in float pz, in float h){\n    \n    vec2 w = vec2( sdf, abs(pz) - h );\n  \treturn min(max(w.x, w.y), 0.) + length(max(w, 0.));\n\n    /*  \n    // Slight rounding. A little nicer, but slower.\n    const float sf = .004;\n    vec2 w = vec2( sdf, abs(pz) - h - sf/2.);\n  \treturn min(max(w.x, w.y), 0.) + length(max(w + sf, 0.)) - sf;\n    */\n \n\n}\n\n// Ray origin, ray direction, point on the line, normal. \nfloat rayLine(vec2 ro, vec2 rd, vec2 p, vec2 n){\n   \n   // This it trimmed down, and can be trimmed done more, but it isn't\n   // a GPU intensive example, so it'll do.\n   float s = dot(p - ro, n)/dot(rd, n);\n   return s<0. ? 1e8 : s;\n\n}\n\n// Some hacky 2D symbols. I put this together pretty quickly. There'd\n// be nicer ways to get the job done, but this will do.\nfloat getLetter(vec2 gP, vec2 gSc2, float val0, float zoom){\n\n    float d;\n    \n    // Random number.\n    float rnd = hash21(vec2(val0) + .22);\n    \n    float sc = gSc2.x*.1;\n    \n    if(rnd<.25){\n       \n       // Box.\n       d = sBoxS(gP, vec2(sc), sc*.35);\n    \n    }\n    else if(rnd<.5){\n       // Cross.\n       d = distLine(abs(gP), vec2(-sc), vec2(sc));//\n    }\n    else if(rnd<.75){\n    \n       // Triangle.\n       vec2 q = gP;\n       mat3x2 pnt; vec2 dir = vec2(0, sc);\n       pnt[0] = dir;\n       pnt[1] = rot2(-TAU/3.)*dir;\n       pnt[2] = rot2(TAU/3.)*dir;\n       d = distLine(q, pnt[0], pnt[1]);//\n       d = min(d, distLine(q, pnt[1], pnt[2]));\n       d = min(d, distLine(q, pnt[2], pnt[0]));\n    \n    }\n    else {\n       \n       // Circle.\n       d = length(gP) - sc;  \n   \n    }\n    \n    return abs(d) - .014*zoom;\n\n\n}\n \nvec3 gRd; // Global ray direction.\nvec3 gDir; // Global step direction.\nfloat gCD; // Global cell wall distance.\n \n// There are too many globals hacked in here. I'll \n// tidy them up later.\n\n// Object distances and stored values.\nvec4 vObj, gVal;\n\n// Zoomed based ID value.\nfloat gVal0;\n\n// Object border flag.\nint gBord;\n\n\n// Glow color.\nvec3 gGlow;\n\n// The extruded image.\nfloat map(vec3 p3){\n    \n     \n    // Floor.\n    float fl = p3.y;  \n    \n     \n    // Fairly standard zoom setup.\n    //\n    // Cycle time.\n    float t = iTime/2.;\n    float iT = floor(t); // Number of cycles.  \n\n    // Fractional time component.\n    t = t - (iT + .5); \n    \n    // We want each object to expand (or contract) to the size of\n    // the next object each time that the fractional time scale \n    // loops back to zero.\n    float zoom = pow(PHI, t*4.);\n   \n    // Scale and smoothing factor.\n    float sc = 1./4./zoom;\n    \n    gZoom = sc; // Saving the scale to use elsewhere.\n \n    ///////////\n    \n    // Scaling and translation.\n    vec2 p = p3.xz*sc;\n    \n    \n    // Spiral rotation: You can do this elsewhere, but I find\n    // this easier.\n    mat2 rM = rot2(mod(iTime/4., TAU));\n    p *= rM;\n \n    // The direction ray.\n    svRd = gRd.xz;\n    svRd *= rM; // Rotating to match the local rotation.\n    \n    \n     // Scene object.\n    vec3 d3 = distField(p);\n    float d2 = d3.x; // Distance.\n    vec2 id = d3.yz; // ID.\n    // Creating some space around the objects.\n    d2 += .005;\n    \n     \n    // A random value based on the Fibonacci quadrant \n    // and zoom factor.\n    float quadF = float(quad);\n    float val = mod(iT*4. + float(gI), 16.)/16.;//\n    val += quadF/4.;\n    gVal0 = val; // Saving the object ID for later use.\n    \n    \n    \n    // Creating some ring symbols. They're a bit of cliche, but they\n    // look interesting.\n    // 2D leters.\n    float ring = getLetter(gP, gSc2, val, gZoom);\n    ring /= gZoom; // Factor in the zoom.\n    ring = max(ring, d2 + .002); // Cap the ring object to the box.\n   \n    // CSG on various panels.\n    float ew = .01;\n    \n    // Hollowing out random boxes, then adding the ring object.\n    float oD2 = d2;\n    float bord = (abs(d2 + ew*2.) - ew*1.);\n    d2 = max(d2, -bord);\n    gBord = d2<bord? 1 : 0;\n    d2 = min(d2, bord);\n    if(hash21(vec2(val, 57))<.5){\n        d2 = max(d2, -(oD2 + ew*4.));\n        \n        ring = abs(ring);// - ew/8.;\n    }\n    else { ring = 1e5; if(-oD2>ew) gBord = 0; }\n    \n    \n    // Giving the 2D objects some depth -- based on the random zoom value.\n    float h = .2*gSc2.x/gZoom  + .02;\n    float d = opExtrusion(d2, p3.y - h/2., h/2.);\n    \n    // The ring object.\n    ring = opExtrusion(ring, p3.y - h/2., .005);\n    \n    // Apply glow to the ring objects.\n    if(ring<min(d, fl) && ring<.1){\n        \n        float rnd = hash21(vec2(val, 43));\n        vec3 gCol = .5 + .45*cos(TAU*rnd/16. + vec3(0, PI/2.*1.4, PI));\n        gCol = mix(gCol, gCol.xzy, length(gP)/gZoom*4.);\n        \n        gGlow += gCol/(.0035 + ring)/800.;\n        \n    \n    }\n    \n    \n    // Using the 2D distance to distort the face distances.\n    if(gBord==0) d += d2*.25;\n    else d += max(d2, -.01)*.25;\n    \n \n    // Minimum cell wall distance. Used as a ray delimiter.\n    //\n    // Rectangle.\n    //\n    vec2 n1 = vec2(0, 1); // Top face, or line.\n    vec2 n2 = vec2(1, 0); // Righ face, or line.\n    \n    // If the cell wall is behind ray (or the ray is facing the opposing cell\n    // wall, if you prefer), use the normal from the back back cell wall.\n    n1 = dot(svRd, n1)<0.? -n1 : n1;\n    n2 = dot(svRd, n2)<0.? -n2 : n2;\n \n    vec2 ip = d3.yz;\n    float t1 = rayLine(gP, svRd, (n1*gSc2*.5), -n1);\n    float t2 = rayLine(gP, svRd, (n2*gSc2*.5), -n2);\n    gCD = min(t1, t2) + .0005;\n    gCD /= gZoom;\n  \n \n    \n    // Save values for later.\n    gVal = vec4(d2, id, h);\n    \n      \n    // Object IDs.\n    vObj = vec4(fl, d, ring, 1e5);\n    \n    // Minimum scene distance.\n    return min(min(fl, d), ring); \n \n}\n\n \n// Basic raymarcher.\nfloat trace(in vec3 ro, in vec3 rd){\n\n    // Overall ray distance and scene distance.\n    //\n    // IQ's suggestion: Moving the ray's jump-off point closer to the \n    // surface plane to gain some extra speed, especially when in \n    // fullscreen mode.\n    float t = (.5 - ro.y)/rd.y, d;\n\n    t += hash31(ro + rd)*.25; // Jitter.\n    \n    \n    gRd = rd; // Global ray direction.\n    gDir = step(0., gRd) - .5; // Step direction.\n    \n    \n    gGlow = vec3(0);\n\n    \n    for(int i = min(0, iFrame); i<128; i++){\n    \n        d = map(ro + rd*t);\n        if(abs(d)<.001 || t>FAR) break;\n        \n        // Limit the ray jump distance to ensure that it\n        // doesn't go any further than the next cell.\n        t += min(d*.7, gCD); \n    }\n\n    return min(t, FAR);\n}\n\n\n// Normal function. It's not as fast as the tetrahedral calculation, but more symmetrical.\nvec3 normal(in vec3 p) {\n\t\n    //return normalize(vec3(m(p + e.xyy) - m(p - e.xyy), m(p + e.yxy) - m(p - e.yxy),\t\n    //                      m(p + e.yyx) - m(p - e.yyx)));\n    \n    // This mess is an attempt to speed up compiler time by contriving a break... It's \n    // based on a suggestion by IQ. I think it works, but I really couldn't say for sure.\n    float sgn = 1.;\n    vec3 e = vec3(.002, 0, 0), mp = e.zzz; // Spalmer's clever zeroing.\n    for(int i = min(iFrame, 0); i<6; i++){\n\t\tmp.x += map(p + sgn*e)*sgn;\n        sgn = -sgn;\n        if((i&1)==1){ mp = mp.yzx; e = e.zxy; }\n    }\n    \n    return normalize(mp);\n}\n\n\n// Cheap shadows are hard. In fact, I'd almost say, shadowing particular scenes with \n// limited iterations is impossible... However, I'd be very grateful if someone could \n// prove me wrong. :)\nfloat softShadow(vec3 ro, vec3 rd, vec3 n, float lDist, float k){\n\n    // Initialize the shade and ray distance.\n    float shade = 1.;\n    float t = 0.; \n \n    // Coincides with the hit condition in the \"trace\" function. I've added in \n    // a touch of jittering to alleviate banding.\n    ro += n*.0015 + rd*hash31(ro + rd + n)*.005;\n    \n    // IQ's suggestion: It's analogous to moving the ray closer to the\n    // surface plane, in order to gain some extra speed.\n    lDist = (.25 - ro.y)/rd.y;\n\n\n    gRd = rd; // Global ray direction.\n    gDir = step(0., gRd) - .5; // Step direction.\n\n\n    // Max shadow iterations - More iterations make nicer shadows, but slow things down. \n    // Obviously, the lowest number to give a decent shadow is the best one to choose. \n    for (int i = min(0, iFrame); i<48; i++){\n\n        float d = map(ro + rd*t);\n        shade = min(shade, k*d/t);\n        //shade = min(shade, smoothstep(0., 1., k*d/t)); // Thanks to IQ for this tidbit.\n       \n        \n        // Early exit, if necessary.\n        if (d<0. || t>lDist) break;       \n\n        // So many options here, and none are perfect: dist += clamp(d, .01, stepDist), etc.\n        t += clamp(min(d, gCD), .005, .25); \n        \n    }\n\n    // Shadow.\n    return max(shade, 0.); \n}\n\n\n// I keep a collection of occlusion routines... OK, that sounded really nerdy. :)\n// Anyway, I like this one. I'm assuming it's based on IQ's original.\nfloat calcAO(in vec3 p, in vec3 n){\n\n\tfloat sca = 3., occ = 0.;\n    for( int i = 0; i<6; i++ ){\n    \n        float hr = .01 + float(i)*.2/6.;         applySampler(res.target, filter, isGL2 || res.target !== gl.TEXTURE_2D || inp.kind !== 'buffer' ? inp.wrap : 'clamp', hasMips);
      } else {
        gl.bindTexture(gl.TEXTURE_2D, null);
      }
      gl.uniform1i(pass.u.ch[c], c);
    }
  }

  function draw(now) {
    var dt = lastNow ? Math.min((now - lastNow) / 1000, 0.1) : 1 / 60;
    lastNow = now;
    fpsAcc += dt; fpsFrames++;
    if (fpsAcc > 0.5) { fps = fpsFrames / fpsAcc; fpsAcc = 0; fpsFrames = 0; debug.fps = Math.round(fps); }

    updateReactivity(now, dt);
    var simDt = dt * react.speed;
    simTime += simDt;
    if (audioTex) updateFakeAudio(simTime);

    var size = resize(), w = size[0], h = size[1];
    var date = new Date();
    var secs = date.getHours() * 3600 + date.getMinutes() * 60 + date.getSeconds() + date.getMilliseconds() / 1000;
    for (var c = 0; c < 4; c++) chanTime[c] = simTime;
    if (!clickFrame) mouse[3] = -Math.abs(mouse[3]);

    for (var i = 0; i < passes.length; i++) {
      var p = passes[i], target = null, b = null;
      if (p.output !== 'image') { b = buffers[p.output]; target = b.pair[1 - b.cur]; }
      gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fb : null);
      gl.viewport(0, 0, w, h);
      gl.useProgram(p.prog);
      bindInputs(p);
      gl.uniform3f(p.u.iResolution, w, h, 1);
      gl.uniform1f(p.u.iTime, simTime);
      gl.uniform1f(p.u.iTimeDelta, simDt);
      gl.uniform1f(p.u.iFrameRate, fps);
      gl.uniform1i(p.u.iFrame, frameNo);
      gl.uniform4f(p.u.iMouse, mouse[0], mouse[1], mouse[2], mouse[3]);
      gl.uniform4f(p.u.iDate, date.getFullYear(), date.getMonth(), date.getDate(), secs);
      gl.uniform1f(p.u.iSampleRate, 44100);
      gl.uniform4f(p.u.iMoltamp, react.energy, react.speed, (STATES[react.state] || STATES.unknown).code, react.pulse);
      if (p.u.iChannelTime) gl.uniform1fv(p.u.iChannelTime, chanTime);
      if (p.u.iChannelResolution) gl.uniform3fv(p.u.iChannelResolution, chanRes);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      if (b) {
        b.cur = 1 - b.cur;
        if (b.wantMips) { gl.bindTexture(gl.TEXTURE_2D, b.pair[b.cur].tex); gl.generateMipmap(gl.TEXTURE_2D); }
      }
    }
    clickFrame = false;
    frameNo++;
    debug.frame = frameNo;
  }

  var lastDraw = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    if (contextLost || gl.isContextLost()) { lastNow = 0; return; }
    if (!started) {
      if (ext.parallel && !passes.every(function (p) { return gl.getProgramParameter(p.prog, ext.parallel.COMPLETION_STATUS_KHR); })) return;
      started = true;
      if (!finishLink()) { started = 'failed'; return; }
      debug.ready = true;
    }
    if (started !== true || !isVisible()) { lastNow = 0; return; }
    var cap = opts.fpsCap || 60;
    if (now - lastDraw < 1000 / cap - 2) return;
    lastDraw = now;
    draw(now);
  }

  // Per-widget overrides persisted with moltamp.settings: { scale, maxPixels, fpsCap, speed, reactive }.
  (function () {
    if (!window.moltamp || !moltamp.settings) { requestAnimationFrame(loop); return; }
    moltamp.settings.read().then(function (saved) {
      saved = saved || {};
      ['scale', 'maxPixels', 'fpsCap', 'speed', 'reactive'].forEach(function (k) { if (saved[k] !== undefined) opts[k] = saved[k]; });
      reactive = opts.reactive !== false;
    }).catch(function () { /* first run: no settings yet */ }).then(function () { requestAnimationFrame(loop); });
  })();
})();

</script>
