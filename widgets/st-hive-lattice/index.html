  /* Hexagonal Hive Lattice — nobody93 — https://www.shadertoy.com/view/73KGRd — CC BY-NC-SA 3.0 (Shadertoy default)  — https://creativecommons.org/licenses/by-nc-sa/3.0/ */
  var SHADER = {"id": "st-hive-lattice", "title": "Hexagonal Hive Lattice", "author": "nobody93", "url": "https://www.shadertoy.com/view/73KGRd", "license": "CC BY-NC-SA 3.0 (Shadertoy default)", "common": "", "passes": [{"name": "Image", "output": "image", "code": "// =============================================================================\n//  H E X A C O R E\n//  Infinite D6-symmetric crystal lattice, raymarched through a twisted\n//  hexagonal tunnel carved directly into the distance field.\n//\n//  Techniques\n//   - Honeycomb (triangular-lattice Voronoi) domain repetition in XY, slab\n//     repetition in Z\n//   - KIFS fractal whose fold group is the dihedral group D6 (order 12):\n//     abs() gives the Klein-4 quadrant fold, one reflection across the 30deg\n//     mirror completes the hexagonal fundamental domain\n//   - CSG tunnel carve  d = max(d, -tunnel)  (still 1-Lipschitz) along a\n//     camera spline -> collision-free flight, guaranteed by construction\n//   - Over-relaxed sphere tracing with fail-safe backtracking\n//     (Keinert et al. 2014, \"Enhanced Sphere Tracing\"), pixel-cone termination\n//   - Tetrahedral normals, 5-tap AO, penumbra soft shadows, GGX microfacet\n//     specular (Smith-Schlick G, Schlick F), one reflection bounce\n//   - Emissive hexagonal circuitry with an energy pulse running down the\n//     tunnel, integrated as volumetric in-scattering along primary rays\n//   - Cosine-gradient palettes, ACES filmic tonemap, chromatic vignette\n//\n//  Pure GLSL, no iChannels. Paste into the Shadertoy Image tab.\n// =============================================================================\n\n#define MAX_STEPS    110\n#define MAX_DIST     28.0\n#define KIFS_ITERS   4\n#define REFLECTIONS  1       // 0 = off (faster)\n#define AA           1       // 2 = 4x SSAA (high-end GPUs only)\n\nconst float PI    = 3.14159265359;\nconst float SQ3   = 1.73205080757;\nconst float CELL  = 2.6;     // honeycomb pitch (XY)\nconst float SLAB  = 2.6;     // repetition period (Z)\nconst float TUN_R = 0.95;    // tunnel inradius\n\nfloat gT;                    // time\nfloat gTrap;                 // orbit trap\nfloat gCid;                  // per-cell random id\nfloat gEmit;                 // distance to emissive circuitry\nfloat gMat;                  // 0 = crystal / pillars, 1 = perforated shell\nfloat gCell2;                // per-alveolus random id\nfloat gCamZ;                 // camera z (for the energy pulse)\n\n// -----------------------------------------------------------------------------\n// Utilities\n// -----------------------------------------------------------------------------\nmat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }\n\nfloat hash21(vec2 p){\n    p = fract(p * vec2(123.34, 456.21));\n    p += dot(p, p + 45.32);\n    return fract(p.x * p.y);\n}\n\nvec3 pal(float t, vec3 a, vec3 b, vec3 c, vec3 d){ return a + b * cos(2.0 * PI * (c * t + d)); }\nvec3 palCrystal(float t){ return pal(t, vec3(.50,.50,.55), vec3(.50,.45,.45), vec3(1.,1.,1.),  vec3(.00,.15,.35)); }\nvec3 palEnergy (float t){ return pal(t, vec3(.60,.45,.50), vec3(.45,.45,.50), vec3(1.,.9,.8),   vec3(.55,.25,.05)); }\n\n// -----------------------------------------------------------------------------\n// Hexagonal geometry\n// -----------------------------------------------------------------------------\n// Exact 2D hexagon SDF, inradius r (flat top/bottom)\nfloat sdHex2(vec2 p, float r){\n    const vec3 k = vec3(-0.866025404, 0.5, 0.577350269);\n    p = abs(p);\n    p -= 2.0 * min(dot(k.xy, p), 0.0) * k.xy;\n    p -= vec2(clamp(p.x, -k.z * r, k.z * r), r);\n    return length(p) * sign(p.y);\n}\n// Exact hexagonal prism SDF, h = (inradius, half-height)\nfloat sdHexPrism(vec3 p, vec2 h){\n    vec2 d = vec2(sdHex2(p.xy, h.x), abs(p.z) - h.y);\n    return min(max(d.x, d.y), 0.0) + length(max(d, 0.0));\n}\n// D6 fold into the 30deg fundamental wedge\nvec2 foldD6(vec2 p){\n    const vec2 k = vec2(-0.866025404, 0.5);\n    p = abs(p);\n    return p - 2.0 * min(dot(k, p), 0.0) * k;\n}\n// Honeycomb lattice: (local xy, cell id). Two offset rect grids, nearest wins.\nvec4 hexLattice(vec2 p){\n    const vec2 s = vec2(1.0, SQ3);\n    vec4 c = floor(vec4(p, p - vec2(0.5, 1.0)) / s.xyxy) + 0.5;\n    vec4 h = vec4(p - c.xy * s, p - (c.zw + 0.5) * s);\n    return dot(h.xy, h.xy) < dot(h.zw, h.zw) ? vec4(h.xy, c.xy) : vec4(h.zw, c.zw + 0.5);\n}\n\n// -----------------------------------------------------------------------------\n// Camera spline (tunnel axis)\n// -----------------------------------------------------------------------------\nvec2 path(float z){\n    return vec2(1.9 * sin(z * 0.19) + 0.9 * sin(z * 0.083 + 1.3),\n                1.3 * cos(z * 0.145) + 0.6 * sin(z * 0.061));\n}\n\n// -----------------------------------------------------------------------------\n// Scene SDF\n// -----------------------------------------------------------------------------\nfloat map(vec3 p){\n    // honeycomb repetition\n    vec4  hl  = hexLattice(p.xy / CELL);\n    vec2  lq  = hl.xy * CELL;                         // local XY in cell\n    float sz  = floor(p.z / SLAB + 0.5);\n    vec3  q   = vec3(lq, p.z - sz * SLAB);\n    gCid      = hash21(hl.zw + sz * 7.13);\n\n    // ---- D6 KIFS crystal ----------------------------------------------------\n    const float SCALE = 2.05;\n    const vec3  OFF   = vec3(0.92, 0.46, 0.70);\n    float s    = 1.0, trap = 1e9;\n    float tw   = 0.18 + 0.10 * sin(gT * 0.3 + gCid * 6.2831);   // breathing twist\n    q.xy = rot(gCid * 1.0472) * q.xy;                           // per-cell 60deg phase\n    for (int i = 0; i < KIFS_ITERS; i++){\n        q.xy = foldD6(q.xy);\n        q.z  = abs(q.z);\n        q.xy = rot(tw) * q.xy;\n        q    = q * SCALE - OFF * (SCALE - 1.0);\n        s   *= SCALE;\n        trap = min(trap, dot(q, q));\n    }\n    float crystal = sdHexPrism(q, vec2(0.95, 0.40)) / s;\n\n    // emissive circuitry: hex rings engraved into the finest-level prisms\n    float ring = max(abs(sdHex2(q.xy, 0.55)) - 0.07, abs(q.z) - 0.43) / s;\n\n    // ---- tunnel frame (twisted hexagonal prism following the spline) --------\n    vec2  tq  = rot(p.z * 0.12 + 0.3 * sin(gT * 0.2)) * (p.xy - path(p.z));\n    float tun = sdHex2(tq, TUN_R);                              // < 0 inside\n\n    // ---- honeycomb-perforated shell ------------------------------------------\n    // Unroll the hexagonal wall: angular coordinate wraps exactly N_AROUND cells\n    // of the triangular lattice (x-period 1), so the pattern tiles seamlessly.\n    const float N_AROUND = 12.0;\n    const float PITCH    = 6.9282 * TUN_R / N_AROUND;          // perimeter / N\n    float ang   = atan(tq.y, tq.x) / (2.0 * PI) * N_AROUND;\n    vec4  wl    = hexLattice(vec2(ang, p.z / PITCH));\n    float holeD = sdHex2(wl.yx, 0.36) * PITCH;                  // pointy-top alveoli\n    float shellD = abs(tun - 0.07) - 0.045;\n    float shell  = max(shellD, -holeD);\n    float rimE   = max(abs(holeD) - 0.0045, abs(tun - 0.025) - 0.007); // inner-lip hex filaments\n\n    // ---- honeycomb pillars of the outer lattice -------------------------------\n    float R    = 0.5 * CELL;\n    vec2  cq   = foldD6(lq.yx) - vec2(0.57735 * (R - 0.05), R - 0.05);\n    float cols = length(cq) - 0.06;\n\n    // ---- CSG: keep outer structure away from the shell ------------------------\n    float outer = max(min(crystal, cols), -(tun - 0.42));\n    float d     = min(outer, shell);\n    gMat        = shell < outer ? 1.0 : 0.0;\n    gCell2      = hash21(wl.zw);\n\n    gEmit = min(max(ring, -(tun - 0.42)), rimE);\n    gTrap = trap;\n    return d;\n}\n\n// -----------------------------------------------------------------------------\n// Geometry & lighting\n// -----------------------------------------------------------------------------\nvec3 calcNormal(vec3 p, float t){\n    float h = 0.0004 + 0.0006 * t;\n    const vec2 k = vec2(1.0, -1.0);\n    return normalize(k.xyy * map(p + k.xyy * h) + k.yyx * map(p + k.yyx * h) +\n                     k.yxy * map(p + k.yxy * h) + k.xxx * map(p + k.xxx * h));\n}\n\nfloat calcAO(vec3 p, vec3 n){\n    float occ = 0.0, w = 1.0;\n    for (int i = 0; i < 5; i++){\n        float h = 0.012 + 0.07 * float(i);\n        occ += (h - map(p + n * h)) * w;\n        w   *= 0.72;\n    }\n    return clamp(1.0 - 3.0 * occ, 0.0, 1.0);\n}\n\nfloat softShadow(vec3 ro, vec3 rd, float tmax){\n    float res = 1.0, t = 0.03;\n    for (int i = 0; i < 24; i++){\n        float h = map(ro + rd * t);\n        res = min(res, 12.0 * h / t);\n        t  += clamp(h, 0.02, 0.2);\n        if (res < 0.004 || t > tmax) break;\n    }\n    res = clamp(res, 0.0, 1.0);\n    return res * res * (3.0 - 2.0 * res);\n}\n\n// GGX / Trowbridge-Reitz specular, Smith-Schlick visibility, Schlick Fresnel\nvec3 ggx(vec3 n, vec3 v, vec3 l, float rough, vec3 F0){\n    vec3  h   = normalize(v + l);\n    float NoH = max(dot(n, h), 0.0), NoV = max(dot(n, v), 1e-3), NoL = max(dot(n, l), 0.0);\n    float a2  = rough * rough; a2 *= a2;\n    float dn  = NoH * NoH * (a2 - 1.0) + 1.0;\n    float D   = a2 / (PI * dn * dn);\n    float k   = (rough + 1.0) * (rough + 1.0) / 8.0;\n    float V   = 1.0 / ((NoV * (1.0 - k) + k) * (NoL * (1.0 - k) + k));\n    vec3  F   = F0 + (1.0 - F0) * pow(1.0 - max(dot(h, v), 0.0), 5.0);\n    return D * V * F * NoL * 0.25;\n}\n\nvec3 aces(vec3 x){\n    return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);\n}\n\n// energy pulse racing down the tunnel\nfloat pulse(float z){\n    float w = fract((z - gCamZ) * 0.09 - gT * 0.45);\n    return 0.2 + 5.0 * pow(w, 30.0) + 0.7 * pow(w, 5.0);\n}\n\nvec3 energyCol(float z){ return palEnergy(0.03 * z + 0.05 * gT); }\n\nvec3 fogCol(vec3 rd){ return 0.02 * palEnergy(0.6 + 0.3 * rd.y + 0.03 * gT); }\n\n// -----------------------------------------------------------------------------\n// Over-relaxed sphere tracer (Keinert 2014). Returns t or -1. Accumulates glow.\n// -----------------------------------------------------------------------------\nfloat march(vec3 ro, vec3 rd, float pix, int steps, float tmax, inout vec3 vol, float volW){\n    float t = 0.02, omega = 1.35, prevR = 0.0, stepLen = 0.0;\n    float candErr = 1e9, candT = -1.0;\n    for (int i = 0; i < MAX_STEPS; i++){\n        if (i >= steps) break;\n        vec3  p  = ro + rd * t;\n        float r  = map(p);\n        float ar = abs(r);\n\n        // volumetric in-scattering from the emissive circuitry\n        if (volW > 0.0){\n            float e = gEmit;\n            vol += volW * energyCol(p.z) * pulse(p.z) * 0.0004 / (0.0004 + e * e * 300.0)\n                   * exp(-0.07 * t) * min(ar, 0.15) * 0.6;\n        }\n\n        bool fail = omega > 1.0 && (ar + prevR) < stepLen;\n        if (fail){ stepLen -= omega * stepLen; omega = 1.0; }\n        else     { stepLen  = r * omega; }\n        prevR = ar;\n\n        float err = ar / t;\n        if (!fail && err < candErr){ candErr = err; candT = t; }\n        if (!fail && err < pix) return t;\n        t += stepLen;\n        if (t > tmax) break;\n    }\n    return candErr < pix * 4.0 ? candT : -1.0;\n}\n\n// surface shading (shared by primary hit & reflection)\nvec3 shade(vec3 p, vec3 n, vec3 rd, float t, bool full, out vec3 F0out, out float roughOut){\n    map(p);\n    float trap = gTrap, cid = gCid, mat = gMat, emit = gEmit;\n\n    vec3  alb;\n    float rough;\n    vec3  F0;\n    if (mat < 0.5){\n        alb   = palCrystal(0.22 * log(1.0 + trap) + 0.35 * cid + 0.04 * p.z);\n        alb   = mix(alb, alb * alb, 0.4);\n        rough = 0.22;\n        F0    = mix(vec3(0.04), alb, 0.55);      // semi-metallic crystal\n    } else {\n        alb   = vec3(0.02, 0.02, 0.028);\n        rough = 0.30;\n        F0    = vec3(0.16, 0.15, 0.17);           // dark brushed alloy\n    }\n    F0out = F0; roughOut = rough;\n\n    vec3 v = -rd;\n\n    // key light rides ahead of the camera along the tunnel axis\n    vec3  lp  = vec3(path(gCamZ + 2.2), gCamZ + 2.2);\n    vec3  lv  = lp - p;\n    float ld2 = dot(lv, lv);\n    vec3  l   = lv * inversesqrt(ld2);\n    float att = 1.8 / (1.0 + ld2 * 0.9);\n    float sh  = full ? softShadow(p + n * 0.004, l, sqrt(ld2)) : 1.0;\n    float ao  = full ? calcAO(p, n) : 0.6;\n    float dif = max(dot(n, l), 0.0);\n\n    vec3 lc  = mix(vec3(1.0, 0.9, 0.8), energyCol(gCamZ + 4.0), 0.35);\n    vec3 col = alb * (1.0 - F0) * dif * att * sh * lc / PI * 3.0;\n    col     += ggx(n, v, l, rough, F0) * att * sh * lc * (mat < 0.5 ? 1.2 : 0.18);\n\n    // hemispheric bounce tinted by the energy field\n    col += alb * ao * (0.06 + 0.06 * n.y) * energyCol(p.z + 3.0);\n\n    // emissive circuitry\n    float em = smoothstep(0.003 + 0.002 * t, 0.0, emit);\n    col += em * energyCol(p.z + 6.0 * gCell2) * pulse(p.z) * 3.0;\n\n    return col * mix(0.5, 1.0, ao);\n}\n\n// -----------------------------------------------------------------------------\nvec3 render(vec3 ro, vec3 rd, float pix){\n    vec3  vol = vec3(0.0);\n    float t   = march(ro, rd, pix, MAX_STEPS, MAX_DIST, vol, 1.0);\n    vec3  bg  = fogCol(rd);\n    vec3  col = bg;\n\n    if (t > 0.0){\n        vec3 p = ro + rd * t;\n        vec3 n = calcNormal(p, t);\n        vec3 F0; float rough;\n        col = shade(p, n, rd, t, true, F0, rough);\n\n#if REFLECTIONS\n        vec3  rr   = reflect(rd, n);\n        vec3  fres = F0 + (1.0 - F0) * pow(1.0 - max(dot(n, -rd), 0.0), 5.0);\n        vec3  dummy = vec3(0.0);\n        float tr   = march(p + n * 0.01, rr, pix * 3.0, 56, 10.0, dummy, 0.0);\n        vec3  rc   = fogCol(rr);\n        if (tr > 0.0){\n            vec3 rp = p + n * 0.01 + rr * tr;\n            vec3 rn = calcNormal(rp, tr);\n            vec3 f2; float r2;\n            rc = shade(rp, rn, rr, tr, false, f2, r2);\n            rc = mix(rc, fogCol(rr), 1.0 - exp(-0.05 * tr * tr));\n        }\n        col += rc * fres * (1.0 - rough) * 0.8;\n#endif\n        col = mix(col, bg, 1.0 - exp(-0.004 * t * t));\n    }\n    return col + vol;\n}\n\n// -----------------------------------------------------------------------------\nvoid mainImage(out vec4 fragColor, in vec2 fragCoord){\n    gT = iTime;\n\n    // camera on the spline, looking ahead with banking proportional to curvature\n    gCamZ   = gT * 1.1;\n    vec3 ro = vec3(path(gCamZ), gCamZ);\n    vec3 ta = vec3(path(gCamZ + 1.6), gCamZ + 1.6);\n    float bank = 2.2 * (path(gCamZ + 2.0).x - 2.0 * path(gCamZ + 1.0).x + ro.x);   // ~x''\n    bank += 0.15 * sin(gT * 0.23);\n\n    vec3 fw = normalize(ta - ro);\n    vec3 rt = normalize(cross(fw, vec3(sin(bank), cos(bank), 0.0)));\n    vec3 up = cross(rt, fw);\n    float fl = 1.35;\n    float pix = 1.2 / (iResolution.y * fl);          // cone half-angle per pixel\n\n    vec3 col = vec3(0.0);\n    for (int m = 0; m < AA; m++)\n    for (int k = 0; k < AA; k++){\n        vec2 o  = vec2(float(m), float(k)) / float(AA) - 0.5 / float(AA);\n        vec2 uv = (2.0 * (fragCoord + o) - iResolution.xy) / iResolution.y;\n        vec3 rd = normalize(uv.x * rt + uv.y * up + fl * fw);\n        col += render(ro, rd, pix);\n    }\n    col /= float(AA * AA);\n\n    // post\n    vec2 q = fragCoord / iResolution.xy;\n    float vig = pow(16.0 * q.x * q.y * (1.0 - q.x) * (1.0 - q.y), 0.18);\n    col *= mix(vec3(0.55, 0.45, 0.65), vec3(1.0), vig);\n    col  = aces(col * 1.1);\n    col  = pow(col, vec3(0.4545));\n    col += (hash21(fragCoord + fract(gT)) - 0.5) / 255.0;   // dither vs banding\n\n    fragColor = vec4(col, 1.0);\n}", "inputs": []}], "options": {"scale": 1, "maxPixels": 300000, "fpsCap": 30, "reactive": true}};
</script>

  // ---------------------------------------------------------------- generated textures
  // Seeded PRNG so generated noise is identical on every load.

    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);

      var x0 = ((xi % period) + period) % period, y0 = ((yi % period) + period) % period;

    var dpr = window.devicePixelRatio || 1, scale = opts.scale || 1;

    // Pixel budget keeps heavy raymarchers smooth on Retina or very large panels.
    var budget = opts.maxPixels || 600000;
    if (cw * ch * scale * scale > budget) scale = Math.sqrt(budget / (cw * ch));
    var w = Math.max(1, Math.round(cw * scale));
    var h = Math.max(1, Math.round(ch * scale));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    ensureBuffers(w, h);
    return [w, h];
  }

  function bindInputs(pass) {
    for (var c = 0; c < 4; c++) {
      var inp = pass.byChannel[c], res = null, target = gl.TEXTURE_2D, hasMips = false;
      gl.activeTexture(gl.TEXTURE0 + c);
      chanRes[c * 3] = chanRes[c * 3 + 1] = chanRes[c * 3 + 2] = 0;
      if (inp) {
        if (inp.kind === 'buffer') {
          var b = buffers[inp.buffer];
          if (b && b.pair) {
            res = { tex: b.pair[b.cur].tex, target: gl.TEXTURE_2D };
            hasMips = b.wantMips;
            chanRes[c * 3] = b.w; chanRes[c * 3 + 1] = b.h; chanRes[c * 3 + 2] = 1;
          }
        } else if (inp.res) {
          res = inp.res; target = res.target; hasMips = res.mips;
          chanRes[c * 3] = res.w; chanRes[c * 3 + 1] = res.h; chanRes[c * 3 + 2] = res.d;
        }
      }
      if (res) {
        gl.bindTexture(res.target, res.tex);
        var filter = inp.filter || 'linear';
        if (inp.kind === 'buffer' && filter !== 'nearest' && !rtFormat.linear) filter = 'nearest';
        applySampler(res.target, filter, isGL2 || res.target !== gl.TEXTURE_2D || inp.kind !== 'buffer' ? inp.wrap : 'clamp', hasMips);
      } else {
        gl.bindTexture(gl.TEXTURE_2D, null);
      }
      gl.uniform1i(pass.u.ch[c], c);
    }
  }

  function draw(now) {
    var dt = lastNow ? Math.min((now - lastNow) / 1000, 0.1) : 1 / 60;
    lastNow = now;
    fpsAcc += dt; fpsFrames++;
    if (fpsAcc > 0.5) { fps = fpsFrames / fpsAcc; fpsAcc = 0; fpsFrames = 0; debug.fps = Math.round(fps); }

    updateReactivity(now, dt);
    var simDt = dt * react.speed;
    simTime += simDt;
    if (audioTex) updateFakeAudio(simTime);

    var size = resize(), w = size[0], h = size[1];
    var date = new Date();
    var secs = date.getHours() * 3600 + date.getMinutes() * 60 + date.getSeconds() + date.getMilliseconds() / 1000;
    for (var c = 0; c < 4; c++) chanTime[c] = simTime;
    if (!clickFrame) mouse[3] = -Math.abs(mouse[3]);

    for (var i = 0; i < passes.length; i++) {
      var p = passes[i], target = null, b = null;
      if (p.output !== 'image') { b = buffers[p.output]; target = b.pair[1 - b.cur]; }
      gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fb : null);
      gl.viewport(0, 0, w, h);
      gl.useProgram(p.prog);
      bindInputs(p);
      gl.uniform3f(p.u.iResolution, w, h, 1);
      gl.uniform1f(p.u.iTime, simTime);
      gl.uniform1f(p.u.iTimeDelta, simDt);
      gl.uniform1f(p.u.iFrameRate, fps);
      gl.uniform1i(p.u.iFrame, frameNo);
      gl.uniform4f(p.u.iMouse, mouse[0], mouse[1], mouse[2], mouse[3]);
      gl.uniform4f(p.u.iDate, date.getFullYear(), date.getMonth(), date.getDate(), secs);
      gl.uniform1f(p.u.iSampleRate, 44100);
      gl.uniform4f(p.u.iMoltamp, react.energy, react.speed, (STATES[react.state] || STATES.unknown).code, react.pulse);
      if (p.u.iChannelTime) gl.uniform1fv(p.u.iChannelTime, chanTime);
      if (p.u.iChannelResolution) gl.uniform3fv(p.u.iChannelResolution, chanRes);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      if (b) {
        b.cur = 1 - b.cur;
        if (b.wantMips) { gl.bindTexture(gl.TEXTURE_2D, b.pair[b.cur].tex); gl.generateMipmap(gl.TEXTURE_2D); }
      }
    }
    clickFrame = false;
    frameNo++;
    debug.frame = frameNo;
  }

  var lastDraw = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    if (!started) {
      if (ext.parallel && !passes.every(function (p) { return gl.getProgramParameter(p.prog, ext.parallel.COMPLETION_STATUS_KHR); })) return;
      started = true;
      if (!finishLink()) { started = 'failed'; return; }
      debug.ready = true;
    }
    if (started !== true || !visible) { lastNow = 0; return; }
    var cap = opts.fpsCap || 60;
    if (now - lastDraw < 1000 / cap - 2) return;
    lastDraw = now;
    draw(now);
  }

  // Per-widget overrides persisted with moltamp.settings: { scale, maxPixels, fpsCap, speed, reactive }.
  (function () {
    if (!window.moltamp || !moltamp.settings) { requestAnimationFrame(loop); return; }
    moltamp.settings.read().then(function (saved) {
      saved = saved || {};
      ['scale', 'maxPixels', 'fpsCap', 'speed', 'reactive'].forEach(function (k) { if (saved[k] !== undefined) opts[k] = saved[k]; });
      reactive = opts.reactive !== false;
    }).catch(function () { /* first run: no settings yet */ }).then(function () { requestAnimationFrame(loop); });
  })();
})();

</script>
