<!--
  Codebase Cosmos — Starship pack for MOLTamp
  Your codebase as a 3D galaxy: one spiral arm per top-level folder, a star system per folder, a star per file. Stars glow when Claude reads them and grow when it edits them; uncommitted files turn into red giants that go supernova on your next commit. Drag to orbit, scroll to zoom, double-click to reset.
  Author: j0j0 · License: MIT
-->
<div id="cy-root"><canvas id="ss-gl"></canvas><canvas id="cy-canvas"></canvas><div id="cy-label"></div></div>

<style>
  #cy-root { position: absolute; inset: 0; overflow: hidden; background: var(--c-chrome-bg); container-type: size; }
  #ss-gl, #cy-canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  #cy-canvas { cursor: grab; touch-action: none; }
  #cy-canvas.dragging { cursor: grabbing; }
  #cy-label {
    position: absolute; left: 8px; right: 8px; bottom: 6px; pointer-events: none; letter-spacing: 0.08em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: var(--c-chrome-dim); text-shadow: 0 0 6px var(--c-chrome-bg);
    font: calc(clamp(8px, 3.4cqw, 12px) * var(--user-text-scale, 1)) 'SF Mono', Menlo, 'Hiragino Sans', monospace;
  }
</style>

<script>
// cyber-kit — shared runtime of the Cyberpunk widget pack (MIT, j0j0).
// Skin colours resolved for canvas use, DPR-aware canvas, pause when hidden, Claude state, telemetry.
var CK = (function () {
  'use strict';

  var hasSdk = typeof window.moltamp !== 'undefined';

  // ------------------------------------------------------------------ skin colours
  var VARS = {
    bg: '--c-chrome-bg', text: '--c-chrome-text', accent: '--c-chrome-accent', dim: '--c-chrome-dim',
    border: '--c-chrome-border', fg: '--t-foreground', termBg: '--t-background', red: '--t-red',
    green: '--t-green', yellow: '--t-yellow', blue: '--t-blue', cyan: '--t-cyan', magenta: '--t-magenta'
  };
  // A colour missing from the skin borrows another skin colour, never a hardcoded value.
  var BORROW = {
    text: ['fg', 'accent'], fg: ['text', 'accent'], accent: ['text', 'fg'], dim: ['text', 'fg'], border: ['dim', 'text'],
    bg: ['termBg'], termBg: ['bg'], red: ['magenta', 'accent'], green: ['cyan', 'accent'], yellow: ['accent', 'red'],
    blue: ['cyan', 'accent'], cyan: ['blue', 'accent'], magenta: ['red', 'accent']
  };
  var probeEl = document.createElement('span');
  probeEl.style.display = 'none';
  (document.body || document.documentElement).appendChild(probeEl);
  var pc = document.createElement('canvas');
  pc.width = pc.height = 1;
  var pctx = pc.getContext('2d', { willReadFrequently: true });
  var rgb = {};
  var c = {};

  // Resolves any CSS colour the skin may use (hex, rgb, var(), color-mix()) to RGB bytes.
  function readVar(name) {
    var raw = getComputedStyle(document.documentElement).getPropertyValue(VARS[name]).trim();
    if (!raw) return null;
    probeEl.style.color = '';
    probeEl.style.color = raw;
    var computed = getComputedStyle(probeEl).color;
    pctx.fillStyle = '#010203';
    pctx.fillStyle = computed;
    if (pctx.fillStyle === '#010203' && computed !== 'rgb(1, 2, 3)') return null;
    pctx.clearRect(0, 0, 1, 1);
    pctx.fillRect(0, 0, 1, 1);
    var d = pctx.getImageData(0, 0, 1, 1).data;
    return [d[0], d[1], d[2]];
  }

  function refreshColors() {
    var name, raw = {};
    for (name in VARS) raw[name] = readVar(name);
    for (name in VARS) {
      var v = raw[name], chain = BORROW[name] || [];
      for (var i = 0; !v && i < chain.length; i++) v = raw[chain[i]];
      if (!v) {
        // Last resort: the host's own text colour, still a skin value.
        probeEl.style.color = '';
        var m = /(\d+)\D+(\d+)\D+(\d+)/.exec(getComputedStyle(document.body || document.documentElement).color) || [0, 128, 128, 128];
        v = [+m[1], +m[2], +m[3]];
      }
      rgb[name] = v;
      c[name] = 'rgb(' + v[0] + ',' + v[1] + ',' + v[2] + ')';
    }
  }
  refreshColors();

  function rgba(name, a) {
    var v = rgb[name] || rgb.text;
    return 'rgba(' + v[0] + ',' + v[1] + ',' + v[2] + ',' + a + ')';
  }

  function mix(a, b, t, alpha) {
    var x = rgb[a] || rgb.text, y = rgb[b] || rgb.text;
    var r = Math.round(x[0] + (y[0] - x[0]) * t), g = Math.round(x[1] + (y[1] - x[1]) * t), bl = Math.round(x[2] + (y[2] - x[2]) * t);
    return alpha === undefined ? 'rgb(' + r + ',' + g + ',' + bl + ')' : 'rgba(' + r + ',' + g + ',' + bl + ',' + alpha + ')';
  }

  function lum(name) {
    var v = rgb[name] || rgb.text;
    return (0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2]) / 255;
  }

  // ------------------------------------------------------------------ sdk wrappers
  // moltamp.poll only: it cleans itself up when the widget unloads (store rule: no raw setInterval).
  function poll(ms, fn) {
    if (hasSdk && moltamp.poll) return moltamp.poll(ms, fn);
    return function () {};
  }

  function subscribe(store, selector, cb) {
    if (!hasSdk || !moltamp.subscribe) return function () {};
    try { return moltamp.subscribe(store, selector, cb) || function () {}; } catch (e) { return function () {}; }
  }

  function call(channel) {
    if (!hasSdk || !moltamp.call) return Promise.reject(new Error('no sdk'));
    try { return Promise.resolve(moltamp.call.apply(moltamp, arguments)); } catch (e) { return Promise.reject(e); }
  }

  // ------------------------------------------------------------------ text scale (Settings > Display)
  var textScale = 1;
  if (hasSdk && moltamp.settings) {
    moltamp.settings.read().then(function (cfg) {
      cfg = cfg || {};
      if (typeof cfg.widgetTextScale === 'number') textScale = cfg.widgetTextScale;
      document.documentElement.style.setProperty('--user-text-scale', String(textScale));
    }).catch(function () { /* first run: no settings */ });
  }

  function font(size, weight) {
    return (weight || 'normal') + ' ' + Math.max(7, size * textScale).toFixed(1) +
      'px "SF Mono", Menlo, "Hiragino Sans", "Hiragino Kaku Gothic ProN", monospace';
  }

  // ------------------------------------------------------------------ Claude shell state
  var STATES = ['idle', 'thinking', 'streaming', 'tool-use', 'permission', 'error', 'complete'];
  var state = { name: 'idle', since: performance.now(), seen: false };
  var stateListeners = [];
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.type !== 'moltamp:push' || d.subscriptionId !== 'shell-state' || STATES.indexOf(d.data) < 0) return;
    var prev = state.name;
    state.name = d.data;
    state.since = performance.now();
    state.seen = true;
    for (var i = 0; i < stateListeners.length; i++) {
      try { stateListeners[i](state.name, prev); } catch (err) { /* keep other listeners alive */ }
    }
  });

  function currentState() {
    // "complete" is a moment, not a mode: fall back to idle after a few seconds.
    if (state.name === 'complete' && performance.now() - state.since > 4000) return 'idle';
    return state.name;
  }

  // ------------------------------------------------------------------ terminal telemetry
  var tel = { bytes: 0, activity: 'idle', level: 0, started: false };
  function telemetry() {
    if (!tel.started) {
      tel.started = true;
      subscribe('telemetry', 'bytesPerSec', function (v) { tel.bytes = Number(v) || 0; });
      subscribe('telemetry', 'activity', function (v) { tel.activity = v || 'idle'; });
    }
    return tel;
  }

  // 0..1 terminal energy, log-scaled bytes plus the activity level, smoothed by the caller's dt.
  function telemetryLevel(dt) {
    var target = Math.min(1, Math.log(1 + tel.bytes) / Math.log(1 + 200000)) * 0.75 +
      (tel.activity === 'high' ? 0.35 : tel.activity === 'low' ? 0.15 : 0);
    tel.level += (Math.min(1, target) - tel.level) * (1 - Math.exp(-(dt || 0.016) / 0.5));
    return tel.level;
  }

  // ------------------------------------------------------------------ Claude Code hook events
  // event.events is a ring buffer of the last ~200 hook payloads from every session; callers only
  // want what is new, so entries are de-duplicated by timestamp, hook, tool and session.
  var evSeen = {}, evQueue = [], evListeners = [], evStarted = false;
  function eventKey(e) { return [e._ts, e._hook || e.hook_event_name, e.tool_name, e._session || e.session_id].join('|'); }
  function onEvents(cb) {
    evListeners.push(cb);
    if (evStarted) return;
    evStarted = true;
    var first = true;
    subscribe('event', 'events', function (v) {
      var list = Array.isArray(v) ? v : v && typeof v === 'object' ? Object.keys(v).map(function (k) { return v[k]; }) : [];
      var fresh = [];
      for (var i = 0; i < list.length; i++) {
        var e = list[i];
        if (!e || typeof e !== 'object') continue;
        var k = eventKey(e);
        if (evSeen[k]) continue;
        evSeen[k] = true;
        evQueue.push(k);
        fresh.push(e);
      }
      while (evQueue.length > 800) delete evSeen[evQueue.shift()];
      var history = first;
      first = false;
      if (fresh.length) for (var j = 0; j < evListeners.length; j++) {
        try { evListeners[j](fresh, history); } catch (err) { /* keep other listeners alive */ }
      }
    });
  }

  // A failure is read from the tool's response or the hook name, never from its input
  // (a command that merely contains the word "error" is not a failure).
  function isFailure(e) {
    var hook = String(e.hook_event_name || e._hook || '');
    if (/fail|error/i.test(hook)) return true;
    var r = e.tool_response;
    if (!r || typeof r !== 'object') return false;
    if (r.is_error === true || r.isError === true || r.success === false || r.interrupted === true) return true;
    var code = r.exitCode !== undefined ? r.exitCode : r.exit_code !== undefined ? r.exit_code : r.code;
    if (typeof code === 'number' && code !== 0) return true;
    return typeof r.error === 'string' && r.error.length > 0;
  }

  function toolLabel(name) {
    name = String(name || '?');
    if (name.indexOf('mcp__') !== 0) return name;
    // mcp__plugin_chrome-devtools-mcp_chrome-devtools__take_screenshot -> chrome-devtools
    var server = name.split('__')[1] || 'mcp';
    server = server.replace(/^plugin_/, '').replace(/^claude_ai_/, '').split('_').pop();
    return 'mcp:' + server;
  }

  // ------------------------------------------------------------------ canvas + loop
  // Paused while off screen (hidden tab) or while the whole page is hidden; both must clear to resume.
  var onScreen = true, pageVisible = !document.hidden, watching = false;
  function visibleNow() { return onScreen && pageVisible; }
  function watch(el) {
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (entries) { onScreen = entries[entries.length - 1].isIntersecting; }).observe(el);
    }
    if (!watching) {
      watching = true;
      document.addEventListener('visibilitychange', function () { pageVisible = !document.hidden; });
    }
  }

  function surface(el) {
    var s = { el: el, ctx: el.getContext('2d'), w: 0, h: 0, dpr: 1, resized: true };
    s.fit = function () {
      var dpr = Math.min(2, window.devicePixelRatio || 1);
      var w = Math.max(1, el.clientWidth), h = Math.max(1, el.clientHeight);
      if (w !== s.w || h !== s.h || dpr !== s.dpr) {
        s.w = w; s.h = h; s.dpr = dpr;
        el.width = Math.round(w * dpr);
        el.height = Math.round(h * dpr);
        s.resized = true;
      }
      s.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return s;
    };
    watch(el);
    return s;
  }

  function loop(fn, fpsCap) {
    var last = 0, lastDraw = 0, logged = false, cap = fpsCap || 60;
    function frame(now) {
      requestAnimationFrame(frame);
      if (!visibleNow()) { last = 0; return; }
      if (now - lastDraw < 1000 / cap - 2) return;
      var dt = last ? Math.min((now - last) / 1000, 0.1) : 1 / 60;
      last = lastDraw = now;
      try { fn(dt, now / 1000); } catch (e) {
        if (!logged) { logged = true; console.error('[cyber-kit]', e); }
      }
    }
    requestAnimationFrame(frame);
  }

  function resetCtx(ctx) {
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.shadowBlur = 0;
    ctx.lineWidth = 1;
    ctx.setLineDash([]);
  }

  // ------------------------------------------------------------------ small utils
  function hash(str) {
    var h = 2166136261;
    str = String(str);
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return ((h >>> 0) % 100000) / 100000;
  }

  function prng(seed) {
    var a = (seed * 4294967296) >>> 0 || 1;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = Math.imul(a ^ (a >>> 15), a | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function fmtBytes(b) {
    if (hasSdk && moltamp.fmt && moltamp.fmt.bytes) return moltamp.fmt.bytes(b);
    var u = ['B', 'KB', 'MB', 'GB'], i = 0;
    while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
    return b.toFixed(i ? 1 : 0) + ' ' + u[i];
  }

  // Skin switches update CSS variables live; re-resolve once a second.
  poll(1000, refreshColors);

  return {
    c: c, rgb: rgb, rgba: rgba, mix: mix, lum: lum, refreshColors: refreshColors,
    poll: poll, subscribe: subscribe, call: call, font: font,
    state: currentState, stateInfo: state, onState: function (cb) { stateListeners.push(cb); },
    telemetry: telemetry, telemetryLevel: telemetryLevel,
    onEvents: onEvents, isFailure: isFailure, toolLabel: toolLabel,
    surface: surface, loop: loop, resetCtx: resetCtx, isVisible: visibleNow,
    hash: hash, prng: prng, fmtBytes: fmtBytes,
    meta: (hasSdk && moltamp.meta) || { context: 'panel' }
  };
})();

// Codebase Cosmos: the files Claude touches, laid out as a 3D spiral galaxy (one arm per top-level folder).
(function () {
  'use strict';
  var glCanvas = document.getElementById('ss-gl');
  var ov = document.getElementById('cy-canvas');
  var O = CK.surface(ov);
  var label = document.getElementById('cy-label');
  var sdk = typeof window.moltamp !== 'undefined' && window.moltamp.settings ? window.moltamp : null;
  var MAX_FILES = 1500, MAX_PROJECTS = 4, SAVE_BUDGET = 28000, PIXEL_BUDGET = 1.6e6, MAX_GIT_ADDS = 300;
  var FOVY = 45 * Math.PI / 180, GOLDEN = 2.39996323, TWIST = 2.6, STRIDE = 8;
  var N_BG = 450, N_DUST = 260, N_BULGE = 220, MIN_ARMS = 3;
  var FAMILY = [[/\.(tsx?|jsx?|mjs|cjs)$/i, 'cyan'], [/\.(py|go|rs|java|kt|rb|php|c|cc|cpp|h|hpp|swift|cs|scala)$/i, 'blue'],
    [/\.(css|scss|sass|less|html?|svg|vue|svelte)$/i, 'magenta'], [/\.(md|mdx|txt|rst|adoc)$/i, 'yellow'],
    [/\.(json|ya?ml|toml|ini|env|sql|lock|xml|csv)$/i, 'green']];
  var ARM_COLS = ['accent', 'magenta', 'blue', 'cyan'];
  var ENERGY = { idle: 0.2, thinking: 0.5, streaming: 0.8, 'tool-use': 1, permission: 0.4, error: 0.6, complete: 0.9 };
  var EDIT = /^(Edit|MultiEdit|Write|NotebookEdit)$/, READ = /^(Read|NotebookRead)$/, SEARCH = /^(Grep|Glob)$/;

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function baseName(p) { var s = String(p).replace(/\/+$/, '').split('/'); return s[s.length - 1] || p; }
  function family(rel) {
    for (var i = 0; i < FAMILY.length; i++) if (FAMILY[i][0].test(rel)) return FAMILY[i][1];
    return 'accent';
  }

  // ------------------------------------------------------------------ the map (one per project = cwd)
  var projects = {}, current = null, ready = false, pending = [], dirty = false, lastChange = 0, lastSave = Date.now();
  var probe = { target: null, project: null, live: 0, pos: null, trail: [] };

  function project(root) {
    var p = projects[root];
    if (!p) p = projects[root] = { root: root, name: baseName(root), arms: [], files: {}, folders: {}, count: 0, seen: 0, savedSeen: 0, last: 0 };
    return p;
  }

  function armIndex(p, top) {
    var i = p.arms.indexOf(top);
    if (i < 0) { p.arms.push(top); i = p.arms.length - 1; staticDirty = true; }
    return i;
  }

  // Deterministic placement: arms in order of first sight at golden-angle steps, folders along their arm by depth.
  function folderCenter(p, dir, top) {
    if (dir === '') return [0, 0, 0];
    var base = armIndex(p, top) * GOLDEN, depth = dir.split('/').length;
    var r = dir === top ? 0.16 + 0.06 * CK.hash(top) : Math.min(0.95, 0.2 + 0.11 * (depth - 1) + 0.45 * CK.hash(dir + '#r'));
    var ang = base + TWIST * r + (CK.hash(dir + '#a') - 0.5) * 0.35;
    return [Math.cos(ang) * r, (CK.hash(dir + '#y') - 0.5) * 0.08 * (1 - r * 0.5), Math.sin(ang) * r];
  }

  function filePos(c, rel, core) {
    var a = CK.hash(rel + '#a') * 6.2832, b = (CK.hash(rel + '#b') - 0.5) * 0.9;
    var d = (core ? 0.1 : 0.05) * Math.sqrt(CK.hash(rel + '#d')) + 0.008;
    return [c[0] + Math.cos(a) * Math.cos(b) * d, c[1] + Math.sin(b) * d * 0.5, c[2] + Math.sin(a) * Math.cos(b) * d];
  }

  function score(f, now) { return f.edits * 3 + f.reads - (now - f.last) / 3600e3 + (f.red ? 1e6 : 0); }

  function remove(p, f) {
    var fo = p.folders[f.dir];
    if (fo) {
      fo.files.splice(fo.files.indexOf(f), 1);
      if (!fo.files.length) delete p.folders[f.dir];
    }
    delete p.files[f.rel];
    p.count--;
  }

  function file(p, rel) {
    var f = p.files[rel];
    if (f) return f;
    if (p.count >= MAX_FILES) {
      var now = Date.now(), worst = null, ws = Infinity;
      for (var k in p.files) { var s = score(p.files[k], now); if (s < ws) { ws = s; worst = p.files[k]; } }
      if (worst) remove(p, worst);
    }
    var cut = rel.lastIndexOf('/'), dir = cut < 0 ? '' : rel.slice(0, cut), top = cut < 0 ? '' : rel.split('/')[0];
    var fo = p.folders[dir] || (p.folders[dir] = { dir: dir, top: top, center: folderCenter(p, dir, top), files: [] });
    f = p.files[rel] = { rel: rel, dir: dir, reads: 0, edits: 0, last: 0, fam: family(rel), pos: filePos(fo.center, rel, dir === ''),
      flare: 0, hot: 0, fail: 0, nova: 0, red: false, sx: -1e4, sy: -1e4 };
    fo.files.push(f);
    p.count++;
    return f;
  }

  // An absolute path belongs to the project whose root is its longest prefix; a relative one to the event's cwd.
  function locate(raw, root) {
    root = String(root || '').replace(/\/+$/, '');
    if (raw.charAt(0) === '/') {
      var best = '';
      [root].concat(Object.keys(projects)).forEach(function (r) {
        if (r && raw.indexOf(r + '/') === 0 && r.length > best.length) best = r;
      });
      if (!best) return null;
      return { p: project(best), rel: raw.slice(best.length + 1).replace(/\/+$/, '') };
    }
    if (!root) return null;
    return { p: project(root), rel: raw.replace(/^\.\//, '').replace(/\/+$/, '') };
  }

  function ingest(events, history) {
    for (var i = 0; i < events.length; i++) {
      var e = events[i], tool = String(e.tool_name || ''), hook = String(e.hook_event_name || e._hook || ''), ti = e.tool_input;
      if (!tool || !ti || typeof ti !== 'object') continue;
      var pre = /^Pre/i.test(hook), post = /^Post/i.test(hook);
      if (!pre && !post) continue;
      var raw = ti.file_path || ti.notebook_path || (SEARCH.test(tool) || READ.test(tool) ? ti.path : null);
      if (!raw || typeof raw !== 'string') continue;
      var where = locate(raw, e.cwd);
      if (!where || !where.rel || /(^|\/)\.\.(\/|$)/.test(where.rel)) continue;
      var p = where.p, rel = where.rel, ts = Number(e._ts) || Date.now();
      // The ring buffer replays events already counted in the saved map.
      if (history && ts <= p.savedSeen) continue;
      p.seen = Math.max(p.seen, ts);
      p.last = Math.max(p.last, ts);
      if (post) {
        if (!history && CK.isFailure(e) && p.files[rel]) p.files[rel].fail = 1;
        continue;
      }
      if (SEARCH.test(tool) && !ti.file_path) {
        // A search path is usually a folder: light up what we know of it.
        var fo = p.folders[rel];
        if (!history && fo) fo.files.forEach(function (x) { x.flare = Math.max(x.flare, 0.6); });
        else if (!history && p.files[rel]) p.files[rel].flare = 1;
        continue;
      }
      var f = file(p, rel);
      if (EDIT.test(tool)) { f.edits++; if (!history) f.hot = 1; } else { f.reads++; if (!history) f.flare = 1; }
      f.last = Math.max(f.last, ts);
      if (!history) { probe.target = f; probe.project = p; probe.live = Date.now(); }
      dirty = true;
      lastChange = Date.now();
    }
  }

  CK.onEvents(function (fresh, history) {
    if (!ready) pending.push([fresh, history]);
    else ingest(fresh, history);
  });

  // ------------------------------------------------------------------ git: red giants and supernovae
  var commitsKnown = null, gitChanged = {}, novas = [];
  function applyGit() {
    if (!current) return;
    var p = current, added = 0;
    for (var k in p.files) p.files[k].red = !!gitChanged[k];
    for (var path in gitChanged) {
      if (p.files[path] || added >= MAX_GIT_ADDS) continue;
      // Only paths that look like this project (known top-level folder, or a root file) become stars.
      var top = path.indexOf('/') < 0 ? '' : path.split('/')[0];
      if (top && p.arms.indexOf(top) < 0) continue;
      file(p, path).red = true;
      added++;
    }
  }
  function supernova() {
    if (!current) return;
    for (var k in current.files) {
      var f = current.files[k];
      if (f.red) { f.nova = 1; if (novas.length < 60) novas.push({ f: f, age: 0 }); }
    }
  }
  CK.subscribe('git', 'status', function (s) {
    if (!s || typeof s !== 'object') return;
    var hashes = (Array.isArray(s.recentCommits) ? s.recentCommits : []).map(function (c) { return String(c && c.hash || ''); }).filter(Boolean);
    if (commitsKnown === null) {
      commitsKnown = {};
      hashes.forEach(function (h) { commitsKnown[h] = true; });
    } else {
      var fresh = hashes.filter(function (h) { return !commitsKnown[h]; });
      fresh.forEach(function (h) { commitsKnown[h] = true; });
      // The files that were uncommitted a moment ago are the ones this commit just took.
      if (fresh.length) supernova();
    }
    var changed = {};
    (Array.isArray(s.changedFiles) ? s.changedFiles : []).forEach(function (c) {

      }).filter(function (r) { return r.s > 0 && r.fo.dir; }).sort(function (a, b) { return b.s - a.s; }).slice(0, 5);
      var boxes = [];
      ranked.forEach(function (r) {
        var cc = r.fo.center;
        if (!projectPoint(mvp, cc[0], cc[1], cc[2], w, h, scratch)) return;
        var text = r.fo.dir.length > 28 ? '…' + r.fo.dir.slice(-27) : r.fo.dir, tw = ctx.measureText(text).width;
        var bx = clamp(scratch[0] + 8, 2, w - tw - 2), by = clamp(scratch[1] - 10, 8, h - 26);
        for (var b2 = 0; b2 < boxes.length; b2++) {
          var q2 = boxes[b2];
          if (bx < q2[0] + q2[2] && bx + tw > q2[0] && Math.abs(by - q2[1]) < 12) return;
        }
        boxes.push([bx, by, tw]);
        ctx.textAlign = 'left';
        ctx.fillStyle = CK.rgba('text', 0.75);
        ctx.fillText(text, bx, by);
      });
    }

    // Tooltip on the nearest star under the pointer
    if (mouse && current && !cam.drag) {
      var hit = null, hd = 14 * 14;
      for (i = 0; i < files.length; i++) {
        var dx = files[i].sx - mouse.x, dy = files[i].sy - mouse.y, d2 = dx * dx + dy * dy;
        if (d2 < hd) { hd = d2; hit = files[i]; }
      }
      if (hit) {
        var tip = hit.rel + (hit.edits ? ' · ' + hit.edits + ' edit' + (hit.edits > 1 ? 's' : '') : '') +
          (hit.reads ? ' · ' + hit.reads + ' read' + (hit.reads > 1 ? 's' : '') : '') + (hit.red ? ' · uncommitted' : '');
        var tw2 = ctx.measureText(tip).width + 10, tx = clamp(mouse.x + 12, 2, w - tw2 - 2), ty = clamp(mouse.y - 18, 2, h - 18);
        ctx.fillStyle = CK.rgba('bg', 0.88);
        ctx.fillRect(tx, ty, tw2, 16);
        ctx.strokeStyle = CK.rgba(hit.red ? 'red' : hit.fam, 0.8);
        ctx.lineWidth = 1;
        ctx.strokeRect(tx + 0.5, ty + 0.5, tw2 - 1, 15);
        ctx.fillStyle = CK.c.text;
        ctx.textAlign = 'left';
        ctx.fillText(tip, tx + 5, ty + 8.5);
        ctx.strokeStyle = CK.rgba('fg', 0.8);
        ctx.beginPath(); ctx.arc(hit.sx, hit.sy, 6, 0, 6.283); ctx.stroke();
      }
    }

    if (!current) {
      ctx.textAlign = 'center';
      ctx.font = CK.font(Math.max(9, Math.min(w, h) / 18));
      ctx.fillStyle = CK.rgba('dim', 0.85);
      ctx.fillText('観測中 · waiting for Claude to open a file', w / 2, h * 0.8);
    }
    CK.resetCtx(ctx);

    // Narrow slots keep the essentials: files and what is still uncommitted.
    var text = !current ? '銀河 · no project yet' : '銀河 · ' + current.name + ' · ' + current.count + ' files' +
      (w >= 420 ? ' · ' + nEdited + ' edited' : '') + (nRed ? ' · ' + nRed + ' uncommitted' : '');
    if (text !== lastText) { lastText = text; label.textContent = text; }
  });
})();
</script>
