<!--
  Planet Log — Starship pack for MOLTamp
  Every task Claude finishes is a hyperspace jump to a new procedurally generated planet, named and logged after the prompt or commit that got you there. The catalogue of discovered worlds is kept between sessions: click the left or right half to browse it.
  Author: j0j0 · License: MIT
-->
<div id="cy-root"><canvas id="cy-canvas"></canvas><div id="cy-label"></div></div>

<style>
  #cy-root { position: absolute; inset: 0; overflow: hidden; background: var(--c-chrome-bg); container-type: size; }
  #cy-canvas { display: block; width: 100%; height: 100%; }
  #cy-label {
    position: absolute; left: 8px; bottom: 6px; pointer-events: none; letter-spacing: 0.08em;
    color: var(--c-chrome-dim); text-shadow: 0 0 6px var(--c-chrome-bg);
    font: calc(clamp(8px, 3.4cqw, 12px) * var(--user-text-scale, 1)) 'SF Mono', Menlo, 'Hiragino Sans', monospace;
  }
</style>

<script>
// cyber-kit — shared runtime of the Cyberpunk widget pack (MIT, j0j0).
// Skin colours resolved for canvas use, DPR-aware canvas, pause when hidden, Claude state, telemetry.
var CK = (function () {
  'use strict';

  var hasSdk = typeof window.moltamp !== 'undefined';

  // ------------------------------------------------------------------ skin colours
  var VARS = {
    bg: '--c-chrome-bg', text: '--c-chrome-text', accent: '--c-chrome-accent', dim: '--c-chrome-dim',
    border: '--c-chrome-border', fg: '--t-foreground', termBg: '--t-background', red: '--t-red',
    green: '--t-green', yellow: '--t-yellow', blue: '--t-blue', cyan: '--t-cyan', magenta: '--t-magenta'
  };
  // A colour missing from the skin borrows another skin colour, never a hardcoded value.
  var BORROW = {
    text: ['fg', 'accent'], fg: ['text', 'accent'], accent: ['text', 'fg'], dim: ['text', 'fg'], border: ['dim', 'text'],
    bg: ['termBg'], termBg: ['bg'], red: ['magenta', 'accent'], green: ['cyan', 'accent'], yellow: ['accent', 'red'],
    blue: ['cyan', 'accent'], cyan: ['blue', 'accent'], magenta: ['red', 'accent']
  };
  var probeEl = document.createElement('span');
  probeEl.style.display = 'none';
  (document.body || document.documentElement).appendChild(probeEl);
  var pc = document.createElement('canvas');
  pc.width = pc.height = 1;
  var pctx = pc.getContext('2d', { willReadFrequently: true });
  var rgb = {};
  var c = {};

  // Resolves any CSS colour the skin may use (hex, rgb, var(), color-mix()) to RGB bytes.
  function readVar(name) {
    var raw = getComputedStyle(document.documentElement).getPropertyValue(VARS[name]).trim();
    if (!raw) return null;
    probeEl.style.color = '';
    probeEl.style.color = raw;
    var computed = getComputedStyle(probeEl).color;
    pctx.fillStyle = '#010203';
    pctx.fillStyle = computed;
    if (pctx.fillStyle === '#010203' && computed !== 'rgb(1, 2, 3)') return null;
    pctx.clearRect(0, 0, 1, 1);
    pctx.fillRect(0, 0, 1, 1);
    var d = pctx.getImageData(0, 0, 1, 1).data;
    return [d[0], d[1], d[2]];
  }

  function refreshColors() {
    var name, raw = {};
    for (name in VARS) raw[name] = readVar(name);
    for (name in VARS) {
      var v = raw[name], chain = BORROW[name] || [];
      for (var i = 0; !v && i < chain.length; i++) v = raw[chain[i]];
      if (!v) {
        // Last resort: the host's own text colour, still a skin value.
        probeEl.style.color = '';
        var m = /(\d+)\D+(\d+)\D+(\d+)/.exec(getComputedStyle(document.body || document.documentElement).color) || [0, 128, 128, 128];
        v = [+m[1], +m[2], +m[3]];
      }
      rgb[name] = v;
      c[name] = 'rgb(' + v[0] + ',' + v[1] + ',' + v[2] + ')';
    }
  }
  refreshColors();

  function rgba(name, a) {
    var v = rgb[name] || rgb.text;
    return 'rgba(' + v[0] + ',' + v[1] + ',' + v[2] + ',' + a + ')';
  }

  function mix(a, b, t, alpha) {
    var x = rgb[a] || rgb.text, y = rgb[b] || rgb.text;
    var r = Math.round(x[0] + (y[0] - x[0]) * t), g = Math.round(x[1] + (y[1] - x[1]) * t), bl = Math.round(x[2] + (y[2] - x[2]) * t);
    return alpha === undefined ? 'rgb(' + r + ',' + g + ',' + bl + ')' : 'rgba(' + r + ',' + g + ',' + bl + ',' + alpha + ')';
  }

  function lum(name) {
    var v = rgb[name] || rgb.text;
    return (0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2]) / 255;
  }

  // ------------------------------------------------------------------ sdk wrappers
  // moltamp.poll only: it cleans itself up when the widget unloads (store rule: no raw setInterval).
  function poll(ms, fn) {
    if (hasSdk && moltamp.poll) return moltamp.poll(ms, fn);
    return function () {};
  }

  function subscribe(store, selector, cb) {
    if (!hasSdk || !moltamp.subscribe) return function () {};
    try { return moltamp.subscribe(store, selector, cb) || function () {}; } catch (e) { return function () {}; }
  }

  function call(channel) {
    if (!hasSdk || !moltamp.call) return Promise.reject(new Error('no sdk'));
    try { return Promise.resolve(moltamp.call.apply(moltamp, arguments)); } catch (e) { return Promise.reject(e); }
  }

  // ------------------------------------------------------------------ text scale (Settings > Display)
  var textScale = 1;
  if (hasSdk && moltamp.settings) {
    moltamp.settings.read().then(function (cfg) {
      cfg = cfg || {};
      if (typeof cfg.widgetTextScale === 'number') textScale = cfg.widgetTextScale;
      document.documentElement.style.setProperty('--user-text-scale', String(textScale));
    }).catch(function () { /* first run: no settings */ });
  }

  function font(size, weight) {
    return (weight || 'normal') + ' ' + Math.max(7, size * textScale).toFixed(1) +
      'px "SF Mono", Menlo, "Hiragino Sans", "Hiragino Kaku Gothic ProN", monospace';
  }

  // ------------------------------------------------------------------ Claude shell state
  var STATES = ['idle', 'thinking', 'streaming', 'tool-use', 'permission', 'error', 'complete'];
  var state = { name: 'idle', since: performance.now(), seen: false };
  var stateListeners = [];
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.type !== 'moltamp:push' || d.subscriptionId !== 'shell-state' || STATES.indexOf(d.data) < 0) return;
    var prev = state.name;
    state.name = d.data;
    state.since = performance.now();
    state.seen = true;
    for (var i = 0; i < stateListeners.length; i++) {
      try { stateListeners[i](state.name, prev); } catch (err) { /* keep other listeners alive */ }
    }
  });

  function currentState() {
    // "complete" is a moment, not a mode: fall back to idle after a few seconds.
    if (state.name === 'complete' && performance.now() - state.since > 4000) return 'idle';
    return state.name;
  }

  // ------------------------------------------------------------------ terminal telemetry
  var tel = { bytes: 0, activity: 'idle', level: 0, started: false };
  function telemetry() {
    if (!tel.started) {
      tel.started = true;
      subscribe('telemetry', 'bytesPerSec', function (v) { tel.bytes = Number(v) || 0; });
      subscribe('telemetry', 'activity', function (v) { tel.activity = v || 'idle'; });
    }
    return tel;
  }

  // 0..1 terminal energy, log-scaled bytes plus the activity level, smoothed by the caller's dt.
  function telemetryLevel(dt) {
    var target = Math.min(1, Math.log(1 + tel.bytes) / Math.log(1 + 200000)) * 0.75 +
      (tel.activity === 'high' ? 0.35 : tel.activity === 'low' ? 0.15 : 0);
    tel.level += (Math.min(1, target) - tel.level) * (1 - Math.exp(-(dt || 0.016) / 0.5));
    return tel.level;
  }

  // ------------------------------------------------------------------ Claude Code hook events
  // event.events is a ring buffer of the last ~200 hook payloads from every session; callers only
  // want what is new, so entries are de-duplicated by timestamp, hook, tool and session.
  var evSeen = {}, evQueue = [], evListeners = [], evStarted = false;
  function eventKey(e) { return [e._ts, e._hook || e.hook_event_name, e.tool_name, e._session || e.session_id].join('|'); }
  function onEvents(cb) {
    evListeners.push(cb);
    if (evStarted) return;
    evStarted = true;
    var first = true;
    subscribe('event', 'events', function (v) {
      var list = Array.isArray(v) ? v : v && typeof v === 'object' ? Object.keys(v).map(function (k) { return v[k]; }) : [];
      var fresh = [];
      for (var i = 0; i < list.length; i++) {
        var e = list[i];
        if (!e || typeof e !== 'object') continue;
        var k = eventKey(e);
        if (evSeen[k]) continue;
        evSeen[k] = true;
        evQueue.push(k);
        fresh.push(e);
      }
      while (evQueue.length > 800) delete evSeen[evQueue.shift()];
      var history = first;
      first = false;
      if (fresh.length) for (var j = 0; j < evListeners.length; j++) {
        try { evListeners[j](fresh, history); } catch (err) { /* keep other listeners alive */ }
      }
    });
  }

  // A failure is read from the tool's response or the hook name, never from its input
  // (a command that merely contains the word "error" is not a failure).
  function isFailure(e) {
    var hook = String(e.hook_event_name || e._hook || '');
    if (/fail|error/i.test(hook)) return true;
    var r = e.tool_response;
    if (!r || typeof r !== 'object') return false;
    if (r.is_error === true || r.isError === true || r.success === false || r.interrupted === true) return true;
    var code = r.exitCode !== undefined ? r.exitCode : r.exit_code !== undefined ? r.exit_code : r.code;
    if (typeof code === 'number' && code !== 0) return true;
    return typeof r.error === 'string' && r.error.length > 0;
  }

  function toolLabel(name) {
    name = String(name || '?');
    if (name.indexOf('mcp__') !== 0) return name;
    // mcp__plugin_chrome-devtools-mcp_chrome-devtools__take_screenshot -> chrome-devtools
    var server = name.split('__')[1] || 'mcp';
    server = server.replace(/^plugin_/, '').replace(/^claude_ai_/, '').split('_').pop();
    return 'mcp:' + server;
  }

  // ------------------------------------------------------------------ canvas + loop
  // Paused while off screen (hidden tab) or while the whole page is hidden; both must clear to resume.
  var onScreen = true, pageVisible = !document.hidden, watching = false;
  function visibleNow() { return onScreen && pageVisible; }
  function watch(el) {
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (entries) { onScreen = entries[entries.length - 1].isIntersecting; }).observe(el);
    }
    if (!watching) {
      watching = true;
      document.addEventListener('visibilitychange', function () { pageVisible = !document.hidden; });
    }
  }

  function surface(el) {
    var s = { el: el, ctx: el.getContext('2d'), w: 0, h: 0, dpr: 1, resized: true };
    s.fit = function () {
      var dpr = Math.min(2, window.devicePixelRatio || 1);
      var w = Math.max(1, el.clientWidth), h = Math.max(1, el.clientHeight);
      if (w !== s.w || h !== s.h || dpr !== s.dpr) {
        s.w = w; s.h = h; s.dpr = dpr;
        el.width = Math.round(w * dpr);
        el.height = Math.round(h * dpr);
        s.resized = true;
      }
      s.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return s;
    };
    watch(el);
    return s;
  }

  function loop(fn, fpsCap) {
    var last = 0, lastDraw = 0, logged = false, cap = fpsCap || 60;
    function frame(now) {
      requestAnimationFrame(frame);
      if (!visibleNow()) { last = 0; return; }
      if (now - lastDraw < 1000 / cap - 2) return;
      var dt = last ? Math.min((now - last) / 1000, 0.1) : 1 / 60;
      last = lastDraw = now;
      try { fn(dt, now / 1000); } catch (e) {
        if (!logged) { logged = true; console.error('[cyber-kit]', e); }
      }
    }
    requestAnimationFrame(frame);
  }

  function resetCtx(ctx) {
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.shadowBlur = 0;
    ctx.lineWidth = 1;
    ctx.setLineDash([]);
  }

  // ------------------------------------------------------------------ small utils
  function hash(str) {
    var h = 2166136261;
    str = String(str);
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return ((h >>> 0) % 100000) / 100000;
  }

  function prng(seed) {
    var a = (seed * 4294967296) >>> 0 || 1;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = Math.imul(a ^ (a >>> 15), a | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function fmtBytes(b) {
    if (hasSdk && moltamp.fmt && moltamp.fmt.bytes) return moltamp.fmt.bytes(b);
    var u = ['B', 'KB', 'MB', 'GB'], i = 0;
    while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
    return b.toFixed(i ? 1 : 0) + ' ' + u[i];
  }

  // Skin switches update CSS variables live; re-resolve once a second.
  poll(1000, refreshColors);

  return {
    c: c, rgb: rgb, rgba: rgba, mix: mix, lum: lum, refreshColors: refreshColors,
    poll: poll, subscribe: subscribe, call: call, font: font,
    state: currentState, stateInfo: state, onState: function (cb) { stateListeners.push(cb); },
    telemetry: telemetry, telemetryLevel: telemetryLevel,
    onEvents: onEvents, isFailure: isFailure, toolLabel: toolLabel,
    surface: surface, loop: loop, resetCtx: resetCtx, isVisible: visibleNow,
    hash: hash, prng: prng, fmtBytes: fmtBytes,
    meta: (hasSdk && moltamp.meta) || { context: 'panel' }
  };
})();

// Planet Log: each finished task (Stop hook or shell "complete") jumps to a new procedural planet, kept in a catalogue.
(function () {
  'use strict';
  var S = CK.surface(document.getElementById('cy-canvas'));
  var label = document.getElementById('cy-label');
  var MAX_PLANETS = 200, TITLE_MAX = 80, BROWSE_MS = 30000, TW = 256, TH = 128;
  var CHARGE_S = 0.5, JUMP_S = 1.6, ARRIVE_S = 1.2;
  var TYPES = ['rocky', 'ocean', 'gas', 'ice', 'lava', 'ring'];
  var TYPE_NAMES = { rocky: 'rocky world', ocean: 'ocean world', gas: 'gas giant', ice: 'ice world', lava: 'lava world', ring: 'ringed giant' };
  var catalogue = [], discovered = 0, loaded = false, pending = [], view = null, browseUntil = 0;
  var phase = 'idle', phaseT = 0, streaks = [], lastTrigger = 0, busy = 0, t = 0, lastText = '';
  var prompts = {}, lastPrompt = '', commitMsg = '', commitSeen = null, commitUsed = '';
  var hasSettings = typeof window.moltamp !== 'undefined' && moltamp.settings;

  // ---- persistence (read-merge-write, debounced)
  function sanitize(list) {
    return (Array.isArray(list) ? list : []).filter(function (p) { return p && typeof p.name === 'string' && isFinite(p.s); }).slice(-MAX_PLANETS).map(function (p) {
      return { n: Number(p.n) || 0, name: String(p.name).slice(0, 40), s: Number(p.s), t: Number(p.t) || Date.now(), k: Math.max(0, Math.min(TYPES.length - 1, Number(p.k) || 0)), x: String(p.x || '').slice(0, TITLE_MAX) };
    });
  }
  if (hasSettings) {
    moltamp.settings.read().then(function (cfg) {
      cfg = cfg || {};
      catalogue = sanitize(cfg.planets).concat(pending);
      discovered = Math.max(Number(cfg.discovered) || 0, catalogue.length ? catalogue[catalogue.length - 1].n : 0);
      pending.forEach(function (p, i) { p.n = discovered - pending.length + i + 1; });
      loaded = true;
      if (pending.length) save();
      pending = [];
    }).catch(function () { loaded = true; });
  } else loaded = true;

  var saveTimer = null;
  function save() {
    if (!hasSettings) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      moltamp.settings.read().then(function (cur) {
        cur = cur && typeof cur === 'object' ? cur : {};
        cur.planets = catalogue.slice(-MAX_PLANETS);
        cur.discovered = discovered;
        return moltamp.settings.write(cur);
      }).catch(function () { /* keep the in-memory log */ });
    }, 1500);
  }

  // ---- what the task was about: the last prompt of that session, or a commit that just landed
  function clean(s) { return String(s || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, TITLE_MAX); }
  CK.onEvents(function (events, history) {
    for (var i = 0; i < events.length; i++) {
      var e = events[i], hook = String(e.hook_event_name || e._hook || ''), sess = String(e._session || e.session_id || '');
      if (/^UserPromptSubmit$/i.test(hook) && e.prompt) { prompts[sess] = clean(e.prompt); lastPrompt = prompts[sess]; }
      else if (/^Stop$/i.test(hook) && !history) trigger(sess);
    }
  });
  CK.onState(function (st) { if (st === 'complete') trigger(''); });
  CK.subscribe('git', 'status', function (s) {
    var c = s && Array.isArray(s.recentCommits) && s.recentCommits[0];
    if (!c) return;
    var h = String(c.hash || '');
    if (commitSeen === null) { commitSeen = h; commitUsed = h; return; }
    if (h !== commitSeen) { commitSeen = h; commitMsg = clean(c.message); }
  });

  function trigger(sess) {
    var now = Date.now();
    // The Stop hook and the shell's "complete" describe the same finished task.
    if (now - lastTrigger < 6000) return;
    lastTrigger = now;
    var fresh = commitSeen && commitSeen !== commitUsed && commitMsg;
    var title = fresh ? commitMsg : (sess && prompts[sess]) || lastPrompt || 'an untitled task';
    if (fresh) commitUsed = commitSeen;
    discovered++;
    var seed = CK.hash(title + '#' + discovered + '#' + now);
    var p = { n: discovered, name: genName(seed), s: seed, t: now, k: Math.floor(CK.hash(seed + '#k') * TYPES.length), x: title };
    if (loaded) { catalogue.push(p); if (catalogue.length > MAX_PLANETS) catalogue.shift(); save(); } else pending.push(p);
    view = null;
    phase = 'charge';
    phaseT = 0;
    busy = 0;
  }

  // ---- names
  var SYL = ['va', 'shti', 'kor', 'ra', 'ne', 'lu', 'mi', 'os', 'ta', 'ri', 'zen', 'ka', 'lo', 'dre', 'quo', 'ix', 'or', 'an', 'bel', 'cy', 'do', 'fen',
    'gal', 'hel', 'io', 'jor', 'kep', 'lyr', 'mon', 'nyx', 'pra', 'rho', 'sel', 'tor', 'umb', 'vex', 'wyn', 'xa', 'yor', 'zan', 'the', 'mar'];
  var SUFFIX = ['', '', ' Prime', ' Minor', ' Major', ' II', ' III', ' IV', ' V', ' VII', '-b', '-c'];
  function genName(seed) {
    var r = CK.prng(seed), n = 2 + (r() < 0.3 ? 1 : 0), s = '';
    for (var i = 0; i < n; i++) s += SYL[Math.floor(r() * SYL.length)];
    s = s.charAt(0).toUpperCase() + s.slice(1);
    var suf = SUFFIX[Math.floor(r() * SUFFIX.length)];
    if (r() < 0.12) suf = ' ' + (100 + Math.floor(r() * 900)) + 'b';
    return s + suf;
  }

  // ---- procedural texture (value noise that wraps around the longitude)
  function makeNoise(seed) {
    var r = CK.prng(seed), perm = new Uint8Array(512), val = new Float32Array(256), i;
    for (i = 0; i < 256; i++) { perm[i] = i; val[i] = r(); }
    for (i = 255; i > 0; i--) { var j = Math.floor(r() * (i + 1)), tmp = perm[i]; perm[i] = perm[j]; perm[j] = tmp; }
    for (i = 0; i < 256; i++) perm[256 + i] = perm[i];
    function lat(ix, iy) { return val[perm[(perm[ix & 255] + iy) & 255]]; }
    return function (x, y, period) {
      var x0 = Math.floor(x), y0 = Math.floor(y), fx = x - x0, fy = y - y0, sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
      var xa = ((x0 % period) + period) % period, xb = (xa + 1) % period;
      var a = lat(xa, y0), b = lat(xb, y0), c = lat(xa, y0 + 1), d = lat(xb, y0 + 1);
      return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
    };
  }
  function fbm(noise, u, v, oct) {
    var sum = 0, amp = 0.5, norm = 0, P = 6;
    for (var o = 0; o < oct; o++) { var f = P << o; sum += noise(u * f, v * f / 2, f) * amp; norm += amp; amp *= 0.5; }
    return sum / norm;
  }
  function lerp3(a, b, k) { return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k]; }
  function col(name) { return CK.rgb[name] || CK.rgb.text; }
  function ramp(stops, x) {
    x = Math.max(0, Math.min(0.9999, x));
    var f = x * (stops.length - 1), i = Math.floor(f);
    return lerp3(stops[i], stops[i + 1], f - i);
  }

  var planet = null;
  function genPlanet(entry) {
    var seed = entry.s, type = TYPES[entry.k], r = CK.prng(seed), noise = makeNoise(seed), cloudNoise = makeNoise(seed * 0.7 + 0.13);
    var bg = col('bg'), dark = lerp3(col('bg'), [0, 0, 0], 0.3), pick = function (list) { return list[Math.floor(r() * list.length)]; };
    var stops, atmos = 'cyan', clouds = 0, emissive = false, bands = false;
    if (type === 'ocean') { stops = [lerp3(col('blue'), dark, 0.55), col('blue'), col('cyan'), lerp3(col('green'), dark, 0.2), col('green'), lerp3(col('fg'), [255, 255, 255], 0.3)]; atmos = 'cyan'; clouds = 0.55; }
    else if (type === 'rocky') { stops = [lerp3(col('dim'), dark, 0.5), lerp3(col('yellow'), dark, 0.45), lerp3(col('red'), dark, 0.35), col('yellow'), lerp3(col('dim'), col('fg'), 0.4)]; atmos = pick(['yellow', 'dim']); clouds = r() < 0.4 ? 0.25 : 0; }
    else if (type === 'ice') { stops = [lerp3(col('blue'), dark, 0.3), col('cyan'), lerp3(col('fg'), col('cyan'), 0.3), lerp3(col('fg'), [255, 255, 255], 0.5)]; atmos = 'cyan'; clouds = 0.3; }
    else if (type === 'lava') { stops = [dark, lerp3(col('dim'), dark, 0.6), lerp3(col('red'), dark, 0.3), col('red'), col('yellow')]; atmos = 'red'; emissive = true; }
    else {
      var a = pick(['magenta', 'yellow', 'accent', 'cyan', 'red']), b = pick(['yellow', 'fg', 'accent', 'blue', 'magenta']);
      stops = [lerp3(col(a), dark, 0.4), col(a), lerp3(col(a), col(b), 0.5), col(b), lerp3(col(b), [255, 255, 255], 0.35)];
      atmos = a;
      bands = true;
    }
    var tex = new Uint8ClampedArray(TW * TH * 4), cl = clouds ? new Float32Array(TW * TH) : null, freq = 6 + r() * 10, warp = 2 + r() * 3;
    for (var y = 0; y < TH; y++) {
      var v = y / TH, latv = (v - 0.5) * Math.PI;
      for (var x = 0; x < TW; x++) {
        var u = x / TW, h = fbm(noise, u, v, 5), c;
        if (bands) c = ramp(stops, 0.5 + 0.5 * Math.sin(latv * freq + (h - 0.5) * warp * 3));
        else {
          var polar = Math.abs(latv) / (Math.PI / 2);
          c = ramp(stops, h * 1.15 - 0.08 + (type === 'ocean' || type === 'ice' ? Math.pow(polar, 6) * 0.6 : 0));
        }
        var o = (y * TW + x) * 4;
        tex[o] = c[0]; tex[o + 1] = c[1]; tex[o + 2] = c[2];
        tex[o + 3] = emissive ? Math.max(0, h - 0.62) * 255 * 2.4 : 0;
        if (cl) { var cv = fbm(cloudNoise, u, v, 4); cl[y * TW + x] = Math.max(0, Math.min(1, (cv - (1 - clouds)) * 3.2)); }
      }
    }
    var ringed = type === 'ring' || (type === 'rocky' && r() < 0.25) || (type === 'gas' && r() < 0.35);
    var moons = [], nm = Math.floor(r() * 3.2);
    for (var m = 0; m < nm; m++) moons.push({ dist: 1.6 + m * 0.55 + r() * 0.3, size: 0.08 + r() * 0.1, speed: (0.25 + r() * 0.4) * (r() < 0.5 ? -1 : 1), phase: r() * 6.283 });
    return { entry: entry, type: type, tex: tex, clouds: cl, atmos: atmos, emissive: emissive, tilt: (r() - 0.5) * 0.7, spin: 4 + r() * 6,
      ring: ringed ? { inner: 1.35 + r() * 0.2, outer: 1.9 + r() * 0.5, tilt: 0.28 + r() * 0.12, col: pick(['fg', 'yellow', 'accent', 'cyan']), bands: 3 + Math.floor(r() * 4), seed: r() } : null,
      moons: moons, palette: JSON.stringify(CK.rgb) };
  }

  // ---- sphere: per-pixel texture coordinates and light, baked once per size and planet
  var sph = { R: 0, key: '', cv: document.createElement('canvas'), ctx: null, img: null, n: 0 };
  function bakeSphere(R) {
    var key = R + ':' + planet.entry.s;
    if (sph.key === key) return;
    sph.key = key;
    sph.R = R;
    var D = R * 2;
    sph.cv.width = sph.cv.height = D;
    sph.ctx = sph.cv.getContext('2d');
    sph.img = sph.ctx.createImageData(D, D);
    var max = D * D, idx = new Uint32Array(max), us = new Float32Array(max), vs = new Uint16Array(max), sh = new Float32Array(max), aa = new Float32Array(max), n = 0;
    var L = [-0.55, -0.4, 0.73], ll = Math.hypot(L[0], L[1], L[2]), ct = Math.cos(planet.tilt), st = Math.sin(planet.tilt);
    for (var py = 0; py < D; py++) {
      for (var px = 0; px < D; px++) {
        var nx = (px + 0.5 - R) / R, ny = (py + 0.5 - R) / R, d2 = nx * nx + ny * ny;
        if (d2 > 1) continue;
        var nz = Math.sqrt(1 - d2), tx = nx * ct - ny * st, ty = nx * st + ny * ct;
        var lat = Math.asin(Math.max(-1, Math.min(1, -ty))), lon = Math.atan2(tx, nz);
        idx[n] = (py * D + px) * 4;
        us[n] = (lon / 6.283 + 0.5) * TW;
        vs[n] = Math.min(TH - 1, Math.max(0, Math.floor((0.5 - lat / Math.PI) * TH)));
        sh[n] = Math.max(0, (nx * L[0] + ny * L[1] + nz * L[2]) / ll);
        aa[n] = Math.min(1, (1 - Math.sqrt(d2)) * R);
        n++;
      }
    }
    sph.idx = idx; sph.us = us; sph.vs = vs; sph.sh = sh; sph.aa = aa; sph.n = n;
  }
  function paintSphere(rot, cloudRot) {
    var data = sph.img.data, tex = planet.tex, cl = planet.clouds, light = CK.lum('bg') > 0.5, cr = light ? 250 : 240;
    for (var k = 0; k < sph.n; k++) {
      var tx = ((sph.us[k] + rot) % TW + TW) % TW | 0, ti = sph.vs[k] * TW + tx, o = ti * 4, s = 0.06 + 0.94 * sph.sh[k];
      var r = tex[o] * s, g = tex[o + 1] * s, b = tex[o + 2] * s;
      if (planet.emissive) { var e = tex[o + 3] / 255 * (1 - sph.sh[k] * 0.5); r += 255 * e; g += 120 * e; b += 40 * e; }
      if (cl) {
        var cx = ((sph.us[k] + cloudRot) % TW + TW) % TW | 0, ca = cl[sph.vs[k] * TW + cx] * 0.85;
        r = r * (1 - ca) + cr * s * ca; g = g * (1 - ca) + cr * s * ca; b = b * (1 - ca) + cr * s * ca;
      }
      var i = sph.idx[k];
      data[i] = r; data[i + 1] = g; data[i + 2] = b; data[i + 3] = 255 * sph.aa[k];
    }
    sph.ctx.putImageData(sph.img, 0, 0);
  }

  function drawRing(ctx, x, y, R, front) {
    var rg = planet.ring;
    ctx.save();
    ctx.beginPath();
    // Back half sits behind the planet, front half over it.
    if (front) ctx.rect(x - R * 3, y, R * 6, R * 3); else ctx.rect(x - R * 3, y - R * 3, R * 6, R * 3);
    ctx.clip();
    for (var b = 0; b < rg.bands; b++) {
      var k = b / rg.bands, rr = R * (rg.inner + (rg.outer - rg.inner) * k);
      ctx.strokeStyle = CK.rgba(rg.col, 0.18 + 0.32 * Math.abs(Math.sin((k + rg.seed) * 9)));
      ctx.lineWidth = Math.max(1, R * (rg.outer - rg.inner) / rg.bands * 0.8);
      ctx.beginPath(); ctx.ellipse(x, y, rr, rr * rg.tilt, planet.tilt, 0, 6.283); ctx.stroke();
    }
    ctx.restore();
  }

  // baseR sets the baked resolution, so the arrival zoom only rescales the image.
  function drawPlanet(ctx, x, y, R, alpha, dt, baseR) {
    var dpr = S.dpr, Ri = Math.max(8, Math.min(150, Math.round(baseR * dpr)));
    bakeSphere(Ri);
    planet.rot = (planet.rot || 0) + dt * planet.spin;
    planet.cloudRot = (planet.cloudRot || 0) + dt * planet.spin * 1.35;
    paintSphere(planet.rot, planet.cloudRot);
    ctx.globalAlpha = alpha;
    // Moons behind
    planet.moons.forEach(function (m) { m.a = (m.phase += dt * m.speed); if (Math.sin(m.a) < 0) drawMoon(ctx, x, y, R, m); });
    if (planet.ring) drawRing(ctx, x, y, R, false);
    var glow = ctx.createRadialGradient(x, y, R * 0.92, x, y, R * 1.28);
    glow.addColorStop(0, CK.rgba(planet.atmos, 0.45));
    glow.addColorStop(1, CK.rgba(planet.atmos, 0));
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(x, y, R * 1.28, 0, 6.283); ctx.fill();
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(sph.cv, x - R, y - R, R * 2, R * 2);
    // Rim light on the lit side
    var rim = ctx.createRadialGradient(x - R * 0.35, y - R * 0.3, R * 0.7, x, y, R * 1.02);
    rim.addColorStop(0, CK.rgba(planet.atmos, 0));
    rim.addColorStop(1, CK.rgba(planet.atmos, 0.28));
    ctx.fillStyle = rim;
    ctx.beginPath(); ctx.arc(x, y, R, 0, 6.283); ctx.fill();
    if (planet.ring) drawRing(ctx, x, y, R, true);
    planet.moons.forEach(function (m) { if (Math.sin(m.a) >= 0) drawMoon(ctx, x, y, R, m); });
    ctx.globalAlpha = 1;
  }
  function drawMoon(ctx, x, y, R, m) {
    var mx = x + Math.cos(m.a) * R * m.dist, my = y + Math.sin(m.a) * R * m.dist * 0.32, mr = Math.max(1.5, R * m.size);
    var g = ctx.createRadialGradient(mx - mr * 0.4, my - mr * 0.4, mr * 0.1, mx, my, mr);
    g.addColorStop(0, CK.mix('fg', 'dim', 0.2));
    g.addColorStop(1, CK.mix('dim', 'bg', 0.6));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(mx, my, mr, 0, 6.283); ctx.fill();
  }

  function startStreaks() {
    streaks = [];
    for (var i = 0; i < 140; i++) streaks.push({ a: Math.random() * 6.283, r: Math.random() * 0.15, v: 0.4 + Math.random() * 1.2, c: ['accent', 'cyan', 'fg', 'magenta'][i % 4] });
  }

  document.getElementById('cy-canvas').addEventListener('click', function (ev) {
    if (ev.button !== 0 || ev.ctrlKey || !catalogue.length || phase !== 'idle') return;
    var r = ev.currentTarget.getBoundingClientRect(), last = catalogue.length - 1, cur = view === null ? last : view;
    cur += ev.clientX - r.left < r.width / 2 ? -1 : 1;
    view = cur >= last ? null : Math.max(0, cur);
    browseUntil = Date.now() + BROWSE_MS;
  });

  var stars = (function () { var r = CK.prng(0.2718), l = []; for (var i = 0; i < 110; i++) l.push({ x: r(), y: r(), s: 0.4 + r() * 1.1, p: r() * 6.283 }); return l; })();
  var HOME = { n: 0, name: 'Homeworld', s: 0.4242, t: Date.now(), k: 1, x: '' };

  function fit(ctx, text, maxW) {
    if (ctx.measureText(text).width <= maxW) return text;
    while (text.length > 1 && ctx.measureText(text + '…').width > maxW) text = text.slice(0, -1);
    return text + '…';
  }
  function ago(ms) { var s = Math.round(ms / 1000); return s < 60 ? 'just now' : s < 3600 ? Math.round(s / 60) + 'm ago' : s < 86400 ? Math.round(s / 3600) + 'h ago' : Math.round(s / 86400) + 'd ago'; }

  CK.loop(function (dt) {
    S.fit();
    S.resized = false;
    var ctx = S.ctx, w = S.w, h = S.h, now = Date.now(), light = CK.lum('bg') > 0.5, st = CK.state();
    t += dt;
    if (view !== null && now > browseUntil) view = null;
    if (st === 'thinking' || st === 'streaming' || st === 'tool-use') busy += dt;
    var entry = view !== null ? catalogue[view] : catalogue.length ? catalogue[catalogue.length - 1] : HOME;
    // While the drive charges, the planet we are leaving fades out.
    if (phase === 'charge' && planet) entry = planet.entry;
    if (!planet || planet.entry !== entry || planet.palette !== JSON.stringify(CK.rgb)) {
      var keep = planet && planet.entry === entry ? { rot: planet.rot, cloudRot: planet.cloudRot } : {};
      planet = genPlanet(entry);
      planet.rot = keep.rot || 0;
      planet.cloudRot = keep.cloudRot || 0;
      sph.key = '';
    }

    ctx.fillStyle = CK.c.bg;
    ctx.fillRect(0, 0, w, h);
    var wide = w > h * 1.6, R = wide ? Math.min(h * 0.34, w * 0.16) : Math.min(w * 0.28, h * 0.25);
    // Rings stay inside the slot: smaller planet in a panel, more room on the left in the vibes bar.
    var reach = planet.ring ? Math.max(1.9, planet.ring.outer * 1.04) : 1.9;
    if (!wide && planet.ring) R = Math.min(R, w * 0.47 / planet.ring.outer);
    // Leave the log text enough room next to the planet in the vibes bar.
    if (wide) R = Math.min(R, (w - 18 - Math.min(260, w * 0.45)) / (2 * reach + 0.2));
    var px = wide ? R * reach + 8 : w / 2, py = wide ? h / 2 : h * 0.4;

    phaseT += dt;
    if (phase === 'charge' && phaseT > CHARGE_S) { phase = 'jump'; phaseT = 0; startStreaks(); }
    else if (phase === 'jump' && phaseT > JUMP_S) { phase = 'arrive'; phaseT = 0; }
    else if (phase === 'arrive' && phaseT > ARRIVE_S) { phase = 'idle'; phaseT = 0; }

    // Stars; they stretch into streaks during the jump
    var speed = phase === 'jump' ? 1 + phaseT * 6 : phase === 'charge' ? 1 + phaseT * 2 : 1;
    ctx.fillStyle = CK.rgba('fg', light ? 0.3 : 0.6);
    stars.forEach(function (s) {
      ctx.globalAlpha = (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * 1.2 + s.p))) * (phase === 'jump' ? 0.3 : 1);
      ctx.fillRect(s.x * w, s.y * h, s.s * speed, s.s);
    });
    ctx.globalAlpha = 1;

    if (phase === 'jump') {
      var k = phaseT / JUMP_S, maxR = Math.hypot(w, h) * 0.6;
      ctx.globalCompositeOperation = light ? 'source-over' : 'lighter';
      ctx.lineCap = 'round';
      streaks.forEach(function (s) {
        s.r += dt * s.v * (0.6 + k * 3);
        if (s.r > 1.1) s.r = Math.random() * 0.1;
        var r1 = s.r * maxR, r0 = Math.max(0, r1 - (20 + k * 120) * s.v);
        ctx.strokeStyle = CK.rgba(s.c, 0.35 + 0.5 * k);
        ctx.lineWidth = 1 + k * 1.5;
        ctx.beginPath();
        ctx.moveTo(w / 2 + Math.cos(s.a) * r0, h / 2 + Math.sin(s.a) * r0);
        ctx.lineTo(w / 2 + Math.cos(s.a) * r1, h / 2 + Math.sin(s.a) * r1);
        ctx.stroke();
      });
      ctx.globalCompositeOperation = 'source-over';
    } else {
      var a = phase === 'charge' ? Math.max(0, 1 - phaseT / CHARGE_S) : phase === 'arrive' ? Math.min(1, phaseT / ARRIVE_S) : 1;
      var grow = phase === 'arrive' ? 0.35 + 0.65 * (1 - Math.pow(1 - a, 3)) : 1;
      drawPlanet(ctx, px, py, R * grow, a, dt, R);
      if (phase === 'arrive' && phaseT < 0.5) {
        ctx.fillStyle = CK.rgba('fg', (1 - phaseT / 0.5) * (light ? 0.5 : 0.8));
        ctx.fillRect(0, 0, w, h);
      }
    }

    // Log entry
    if (phase === 'idle' || phase === 'arrive') {
      var title = entry === HOME ? 'finish a task to jump to your first planet' : 'after: ' + entry.x;
      var meta = entry === HOME ? 'home port' : TYPE_NAMES[TYPES[entry.k]] + ' · ' + ago(now - entry.t);
      ctx.textBaseline = 'top';
      if (wide) {
        var tx = px + R * (reach + 0.2), tw = w - tx - 10, ts = Math.max(11, Math.min(22, h * 0.15));
        if (tw > 60) {
          ctx.textAlign = 'left';
          ctx.font = CK.font(ts, 'bold');
          ctx.fillStyle = CK.c.fg;
          var y0 = h / 2 - ts * (h > 90 ? 1.3 : 0.8);
          ctx.fillText(fit(ctx, (entry.n ? '#' + entry.n + ' ' : '') + entry.name, tw), tx, y0);
          ctx.font = CK.font(Math.max(8, ts * 0.55));
          ctx.fillStyle = CK.c.dim;
          ctx.fillText(fit(ctx, meta, tw), tx, y0 + ts * 1.25);
          if (h > 90) { ctx.fillStyle = CK.c.text; ctx.fillText(fit(ctx, title.slice(0, 66), tw), tx, y0 + ts * 2.1); }
        }
      } else {
        var ts2 = Math.max(10, Math.min(18, w / 16)), ty = py + R * 1.45;
        ctx.textAlign = 'center';
        ctx.font = CK.font(ts2, 'bold');
        ctx.fillStyle = CK.c.fg;
        ctx.fillText(fit(ctx, (entry.n ? '#' + entry.n + ' ' : '') + entry.name, w - 16), w / 2, ty);
        ctx.font = CK.font(Math.max(8, ts2 * 0.6));
        ctx.fillStyle = CK.c.dim;
        ctx.fillText(fit(ctx, meta, w - 16), w / 2, ty + ts2 * 1.3);
        if (ty + ts2 * 3.2 < h - 22) { ctx.fillStyle = CK.c.text; ctx.fillText(fit(ctx, title.slice(0, 66), w - 16), w / 2, ty + ts2 * 2.2); }
      }
      if (view !== null) {
        ctx.font = CK.font(9);
        ctx.fillStyle = CK.rgba('dim', 0.9);
        ctx.textAlign = 'left';
        ctx.fillText('◀', 6, h / 2 - 5);
        ctx.textAlign = 'right';
        ctx.fillText('▶  ' + (view + 1) + '/' + catalogue.length, w - 6, h / 2 - 5);
      }
    }

    // Drive charge while Claude works
    if (phase === 'idle' && busy > 0.5 && (st === 'thinking' || st === 'streaming' || st === 'tool-use')) {
      var bw = Math.min(90, w * 0.25), bx = w - bw - 8, by = 8, fill = Math.min(1, busy / 120);
      ctx.fillStyle = CK.rgba('dim', 0.25);
      ctx.fillRect(bx, by + 11, bw, 3);
      ctx.fillStyle = CK.rgba('cyan', 0.6 + 0.4 * Math.sin(t * 5));
      ctx.fillRect(bx, by + 11, bw * fill, 3);
      ctx.font = CK.font(8);
      ctx.textAlign = 'right';
      ctx.textBaseline = 'top';
      ctx.fillStyle = CK.rgba('cyan', 0.85);
      ctx.fillText('DRIVE CHARGING', bx + bw, by);
    }
    CK.resetCtx(ctx);

    var text = phase === 'jump' || phase === 'charge' ? '航海日誌 · jumping to hyperspace…'
      : entry === HOME ? '航海日誌 · no planet yet · finish a task to jump'
      : w < 380 ? '航海日誌 · #' + entry.n + ' · ' + ago(now - entry.t)
      : '航海日誌 · planet ' + entry.n + ' · ' + entry.name + ' · ' + ago(now - entry.t);
    if (text !== lastText) { lastText = text; label.textContent = text; }
  }, 30);
})();
</script>
