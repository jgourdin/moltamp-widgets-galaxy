  var SHADER = {"id": "st-mondrian-hexagon", "title": "Mondrian Hexagon Infinity", "author": "DavidBraun", "url": "https://www.shadertoy.com/view/sXGGzV", "license": "MIT (David Braun)", "common": "", "passes": [{"name": "Image", "output": "image", "code": "// Mondrian Hexagon Infinity\n//\n// by David Braun, 2026\n//\n// MIT License\n//\n// Mondrian-influenced hexagons subdivide and merge while also infinitely approaching the camera.\n\n#define DEPTH   5.0      // levels of subdivision below the screen (2..5)\n#define DETAIL  0.0      // -1..1: fewer / more splits\n#define FLOW    1.0      // playback speed\n#define STEP    0.5      // seconds per depth step\n#define HOLD    4.1      // seconds latched on a target\n#define GLIDE   3.4      // seconds gliding to the next target\n#define HS      1.3      // on-screen size of the top level\n#define M       2048.0   // cell ids are kept modulo M (a power of two, see anchorFor)\n\nconst vec2  S = vec2(1.0, 1.7320508);\nconst float W = 0.5;     // share of a depth step each cell spends moving; the rest is stagger\n\n// ---------------------------------------------------------------- hex grid\nfloat hexDist(vec2 p) { p = abs(p); return max(dot(p, S * 0.5), p.x); }\nvec4 hexCoords(vec2 p) {                     // xy = offset from centre, zw = cell id\n  vec4 hC = floor(vec4(p, p - vec2(0.5, 1.0)) / S.xyxy) + 0.5;\n  vec4 h  = vec4(p - hC.xy * S, p - (hC.zw + 0.5) * S);\n  return dot(h.xy, h.xy) < dot(h.zw, h.zw) ? vec4(h.xy, hC.xy) : vec4(h.zw, hC.zw + 0.5);\n}\n\n// ---------------------------------------------------------------- noise\nfloat hash2(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }\nfloat vnoise2(vec2 x) {\n  vec2 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);\n  return mix(mix(hash2(i), hash2(i + vec2(1, 0)), f.x), mix(hash2(i + vec2(0, 1)), hash2(i + vec2(1, 1)), f.x), f.y);\n}\nfloat pnoise(vec2 x, float P, vec2 sd) {     // t ) * 1.618 + 3.7, j * 0.731 + 9.1)) * 7.0);\n  if (n < 0.5) return vec2(0.0);\n  if (n < 1.5) return vec2( 2.0,  0.0);\n  if (n < 2.5) return vec2(-2.0,  0.0);\n  if (n < 3.5) return vec2( 1.0,  1.0);\n  if (n < 4.5) return vec2( 1.0, -1.0);\n  if (n < 5.5) return vec2(-1.0,  1.0);\n  return vec2(-1.0, -1.0);\n}\n// camera offset from the anchor cell, in lattice units one level above the screen\nvec2 camFor(float e, float i) {\n  vec2 c = vec2(0.0); float w = 0.5;\n  for (int n = 0; n < 22; n++) { vec2 J = digitJ(e + float(n), i); c += vec2(J.x * 0.5, J.y * 0.5 * S.y) * w; w *= 0.5; }\n  return c;\n}\n// the anchor cell's id modulo M: with M a power of two only the last 11 digits matter\nvec2 anchorFor(float e, float i) {\n  vec2 A = vec2(0.0); float w = 1.0;\n  for (int n = 1; n <= 11; n++) { float j = e - float(n); if (j < 0.0) break; A += digitJ(j, i) * w; w *= 2.0; }\n  return mod(A, M);\n}\n\n// ---------------------------------------------------------------- per-frame state\nfloat gEpoch, gU, gPhase, gF;\nvec2  gCam, gAnchor;\n\n// ---------------------------------------------------------------- drawing\nfloat lineW(float rd, float px) {            // weight by on-screen size, constant above one screen\n  float rc = mix(-1.0, rd, smoothstep(-1.0, 0.0, rd));\n  return max(0.0058 * pow(0.64, rc), 0.6 * px);\n}\nfloat wobAt(vec2 p1, float r) {              // hand-drawn wobble anchored to the world\n  vec2 pr = exp2(r + 1.0) * p1;\n  vec2 pos = mod(gAnchor * exp2(r + 1.0), M) * 0.5 + vec2(pr.x, pr.y / S.y);\n  return pnoise(mod(pos, 64.0) * 8.0, 512.0, vec2(3.1, 7.7)) - 0.5;\n}\nfloat paintTex(vec2 lr, float pxl, float periodPx, vec2 aniso, float key) {\n  float lf = log2(1.0 / (periodPx * pxl));   // grain stays a fixed size on screen\n  float fl = floor(lf), t = fract(lf), f0 = exp2(fl);\n  float a = vnoise2(lr * f0 * aniso + vec2(mod(fl, 32.0) * 7.1, key * 9.0));\n  float b = vnoise2(lr * f0 * 2.0 * aniso + vec2(mod(fl + 1.0, 32.0) * 7.1, key * 9.0));\n  return 0, px);\n      ink = max(ink, (1.0 - smoothstep(wc - aa, wc + aa, abs(dR0 + wob))) * fade);\n      if (dR0 < 0.0) break;\n    }\n    float k = 2.0 / s;\n    total *= k; p = 2.0 * c + l * k;\n    kAnc *= 2.0; kO *= 0.5; kN *= 0.5;\n  }\n\n  float kd = mod(gEpoch + Lr, 89.0);\n  float key = hash2(Laid * 0.0731 + vec2(kd * 3.17, 1.9));\n  float cls = mod(Lcls + floor(hash2(vec2(kd, 4.4)) * 3.0), 3.0);   // palette rotates with depth\n  vec3 col = mondrian(key, Ll, cls, Lpc, px * Ltotal);\n  return mix(col, vec3(0.078), ink);\n}\n\nvoid mainImage(out vec4 fragColor, in vec2 fragCoord) {\n  float T = iTime * FLOW;\n  float zl = T / epochLen();\n  gEpoch = floor(zl); gU = zl - gEpoch;\n  float steps = 2.0 * DEPTH + 2.0;\n  gPhase = min(floor(gU * steps), steps - 1.0);\n  gF = min((gU * steps - gPhase) / 0.92, 1.0);\n\n  // latched on target c, or gliding from c to c + 1 (smoothstep)\n  float cyc = HOLD + GLIDE, c = floor(T / cyc), tau = T - c * cyc;\n  if (tau < HOLD) { gCam = camFor(gEpoch, c); gAnchor = anchorFor(gEpoch, c); }\n  else {\n    float k = smoothstep(0.0, 1.0, (tau - HOLD) / GLIDE);\n    gCam = mix(camFor(gEpoch, c), camFor(gEpoch, c + 1.0), k);\n    gAnchor = anchorFor(gEpoch, c + 1.0);\n  }\n\n  vec2 uv = (fragCoord - 0.5 * iResolution.xy) / iResolution.y;\n  vec3 col = render(uv);\n  col *= 0.975 + 0.04 * vnoise2(uv * 600.0);                        // paper grain\n  vec2 suv = fragCoord / iResolution.xy - 0.5;\n  col *= 1.0 - 0.14 * dot(suv, suv);\n  col += (hash2(fragCoord) - 0.5) / 255.0;\n  fragColor = vec4(col, 1.0);\n}\n", "inputs": []}], "options": {"scale": 1, "maxPixels": 600000, "fpsCap": 60, "reactive": true}};

        applySampler(res.target, filter, isGL2 || res.target !== gl.TEXTURE_2D || inp.kind !== 'buffer' ? inp.wrap : 'clamp', hasMips);
      } else {
        gl.bindTexture(gl.TEXTURE_2D, null);
      }
      gl.uniform1i(pass.u.ch[c], c);
    }
  }

  function draw(now) {
    var dt = lastNow ? Math.min((now - lastNow) / 1000, 0.1) : 1 / 60;
    lastNow = now;
    fpsAcc += dt; fpsFrames++;
    if (fpsAcc > 0.5) { fps = fpsFrames / fpsAcc; fpsAcc = 0; fpsFrames = 0; debug.fps = Math.round(fps); }

    updateReactivity(now, dt);
    var simDt = dt * react.speed;
    simTime += simDt;
    if (audioTex) updateFakeAudio(simTime);

    var size = resize(), w = size[0], h = size[1];
    var date = new Date();
    var secs = date.getHours() * 3600 + date.getMinutes() * 60 + date.getSeconds() + date.getMilliseconds() / 1000;
    for (var c = 0; c < 4; c++) chanTime[c] = simTime;
    if (!clickFrame) mouse[3] = -Math.abs(mouse[3]);

    for (var i = 0; i < passes.length; i++) {
      var p = passes[i], target = null, b = null;
      if (p.output !== 'image') { b = buffers[p.output]; target = b.pair[1 - b.cur]; }
      gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fb : null);
      gl.viewport(0, 0, w, h);
      gl.useProgram(p.prog);
      bindInputs(p);
      gl.uniform3f(p.u.iResolution, w, h, 1);
      gl.uniform1f(p.u.iTime, simTime);
      gl.uniform1f(p.u.iTimeDelta, simDt);
      gl.uniform1f(p.u.iFrameRate, fps);
      gl.uniform1i(p.u.iFrame, frameNo);
      gl.uniform4f(p.u.iMouse, mouse[0], mouse[1], mouse[2], mouse[3]);
      gl.uniform4f(p.u.iDate, date.getFullYear(), date.getMonth(), date.getDate(), secs);
      gl.uniform1f(p.u.iSampleRate, 44100);
      gl.uniform4f(p.u.iMoltamp, react.energy, react.speed, (STATES[react.state] || STATES.unknown).code, react.pulse);
      if (p.u.iChannelTime) gl.uniform1fv(p.u.iChannelTime, chanTime);
      if (p.u.iChannelResolution) gl.uniform3fv(p.u.iChannelResolution, chanRes);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      if (b) {
        b.cur = 1 - b.cur;
        if (b.wantMips) { gl.bindTexture(gl.TEXTURE_2D, b.pair[b.cur].tex); gl.generateMipmap(gl.TEXTURE_2D); }
      }
    }
    clickFrame = false;
    frameNo++;
    debug.frame = frameNo;
  }

  var lastDraw = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    if (contextLost || gl.isContextLost()) { lastNow = 0; return; }
    if (!started) {
      if (ext.parallel && !passes.every(function (p) { return gl.getProgramParameter(p.prog, ext.parallel.COMPLETION_STATUS_KHR); })) return;
      started = true;
      if (!finishLink()) { started = 'failed'; return; }
      debug.ready = true;
    }
    if (started !== true || !isVisible()) { lastNow = 0; return; }
    var cap = opts.fpsCap || 60;
    if (now - lastDraw < 1000 / cap - 2) return;
    lastDraw = now;
    draw(now);
  }

  // Per-widget overrides persisted with moltamp.settings: { scale, maxPixels, fpsCap, speed, reactive }.
  (function () {
    if (!window.moltamp || !moltamp.settings) { requestAnimationFrame(loop); return; }
    moltamp.settings.read().then(function (saved) {
      saved = saved || {};
      ['scale', 'maxPixels', 'fpsCap', 'speed', 'reactive'].forEach(function (k) { if (saved[k] !== undefined) opts[k] = saved[k]; });
      reactive = opts.reactive !== false;
    }).catch(function () { /* first run: no settings yet */ }).then(function () { requestAnimationFrame(loop); });
  })();
})();

</script>
