<!--
  Agent Fleet — Starship pack for MOLTamp
  Claude's sub-agents as a fleet of starships around the mothership: each agent launches from the hangar, flies in formation while it works, docks when it reports back and explodes if it fails. Scouts, cruisers and frigates follow the agent type. Click a ship to see its mission.
  Author: j0j0 · License: MIT
-->
<div id="cy-root"><canvas id="cy-canvas"></canvas><div id="cy-label"></div></div>

<style>
  #cy-root { position: absolute; inset: 0; overflow: hidden; background: var(--c-chrome-bg); container-type: size; }
  #cy-canvas { display: block; width: 100%; height: 100%; }
  #cy-label {
    position: absolute; left: 8px; bottom: 6px; pointer-events: none; letter-spacing: 0.08em;
    color: var(--c-chrome-dim); text-shadow: 0 0 6px var(--c-chrome-bg);
    font: calc(clamp(8px, 3.4cqw, 12px) * var(--user-text-scale, 1)) 'SF Mono', Menlo, 'Hiragino Sans', monospace;
  }
</style>

<script>
// cyber-kit — shared runtime of the Cyberpunk widget pack (MIT, j0j0).
// Skin colours resolved for canvas use, DPR-aware canvas, pause when hidden, Claude state, telemetry.
var CK = (function () {
  'use strict';

  var hasSdk = typeof window.moltamp !== 'undefined';

  // ------------------------------------------------------------------ skin colours
  var VARS = {
    bg: '--c-chrome-bg', text: '--c-chrome-text', accent: '--c-chrome-accent', dim: '--c-chrome-dim',
    border: '--c-chrome-border', fg: '--t-foreground', termBg: '--t-background', red: '--t-red',
    green: '--t-green', yellow: '--t-yellow', blue: '--t-blue', cyan: '--t-cyan', magenta: '--t-magenta'
  };
  // A colour missing from the skin borrows another skin colour, never a hardcoded value.
  var BORROW = {
    text: ['fg', 'accent'], fg: ['text', 'accent'], accent: ['text', 'fg'], dim: ['text', 'fg'], border: ['dim', 'text'],
    bg: ['termBg'], termBg: ['bg'], red: ['magenta', 'accent'], green: ['cyan', 'accent'], yellow: ['accent', 'red'],
    blue: ['cyan', 'accent'], cyan: ['blue', 'accent'], magenta: ['red', 'accent']
  };
  var probeEl = document.createElement('span');
  probeEl.style.display = 'none';
  (document.body || document.documentElement).appendChild(probeEl);
  var pc = document.createElement('canvas');
  pc.width = pc.height = 1;
  var pctx = pc.getContext('2d', { willReadFrequently: true });
  var rgb = {};
  var c = {};

  // Resolves any CSS colour the skin may use (hex, rgb, var(), color-mix()) to RGB bytes.
  function readVar(name) {
    var raw = getComputedStyle(document.documentElement).getPropertyValue(VARS[name]).trim();
    if (!raw) return null;
    probeEl.style.color = '';
    probeEl.style.color = raw;
    var computed = getComputedStyle(probeEl).color;
    pctx.fillStyle = '#010203';
    pctx.fillStyle = computed;
    if (pctx.fillStyle === '#010203' && computed !== 'rgb(1, 2, 3)') return null;
    pctx.clearRect(0, 0, 1, 1);
    pctx.fillRect(0, 0, 1, 1);
    var d = pctx.getImageData(0, 0, 1, 1).data;
    return [d[0], d[1], d[2]];
  }

  function refreshColors() {
    var name, raw = {};
    for (name in VARS) raw[name] = readVar(name);
    for (name in VARS) {
      var v = raw[name], chain = BORROW[name] || [];
      for (var i = 0; !v && i < chain.length; i++) v = raw[chain[i]];
      if (!v) {
        // Last resort: the host's own text colour, still a skin value.
        probeEl.style.color = '';
        var m = /(\d+)\D+(\d+)\D+(\d+)/.exec(getComputedStyle(document.body || document.documentElement).color) || [0, 128, 128, 128];
        v = [+m[1], +m[2], +m[3]];
      }
      rgb[name] = v;
      c[name] = 'rgb(' + v[0] + ',' + v[1] + ',' + v[2] + ')';
    }
  }
  refreshColors();

  function rgba(name, a) {
    var v = rgb[name] || rgb.text;
    return 'rgba(' + v[0] + ',' + v[1] + ',' + v[2] + ',' + a + ')';
  }

  function mix(a, b, t, alpha) {
    var x = rgb[a] || rgb.text, y = rgb[b] || rgb.text;
    var r = Math.round(x[0] + (y[0] - x[0]) * t), g = Math.round(x[1] + (y[1] - x[1]) * t), bl = Math.round(x[2] + (y[2] - x[2]) * t);
    return alpha === undefined ? 'rgb(' + r + ',' + g + ',' + bl + ')' : 'rgba(' + r + ',' + g + ',' + bl + ',' + alpha + ')';
  }

  function lum(name) {
    var v = rgb[name] || rgb.text;
    return (0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2]) / 255;
  }

  // ------------------------------------------------------------------ sdk wrappers
  // moltamp.poll only: it cleans itself up when the widget unloads (store rule: no raw setInterval).
  function poll(ms, fn) {
    if (hasSdk && moltamp.poll) return moltamp.poll(ms, fn);
    return function () {};
  }

  function subscribe(store, selector, cb) {
    if (!hasSdk || !moltamp.subscribe) return function () {};
    try { return moltamp.subscribe(store, selector, cb) || function () {}; } catch (e) { return function () {}; }
  }

  function call(channel) {
    if (!hasSdk || !moltamp.call) return Promise.reject(new Error('no sdk'));
    try { return Promise.resolve(moltamp.call.apply(moltamp, arguments)); } catch (e) { return Promise.reject(e); }
  }

  // ------------------------------------------------------------------ text scale (Settings > Display)
  var textScale = 1;
  if (hasSdk && moltamp.settings) {
    moltamp.settings.read().then(function (cfg) {
      cfg = cfg || {};
      if (typeof cfg.widgetTextScale === 'number') textScale = cfg.widgetTextScale;
      document.documentElement.style.setProperty('--user-text-scale', String(textScale));
    }).catch(function () { /* first run: no settings */ });
  }

  function font(size, weight) {
    return (weight || 'normal') + ' ' + Math.max(7, size * textScale).toFixed(1) +
      'px "SF Mono", Menlo, "Hiragino Sans", "Hiragino Kaku Gothic ProN", monospace';
  }

  // ------------------------------------------------------------------ Claude shell state
  var STATES = ['idle', 'thinking', 'streaming', 'tool-use', 'permission', 'error', 'complete'];
  var state = { name: 'idle', since: performance.now(), seen: false };
  var stateListeners = [];
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.type !== 'moltamp:push' || d.subscriptionId !== 'shell-state' || STATES.indexOf(d.data) < 0) return;
    var prev = state.name;
    state.name = d.data;
    state.since = performance.now();
    state.seen = true;
    for (var i = 0; i < stateListeners.length; i++) {
      try { stateListeners[i](state.name, prev); } catch (err) { /* keep other listeners alive */ }
    }
  });

  function currentState() {
    // "complete" is a moment, not a mode: fall back to idle after a few seconds.
    if (state.name === 'complete' && performance.now() - state.since > 4000) return 'idle';
    return state.name;
  }

  // ------------------------------------------------------------------ terminal telemetry
  var tel = { bytes: 0, activity: 'idle', level: 0, started: false };
  function telemetry() {
    if (!tel.started) {
      tel.started = true;
      subscribe('telemetry', 'bytesPerSec', function (v) { tel.bytes = Number(v) || 0; });
      subscribe('telemetry', 'activity', function (v) { tel.activity = v || 'idle'; });
    }
    return tel;
  }

  // 0..1 terminal energy, log-scaled bytes plus the activity level, smoothed by the caller's dt.
  function telemetryLevel(dt) {
    var target = Math.min(1, Math.log(1 + tel.bytes) / Math.log(1 + 200000)) * 0.75 +
      (tel.activity === 'high' ? 0.35 : tel.activity === 'low' ? 0.15 : 0);
    tel.level += (Math.min(1, target) - tel.level) * (1 - Math.exp(-(dt || 0.016) / 0.5));
    return tel.level;
  }

  // ------------------------------------------------------------------ Claude Code hook events
  // event.events is a ring buffer of the last ~200 hook payloads from every session; callers only
  // want what is new, so entries are de-duplicated by timestamp, hook, tool and session.
  var evSeen = {}, evQueue = [], evListeners = [], evStarted = false;
  function eventKey(e) { return [e._ts, e._hook || e.hook_event_name, e.tool_name, e._session || e.session_id].join('|'); }
  function onEvents(cb) {
    evListeners.push(cb);
    if (evStarted) return;
    evStarted = true;
    var first = true;
    subscribe('event', 'events', function (v) {
      var list = Array.isArray(v) ? v : v && typeof v === 'object' ? Object.keys(v).map(function (k) { return v[k]; }) : [];
      var fresh = [];
      for (var i = 0; i < list.length; i++) {
        var e = list[i];
        if (!e || typeof e !== 'object') continue;
        var k = eventKey(e);
        if (evSeen[k]) continue;
        evSeen[k] = true;
        evQueue.push(k);
        fresh.push(e);
      }
      while (evQueue.length > 800) delete evSeen[evQueue.shift()];
      var history = first;
      first = false;
      if (fresh.length) for (var j = 0; j < evListeners.length; j++) {
        try { evListeners[j](fresh, history); } catch (err) { /* keep other listeners alive */ }
      }
    });
  }

  // A failure is read from the tool's response or the hook name, never from its input
  // (a command that merely contains the word "error" is not a failure).
  function isFailure(e) {
    var hook = String(e.hook_event_name || e._hook || '');
    if (/fail|error/i.test(hook)) return true;
    var r = e.tool_response;
    if (!r || typeof r !== 'object') return false;
    if (r.is_error === true || r.isError === true || r.success === false || r.interrupted === true) return true;
    var code = r.exitCode !== undefined ? r.exitCode : r.exit_code !== undefined ? r.exit_code : r.code;
    if (typeof code === 'number' && code !== 0) return true;
    return typeof r.error === 'string' && r.error.length > 0;
  }

  function toolLabel(name) {
    name = String(name || '?');
    if (name.indexOf('mcp__') !== 0) return name;
    // mcp__plugin_chrome-devtools-mcp_chrome-devtools__take_screenshot -> chrome-devtools
    var server = name.split('__')[1] || 'mcp';
    server = server.replace(/^plugin_/, '').replace(/^claude_ai_/, '').split('_').pop();
    return 'mcp:' + server;
  }

  // ------------------------------------------------------------------ canvas + loop
  // Paused while off screen (hidden tab) or while the whole page is hidden; both must clear to resume.
  var onScreen = true, pageVisible = !document.hidden, watching = false;
  function visibleNow() { return onScreen && pageVisible; }
  function watch(el) {
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (entries) { onScreen = entries[entries.length - 1].isIntersecting; }).observe(el);
    }
    if (!watching) {
      watching = true;
      document.addEventListener('visibilitychange', function () { pageVisible = !document.hidden; });
    }
  }

  function surface(el) {
    var s = { el: el, ctx: el.getContext('2d'), w: 0, h: 0, dpr: 1, resized: true };
    s.fit = function () {
      var dpr = Math.min(2, window.devicePixelRatio || 1);
      var w = Math.max(1, el.clientWidth), h = Math.max(1, el.clientHeight);
      if (w !== s.w || h !== s.h || dpr !== s.dpr) {
        s.w = w; s.h = h; s.dpr = dpr;
        el.width = Math.round(w * dpr);
        el.height = Math.round(h * dpr);
        s.resized = true;
      }
      s.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return s;
    };
    watch(el);
    return s;
  }

  function loop(fn, fpsCap) {
    var last = 0, lastDraw = 0, logged = false, cap = fpsCap || 60;
    function frame(now) {
      requestAnimationFrame(frame);
      if (!visibleNow()) { last = 0; return; }
      if (now - lastDraw < 1000 / cap - 2) return;
      var dt = last ? Math.min((now - last) / 1000, 0.1) : 1 / 60;
      last = lastDraw = now;
      try { fn(dt, now / 1000); } catch (e) {
        if (!logged) { logged = true; console.error('[cyber-kit]', e); }
      }
    }
    requestAnimationFrame(frame);
  }

  function resetCtx(ctx) {
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.shadowBlur = 0;
    ctx.lineWidth = 1;
    ctx.setLineDash([]);
  }

  // ------------------------------------------------------------------ small utils
  function hash(str) {
    var h = 2166136261;
    str = String(str);
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return ((h >>> 0) % 100000) / 100000;
  }

  function prng(seed) {
    var a = (seed * 4294967296) >>> 0 || 1;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = Math.imul(a ^ (a >>> 15), a | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function fmtBytes(b) {
    if (hasSdk && moltamp.fmt && moltamp.fmt.bytes) return moltamp.fmt.bytes(b);
    var u = ['B', 'KB', 'MB', 'GB'], i = 0;
    while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
    return b.toFixed(i ? 1 : 0) + ' ' + u[i];
  }

  // Skin switches update CSS variables live; re-resolve once a second.
  poll(1000, refreshColors);

  return {
    c: c, rgb: rgb, rgba: rgba, mix: mix, lum: lum, refreshColors: refreshColors,
    poll: poll, subscribe: subscribe, call: call, font: font,
    state: currentState, stateInfo: state, onState: function (cb) { stateListeners.push(cb); },
    telemetry: telemetry, telemetryLevel: telemetryLevel,
    onEvents: onEvents, isFailure: isFailure, toolLabel: toolLabel,
    surface: surface, loop: loop, resetCtx: resetCtx, isVisible: visibleNow,
    hash: hash, prng: prng, fmtBytes: fmtBytes,
    meta: (hasSdk && moltamp.meta) || { context: 'panel' }
  };
})();

// Agent Fleet: Claude's sub-agents (Agent/Task hook events) as starships flying in formation around the mothership.
(function () {
  'use strict';
  var S = CK.surface(document.getElementById('cy-canvas'));
  var label = document.getElementById('cy-label');
  var MAX_SHOWN = 16, STALE_MS = 3 * 3600e3, LAUNCH_S = 1.6, RETURN_S = 1.4, BOOM_S = 1.8, TRAIL = 14;
  var ships = {}, order = [], tally = { returned: 0, lost: 0 }, booms = [], t = 0, lastText = '';
  var hooksSeen = false, storeList = [], picked = null, pickedUntil = 0, drawn = [];

  // Hull outlines in ship space, nose towards +x.
  var CLASSES = {
    scout: { col: 'cyan', size: 0.75, hull: [[1.1, 0], [-0.5, 0.5], [-0.2, 0], [-0.5, -0.5]] },
    frigate: { col: 'accent', size: 1, hull: [[1, 0], [0.2, 0.25], [-0.2, 0.7], [-0.6, 0.7], [-0.4, 0.2], [-0.7, 0.15], [-0.7, -0.15], [-0.4, -0.2], [-0.6, -0.7], [-0.2, -0.7], [0.2, -0.25]] },
    cruiser: { col: 'magenta', size: 1.3, hull: [[1.3, 0], [0.9, 0.18], [-0.9, 0.28], [-1.1, 0.12], [-1.1, -0.12], [-0.9, -0.28], [0.9, -0.18]] },
    interceptor: { col: 'green', size: 0.85, hull: [[1, 0], [-0.3, 0.15], [-0.8, 0.6], [-0.6, 0], [-0.8, -0.6], [-0.3, -0.15]] },
    hauler: { col: 'yellow', size: 1.1, hull: [[1, 0.2], [1, -0.2], [0.7, -0.35], [-0.9, -0.4], [-0.9, 0.4], [0.7, 0.35]] },
    corvette: { col: 'blue', size: 0.95, hull: [[1, 0], [0.3, 0.3], [-0.7, 0.35], [-0.5, 0], [-0.7, -0.35], [0.3, -0.3]] }
  };
  var SPARE = ['interceptor', 'hauler', 'corvette'];
  function classOf(type) {
    if (/explore/i.test(type)) return 'scout';
    if (/plan/i.test(type)) return 'cruiser';
    if (/general/i.test(type)) return 'frigate';
    if (/fork/i.test(type)) return 'interceptor';
    return SPARE[Math.floor(CK.hash(type) * SPARE.length)];
  }

  var stars = (function () {
    var r = CK.prng(0.3141), layers = [];
    [[70, 0.5, 4], [40, 1, 10], [16, 1.6, 22]].forEach(function (L) {
      var list = [];
      for (var i = 0; i < L[0]; i++) list.push({ x: r(), y: r(), p: r() * 6.283 });
      layers.push({ list: list, size: L[1], speed: L[2] });
    });
    return layers;
  })();

  // ---- hook events -> ships
  function sessionOf(e) { return String(e._session || e.session_id || ''); }
  function shipKey(e) { return e.tool_use_id ? String(e.tool_use_id) : sessionOf(e) + ':' + e._ts; }
  function flying(s) { return s.state === 'flight' || s.state === 'launch'; }

  // Background agents answer at once ("Async agent launched"): the ship keeps flying until SubagentStop.
  function asyncLaunch(r) {
    var s = typeof r === 'string' ? r : JSON.stringify(r || '');
    if (!/async agent launched/i.test(s) && !(s.length < 2000 && /launched/i.test(s) && /background/i.test(s))) return null;
    var m = /agent[_\s]?id["':\s\\]+([A-Za-z0-9_-]{6,})/i.exec(s);
    return m ? m[1] : '?';
  }

  function launch(e, history) {
    var k = shipKey(e);
    if (ships[k]) return;
    var inp = e.tool_input || {}, type = String(inp.subagent_type || inp.agent_type || 'general-purpose');
    var name = String(inp.description || inp.prompt || type).replace(/\s+/g, ' ').trim();
    ships[k] = { k: k, toolUseId: e.tool_use_id || null, name: name.slice(0, 48), type: type, cls: classOf(type), session: sessionOf(e),
      born: Number(e._ts) || Date.now(), state: history ? 'flight' : 'launch', st: 0, async: false, agentId: null, trail: [], from: null, pos: null };
    order.push(k);
  }

  function remove(s) {
    delete ships[s.k];
    var i = order.indexOf(s.k);
    if (i >= 0) order.splice(i, 1);
    if (picked === s) picked = null;
  }

  function end(s, how, history) {
    // A mission over before its ship was ever drawn has nothing to animate back.
    if (history || (!s.pos && how === 'returned')) { tally[how]++; remove(s); return; }
    s.state = how === 'lost' ? 'boom' : 'return';
    s.st = 0;
    s.how = how;
    s.from = s.pos;
  }

  function land(e, history) {
    var s = ships[shipKey(e)];
    if (!s) {
      // No tool_use_id: the oldest ship of that session still out on a synchronous mission.
      for (var i = 0; i < order.length && !s; i++) {
        var c = ships[order[i]];
        if (c && !c.toolUseId && !c.async && c.session === sessionOf(e) && flying(c)) s = c;
      }
    }
    if (!s || !flying(s)) {
      if (!s && history) tally[CK.isFailure(e) ? 'lost' : 'returned']++;
      return;
    }
    var id = !CK.isFailure(e) && asyncLaunch(e.tool_response);
    if (id) { s.async = true; s.agentId = id; return; }
    end(s, CK.isFailure(e) ? 'lost' : 'returned', history);
  }

  function subagentStop(e, history) {
    var id = String(e.agent_id || e.agentId || ''), sess = sessionOf(e), byId = null, bySession = null;
    order.forEach(function (k) {
      var s = ships[k];
      if (!s || !s.async || !flying(s)) return;
      if (id && s.agentId === id) byId = byId || s;
      if (s.session === sess) bySession = bySession || s;
    });
    var s = byId || bySession;
    if (s) end(s, CK.isFailure(e) ? 'lost' : 'returned', history);
  }

  CK.onEvents(function (events, history) {
    for (var i = 0; i < events.length; i++) {
      var e = events[i], hook = String(e.hook_event_name || e._hook || '');
      if (/^SubagentStop$/i.test(hook)) { hooksSeen = true; subagentStop(e, history); continue; }
      if (!/^(Agent|Task)$/.test(String(e.tool_name || ''))) continue;
      hooksSeen = true;
      if (/^Pre/i.test(hook)) launch(e, history);
      else if (/^Post/i.test(hook)) land(e, history);
    }
  });

  // The agent store stayed empty in every probe; it only drives the fleet when no Agent hook was ever seen.
  CK.subscribe('agent', 'agents', function (v) {
    var list = Array.isArray(v) ? v : v && typeof v === 'object' ? Object.keys(v).map(function (k) { return Object.assign({ id: k }, v[k]); }) : [];
    storeList = list.filter(function (a) { return a && typeof a === 'object'; }).map(function (a) {
      return { id: String(a.id || a.agentId || a.name || ''), name: String(a.description || a.name || a.type || 'agent'), type: String(a.subagent_type || a.type || a.name || ''),
        done: /complete|done|finish|stop|fail|error|cancel/i.test(String(a.status || a.state || '')), failed: /fail|error/i.test(String(a.status || a.state || '')) };
    });
  });
  function syncStore() {
    if (hooksSeen) return;
    var live = {};
    storeList.forEach(function (a) {
      var k = 'store:' + a.id;
      if (a.done) { if (ships[k] && flying(ships[k])) end(ships[k], a.failed ? 'lost' : 'returned', false); return; }
      live[k] = true;
      if (!ships[k]) launch({ tool_use_id: k, tool_input: { subagent_type: a.type, description: a.name }, _ts: Date.now() }, false);
    });
    order.forEach(function (k) { var s = ships[k]; if (s && /^store:/.test(k) && flying(s) && !live[k]) end(s, 'returned', false); });
  }

  document.getElementById('cy-canvas').addEventListener('click', function (ev) {
    if (ev.button !== 0 || ev.ctrlKey) return;
    var r = ev.currentTarget.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, best = null, bd = 1e9;
    drawn.forEach(function (d) {
      var dd = Math.hypot(d.x - x, d.y - y);
      if (dd < Math.max(16, d.r * 2) && dd < bd) { bd = dd; best = d.s; }
    });
    picked = best;
    pickedUntil = Date.now() + 7000;
  });

  function ease(x) { x = Math.max(0, Math.min(1, x)); return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }
  function ago(ms) { var s = Math.round(ms / 1000); return s < 60 ? s + 's' : s < 3600 ? Math.round(s / 60) + 'm' : Math.round(s / 3600) + 'h'; }

  function drawHull(ctx, cls, x, y, ang, size, col, alpha, light) {
    var hull = CLASSES[cls].hull, ca = Math.cos(ang), sa = Math.sin(ang);
    ctx.beginPath();
    for (var i = 0; i < hull.length; i++) {
      var hx = hull[i][0] * size, hy = hull[i][1] * size, px = x + hx * ca - hy * sa, py = y + hx * sa + hy * ca;
      if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = CK.mix(col, light ? 'fg' : 'bg', 0.45, alpha);
    ctx.fill();
    ctx.strokeStyle = CK.rgba(col, alpha);
    ctx.lineWidth = Math.max(1, size * 0.12);
    ctx.stroke();
  }

  function drawMothership(ctx, x, y, M, st, launching, light) {
    var col = st === 'error' ? 'red' : st === 'permission' ? 'magenta' : 'accent';
    var pulse = st === 'permission' ? 0.5 + 0.5 * Math.sin(t * 6) : 1;
    var glow = ctx.createRadialGradient(x, y, 0, x, y, M * 1.6);
    glow.addColorStop(0, CK.rgba(col, (light ? 0.12 : 0.22) * pulse));
    glow.addColorStop(1, CK.rgba(col, 0));
    ctx.fillStyle = glow;
    ctx.fillRect(x - M * 1.6, y - M * 1.6, M * 3.2, M * 3.2);
    var hull = [[1, 0], [0.7, 0.17], [-0.55, 0.24], [-0.85, 0.13], [-0.85, -0.13], [-0.55, -0.24], [0.7, -0.17]], k = 0.55;
    ctx.beginPath();
    hull.forEach(function (p, i) { var px = x + p[0] * M, py = y + p[1] * M * k * 2; if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py); });
    ctx.closePath();
    var g = ctx.createLinearGradient(0, y - M * 0.25, 0, y + M * 0.25);
    g.addColorStop(0, CK.mix('bg', 'fg', light ? 0.25 : 0.32));
    g.addColorStop(1, CK.mix('bg', 'dim', 0.12));
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = CK.rgba(col, 0.9 * pulse);
    ctx.lineWidth = Math.max(1, M * 0.02);
    ctx.stroke();
    // Bridge tower and hull plating
    ctx.fillStyle = CK.mix('bg', 'fg', light ? 0.35 : 0.45);
    ctx.fillRect(x - M * 0.32, y - M * 0.2, M * 0.22, M * 0.1);
    ctx.strokeStyle = CK.rgba('dim', 0.35);
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var i = 1; i < 5; i++) { var px = x - M * 0.6 + i * M * 0.28; ctx.moveTo(px, y - M * 0.12); ctx.lineTo(px, y + M * 0.12); }
    ctx.stroke();
    // Hangar mouth glows while ships launch
    var hang = launching ? 0.6 + 0.4 * Math.sin(t * 10) : 0.25;
    ctx.fillStyle = CK.rgba('yellow', hang);
    ctx.fillRect(x + M * 0.62, y - M * 0.05, M * 0.14, M * 0.1);
    // Running lights
    var blink = Math.sin(t * 3) > 0.6;
    ctx.fillStyle = blink ? CK.c.red : CK.rgba('red', 0.25);
    ctx.fillRect(x - M * 0.86, y - M * 0.14, 2, 2);
    ctx.fillStyle = !blink ? CK.c.green : CK.rgba('green', 0.25);
    ctx.fillRect(x - M * 0.86, y + M * 0.12, 2, 2);
  }

  CK.loop(function (dt) {
    S.fit();
    S.resized = false;
    syncStore();
    var ctx = S.ctx, w = S.w, h = S.h, light = CK.lum('bg') > 0.5, now = Date.now(), st = CK.state();
    t += dt;

    ctx.fillStyle = CK.c.bg;
    ctx.fillRect(0, 0, w, h);
    // Parallax star field: the fleet cruises forward
    stars.forEach(function (L) {
      ctx.fillStyle = CK.rgba('fg', light ? 0.25 : 0.55);
      L.list.forEach(function (s) {
        var x = ((s.x * w - t * L.speed * (w / 500)) % w + w) % w;
        ctx.globalAlpha = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(t * 1.4 + s.p));
        ctx.fillRect(x, s.y * h, L.size, L.size);
      });
    });
    ctx.globalAlpha = 1;

    var cx = w / 2, cy = h * 0.47, sx = Math.min(w * 0.42, h * 1.9), sy = Math.min(h * 0.68, sx * 1.25);
    var pitch = 0.4, cp = Math.cos(pitch), sp = Math.sin(pitch), D = 3.2;
    function proj(p) { var y2 = p[1] * cp - p[2] * sp, z2 = p[1] * sp + p[2] * cp, f = D / (D - z2); return [cx + p[0] * f * sx, cy - y2 * f * sy, z2, f]; }

    // Formation slots: one ring, two counter-rotating rings past eight ships
    var active = order.map(function (k) { return ships[k]; }).filter(function (s) { return s && (flying(s) || s.state === 'return' || s.state === 'boom'); });
    order.slice().forEach(function (k) { var s = ships[k]; if (s && flying(s) && now - s.born > STALE_MS) remove(s); });
    var fleet = active.filter(flying), shown = fleet.slice(-MAX_SHOWN), n = shown.length;
    function slot(i, tt) {
      var two = n > 8, inner = two && i % 2 === 1, per = two ? Math.ceil(n / 2) : Math.max(1, n), j = two ? Math.floor(i / 2) : i;
      var a = tt * 0.18 * (inner ? -1.3 : 1) + j * 6.283 / per + (inner ? 0.4 : 0), r = inner ? 0.62 : 1;
      return [Math.cos(a) * r, 0.07 * Math.sin(tt * 1.3 + i * 1.7), Math.sin(a) * r];
    }
    var hangar = [0.2, -0.02, 0.32], dock = [0, 0, 0], base = Math.max(4, Math.min(h * 0.075, w * 0.03));
    var M = Math.max(16, Math.min(h * 0.3, w * 0.2));
    var items = [];
    active.forEach(function (s) {
      var idx = shown.indexOf(s), p;
      if (flying(s) && idx < 0) return;
      s.st += dt;
      if (s.state === 'launch') {
        var k = ease(s.st / LAUNCH_S), target = slot(idx, t);
        p = [hangar[0] + (target[0] - hangar[0]) * k, hangar[1] + (target[1] - hangar[1]) * k, hangar[2] + (target[2] - hangar[2]) * k];
        s.cur = p;
        if (s.st >= LAUNCH_S) s.state = 'flight';
      } else if (s.state === 'flight') {
        // Ease towards the slot: the formation reshuffles smoothly when ships join or leave.
        var goal = slot(idx, t), e = 1 - Math.exp(-dt * 2.5), c = s.cur || goal;
        p = s.cur = [c[0] + (goal[0] - c[0]) * e, c[1] + (goal[1] - c[1]) * e, c[2] + (goal[2] - c[2]) * e];
      } else if (s.state === 'return') {
        var from = s.from || [0.8, 0, 0.3], q = ease(s.st / RETURN_S);
        p = [from[0] + (dock[0] - from[0]) * q, from[1] + (dock[1] - from[1]) * q, from[2] + (dock[2] - from[2]) * q];
        if (s.st >= RETURN_S) { tally.returned++; remove(s); return; }
      } else if (s.state === 'boom') {
        if (s.st < dt * 1.5) {
          var bp = proj(s.from || [0.8, 0, 0.3]), parts = [];
          for (var b = 0; b < 26; b++) { var a = Math.random() * 6.283, v = (20 + Math.random() * 60) * Math.min(1.6, w / 400 + 0.4); parts.push([Math.cos(a) * v, Math.sin(a) * v * 0.7, Math.random() * 0.5 + 0.5]); }
          booms.push({ x: bp[0], y: bp[1], t: 0, col: CLASSES[s.cls].col, parts: parts });
        }
        tally.lost++;
        remove(s);
        return;
      }
      s.pos = p;
      var sc = proj(p), prev = s.trail.length ? s.trail[s.trail.length - 1] : null;
      var ang = prev ? Math.atan2(sc[1] - prev[1], sc[0] - prev[0]) : 0;
      var jump = prev ? Math.hypot(sc[0] - prev[0], sc[1] - prev[1]) : 0;
      if (jump > 60) s.trail = [];
      if (!prev || jump > 0.6) { s.trail.push([sc[0], sc[1]]); if (s.trail.length > TRAIL) s.trail.shift(); s.ang = ang; }
      var shrink = s.state === 'return' ? 1 - 0.6 * ease(s.st / RETURN_S) : s.state === 'launch' ? 0.4 + 0.6 * ease(s.st / LAUNCH_S) : 1;
      items.push({ s: s, x: sc[0], y: sc[1], z: sc[2], size: base * CLASSES[s.cls].size * sc[3] * shrink });
    });
    items.sort(function (a, b) { return a.z - b.z; });

    drawn = [];
    function drawShip(it) {
      var s = it.s, col = CLASSES[s.cls].col, alpha = s === picked ? 1 : 0.92;
      ctx.lineCap = 'round';
      for (var j = 1; j < s.trail.length; j++) {
        ctx.strokeStyle = CK.rgba(col, 0.45 * j / s.trail.length);
        ctx.lineWidth = Math.max(0.8, it.size * 0.35 * j / s.trail.length);
        ctx.beginPath(); ctx.moveTo(s.trail[j - 1][0], s.trail[j - 1][1]); ctx.lineTo(s.trail[j][0], s.trail[j][1]); ctx.stroke();
      }
      var ang = s.ang || 0, ex = it.x - Math.cos(ang) * it.size * 0.8, ey = it.y - Math.sin(ang) * it.size * 0.8;
      var eg = ctx.createRadialGradient(ex, ey, 0, ex, ey, it.size * 1.2);
      eg.addColorStop(0, CK.rgba(col, 0.7));
      eg.addColorStop(1, CK.rgba(col, 0));
      ctx.fillStyle = eg;
      ctx.beginPath(); ctx.arc(ex, ey, it.size * 1.2, 0, 6.283); ctx.fill();
      drawHull(ctx, s.cls, it.x, it.y, ang, it.size, col, alpha, light);
      if (s === picked) {
        ctx.strokeStyle = CK.rgba('fg', 0.8);
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(it.x, it.y, it.size * 1.9, 0, 6.283); ctx.stroke();
      }
      drawn.push({ x: it.x, y: it.y, r: it.size, s: s });
    }
    var mother = proj([0, 0, 0]);
    var launching = active.some(function (s) { return s.state === 'launch'; });
    items.filter(function (it) { return it.z < 0; }).forEach(drawShip);
    drawMothership(ctx, mother[0], mother[1], M, st, launching, light);
    items.filter(function (it) { return it.z >= 0; }).forEach(drawShip);

    // Explosions: flash ring, sparks and debris
    ctx.globalCompositeOperation = light ? 'source-over' : 'lighter';
    for (var bi = booms.length - 1; bi >= 0; bi--) {
      var bm = booms[bi];
      bm.t += dt;
      if (bm.t > BOOM_S) { booms.splice(bi, 1); continue; }
      var life = bm.t / BOOM_S;
      ctx.strokeStyle = CK.rgba('red', (1 - life) * 0.9);
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(bm.x, bm.y, 4 + life * 34, 0, 6.283); ctx.stroke();
      if (bm.t < 0.15) {
        ctx.fillStyle = CK.rgba('fg', 0.8);
        ctx.beginPath(); ctx.arc(bm.x, bm.y, 10, 0, 6.283); ctx.fill();
      }
      bm.parts.forEach(function (pt, pi) {
        var px = bm.x + pt[0] * bm.t, py = bm.y + pt[1] * bm.t + 12 * bm.t * bm.t;
        ctx.fillStyle = CK.rgba(pi % 3 ? 'yellow' : bm.col, Math.max(0, pt[2] - life));
        ctx.fillRect(px - 1, py - 1, pi % 4 ? 2 : 3, pi % 4 ? 2 : 3);
      });
    }
    ctx.globalCompositeOperation = 'source-over';

    if (fleet.length > MAX_SHOWN) {
      ctx.fillStyle = CK.c.text;
      ctx.font = CK.font(9, 'bold');
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText('+' + (fleet.length - MAX_SHOWN), mother[0], mother[1] + M * 0.3);
    }
    if (!active.length && h > 80) {
      ctx.fillStyle = CK.rgba('dim', 0.85);
      ctx.font = CK.font(Math.max(8, Math.min(11, w / 30)));
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText('hangar ready · waiting for sub-agents', mother[0], mother[1] + M * 0.32);
    }
    CK.resetCtx(ctx);

    var text;
    if (picked && pickedUntil > now && ships[picked.k]) {
      text = '艦隊 · ' + picked.name + ' · ' + picked.type + ' · ' + (picked.async ? 'background · ' : '') + 'out ' + ago(now - picked.born);
    } else {
      text = '艦隊 · ' + fleet.length + ' in flight · ' + tally.returned + ' returned' + (tally.lost ? ' · ' + tally.lost + ' lost' : '');
    }
    if (text !== lastText) { lastText = text; label.textContent = text; }
  });
})();
</script>
