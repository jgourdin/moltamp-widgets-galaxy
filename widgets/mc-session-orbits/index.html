<!--
  Session Orbits — Mission Control pack for MOLTamp
  Every Claude Code session becomes a planet orbiting Claude: the busy one glows and leaves a comet trail, sub-agents turn into moons, and a planet waiting for your permission pulses. Click a planet for its details.
  Author: j0j0 · License: MIT
-->
<div id="cy-root"><canvas id="cy-canvas"></canvas><div id="cy-label"></div></div>

<style>
  #cy-root { position: absolute; inset: 0; overflow: hidden; background: var(--c-chrome-bg); container-type: size; }
  #cy-canvas { display: block; width: 100%; height: 100%; }
  #cy-label {
    position: absolute; left: 8px; bottom: 6px; pointer-events: none; letter-spacing: 0.08em;
    color: var(--c-chrome-dim); text-shadow: 0 0 6px var(--c-chrome-bg);
    font: calc(clamp(8px, 3.4cqw, 12px) * var(--user-text-scale, 1)) 'SF Mono', Menlo, 'Hiragino Sans', monospace;
  }
</style>

<script>
// cyber-kit — shared runtime of the Cyberpunk widget pack (MIT, j0j0).
// Skin colours resolved for canvas use, DPR-aware canvas, pause when hidden, Claude state, telemetry.
var CK = (function () {
  'use strict';

  var hasSdk = typeof window.moltamp !== 'undefined';

  // ------------------------------------------------------------------ skin colours
  var VARS = {
    bg: '--c-chrome-bg', text: '--c-chrome-text', accent: '--c-chrome-accent', dim: '--c-chrome-dim',
    border: '--c-chrome-border', fg: '--t-foreground', termBg: '--t-background', red: '--t-red',
    green: '--t-green', yellow: '--t-yellow', blue: '--t-blue', cyan: '--t-cyan', magenta: '--t-magenta'
  };
  // A colour missing from the skin borrows another skin colour, never a hardcoded value.
  var BORROW = {
    text: ['fg', 'accent'], fg: ['text', 'accent'], accent: ['text', 'fg'], dim: ['text', 'fg'], border: ['dim', 'text'],
    bg: ['termBg'], termBg: ['bg'], red: ['magenta', 'accent'], green: ['cyan', 'accent'], yellow: ['accent', 'red'],
    blue: ['cyan', 'accent'], cyan: ['blue', 'accent'], magenta: ['red', 'accent']
  };
  var probeEl = document.createElement('span');
  probeEl.style.display = 'none';
  (document.body || document.documentElement).appendChild(probeEl);
  var pc = document.createElement('canvas');
  pc.width = pc.height = 1;
  var pctx = pc.getContext('2d', { willReadFrequently: true });
  var rgb = {};
  var c = {};

  // Resolves any CSS colour the skin may use (hex, rgb, var(), color-mix()) to RGB bytes.
  function readVar(name) {
    var raw = getComputedStyle(document.documentElement).getPropertyValue(VARS[name]).trim();
    if (!raw) return null;
    probeEl.style.color = '';
    probeEl.style.color = raw;
    var computed = getComputedStyle(probeEl).color;
    pctx.fillStyle = '#010203';
    pctx.fillStyle = computed;
    if (pctx.fillStyle === '#010203' && computed !== 'rgb(1, 2, 3)') return null;
    pctx.clearRect(0, 0, 1, 1);
    pctx.fillRect(0, 0, 1, 1);
    var d = pctx.getImageData(0, 0, 1, 1).data;
    return [d[0], d[1], d[2]];
  }

  function refreshColors() {
    var name, raw = {};
    for (name in VARS) raw[name] = readVar(name);
    for (name in VARS) {
      var v = raw[name], chain = BORROW[name] || [];
      for (var i = 0; !v && i < chain.length; i++) v = raw[chain[i]];
      if (!v) {
        // Last resort: the host's own text colour, still a skin value.
        probeEl.style.color = '';
        var m = /(\d+)\D+(\d+)\D+(\d+)/.exec(getComputedStyle(document.body || document.documentElement).color) || [0, 128, 128, 128];
        v = [+m[1], +m[2], +m[3]];
      }
      rgb[name] = v;
      c[name] = 'rgb(' + v[0] + ',' + v[1] + ',' + v[2] + ')';
    }
  }
  refreshColors();

  function rgba(name, a) {
    var v = rgb[name] || rgb.text;
    return 'rgba(' + v[0] + ',' + v[1] + ',' + v[2] + ',' + a + ')';
  }

  function mix(a, b, t, alpha) {
    var x = rgb[a] || rgb.text, y = rgb[b] || rgb.text;
    var r = Math.round(x[0] + (y[0] - x[0]) * t), g = Math.round(x[1] + (y[1] - x[1]) * t), bl = Math.round(x[2] + (y[2] - x[2]) * t);
    return alpha === undefined ? 'rgb(' + r + ',' + g + ',' + bl + ')' : 'rgba(' + r + ',' + g + ',' + bl + ',' + alpha + ')';
  }

  function lum(name) {
    var v = rgb[name] || rgb.text;
    return (0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2]) / 255;
  }

  // ------------------------------------------------------------------ sdk wrappers
  // moltamp.poll only: it cleans itself up when the widget unloads (store rule: no raw setInterval).
  function poll(ms, fn) {
    if (hasSdk && moltamp.poll) return moltamp.poll(ms, fn);
    return function () {};
  }

  function subscribe(store, selector, cb) {
    if (!hasSdk || !moltamp.subscribe) return function () {};
    try { return moltamp.subscribe(store, selector, cb) || function () {}; } catch (e) { return function () {}; }
  }

  function call(channel) {
    if (!hasSdk || !moltamp.call) return Promise.reject(new Error('no sdk'));
    try { return Promise.resolve(moltamp.call.apply(moltamp, arguments)); } catch (e) { return Promise.reject(e); }
  }

  // ------------------------------------------------------------------ text scale (Settings > Display)
  var textScale = 1;
  if (hasSdk && moltamp.settings) {
    moltamp.settings.read().then(function (cfg) {
      cfg = cfg || {};
      if (typeof cfg.widgetTextScale === 'number') textScale = cfg.widgetTextScale;
      document.documentElement.style.setProperty('--user-text-scale', String(textScale));
    }).catch(function () { /* first run: no settings */ });
  }

  function font(size, weight) {
    return (weight || 'normal') + ' ' + Math.max(7, size * textScale).toFixed(1) +
      'px "SF Mono", Menlo, "Hiragino Sans", "Hiragino Kaku Gothic ProN", monospace';
  }

  // ------------------------------------------------------------------ Claude shell state
  var STATES = ['idle', 'thinking', 'streaming', 'tool-use', 'permission', 'error', 'complete'];
  var state = { name: 'idle', since: performance.now(), seen: false };
  var stateListeners = [];
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.type !== 'moltamp:push' || d.subscriptionId !== 'shell-state' || STATES.indexOf(d.data) < 0) return;
    var prev = state.name;
    state.name = d.data;
    state.since = performance.now();
    state.seen = true;
    for (var i = 0; i < stateListeners.length; i++) {
      try { stateListeners[i](state.name, prev); } catch (err) { /* keep other listeners alive */ }
    }
  });

  function currentState() {
    // "complete" is a moment, not a mode: fall back to idle after a few seconds.
    if (state.name === 'complete' && performance.now() - state.since > 4000) return 'idle';
    return state.name;
  }

  // ------------------------------------------------------------------ terminal telemetry
  var tel = { bytes: 0, activity: 'idle', level: 0, started: false };
  function telemetry() {
    if (!tel.started) {
      tel.started = true;
      subscribe('telemetry', 'bytesPerSec', function (v) { tel.bytes = Number(v) || 0; });
      subscribe('telemetry', 'activity', function (v) { tel.activity = v || 'idle'; });
    }
    return tel;
  }

  // 0..1 terminal energy, log-scaled bytes plus the activity level, smoothed by the caller's dt.
  function telemetryLevel(dt) {
    var target = Math.min(1, Math.log(1 + tel.bytes) / Math.log(1 + 200000)) * 0.75 +
      (tel.activity === 'high' ? 0.35 : tel.activity === 'low' ? 0.15 : 0);
    tel.level += (Math.min(1, target) - tel.level) * (1 - Math.exp(-(dt || 0.016) / 0.5));
    return tel.level;
  }

  // ------------------------------------------------------------------ Claude Code hook events
  // event.events is a ring buffer of the last ~200 hook payloads from every session; callers only
  // want what is new, so entries are de-duplicated by timestamp, hook, tool and session.
  var evSeen = {}, evQueue = [], evListeners = [], evStarted = false;
  function eventKey(e) { return [e._ts, e._hook || e.hook_event_name, e.tool_name, e._session || e.session_id].join('|'); }
  function onEvents(cb) {
    evListeners.push(cb);
    if (evStarted) return;
    evStarted = true;
    var first = true;
    subscribe('event', 'events', function (v) {
      var list = Array.isArray(v) ? v : v && typeof v === 'object' ? Object.keys(v).map(function (k) { return v[k]; }) : [];
      var fresh = [];
      for (var i = 0; i < list.length; i++) {
        var e = list[i];
        if (!e || typeof e !== 'object') continue;
        var k = eventKey(e);
        if (evSeen[k]) continue;
        evSeen[k] = true;
        evQueue.push(k);
        fresh.push(e);
      }
      while (evQueue.length > 800) delete evSeen[evQueue.shift()];
      var history = first;
      first = false;
      if (fresh.length) for (var j = 0; j < evListeners.length; j++) {
        try { evListeners[j](fresh, history); } catch (err) { /* keep other listeners alive */ }
      }
    });
  }

  // A failure is read from the tool's response or the hook name, never from its input
  // (a command that merely contains the word "error" is not a failure).
  function isFailure(e) {
    var hook = String(e.hook_event_name || e._hook || '');
    if (/fail|error/i.test(hook)) return true;
    var r = e.tool_response;
    if (!r || typeof r !== 'object') return false;
    if (r.is_error === true || r.isError === true || r.success === false || r.interrupted === true) return true;
    var code = r.exitCode !== undefined ? r.exitCode : r.exit_code !== undefined ? r.exit_code : r.code;
    if (typeof code === 'number' && code !== 0) return true;
    return typeof r.error === 'string' && r.error.length > 0;
  }

  function toolLabel(name) {
    name = String(name || '?');
    if (name.indexOf('mcp__') !== 0) return name;
    // mcp__plugin_chrome-devtools-mcp_chrome-devtools__take_screenshot -> chrome-devtools
    var server = name.split('__')[1] || 'mcp';
    server = server.replace(/^plugin_/, '').replace(/^claude_ai_/, '').split('_').pop();
    return 'mcp:' + server;
  }

  // ------------------------------------------------------------------ canvas + loop
  // Paused while off screen (hidden tab) or while the whole page is hidden; both must clear to resume.
  var onScreen = true, pageVisible = !document.hidden, watching = false;
  function visibleNow() { return onScreen && pageVisible; }
  function watch(el) {
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (entries) { onScreen = entries[entries.length - 1].isIntersecting; }).observe(el);
    }
    if (!watching) {
      watching = true;
      document.addEventListener('visibilitychange', function () { pageVisible = !document.hidden; });
    }
  }

  function surface(el) {
    var s = { el: el, ctx: el.getContext('2d'), w: 0, h: 0, dpr: 1, resized: true };
    s.fit = function () {
      var dpr = Math.min(2, window.devicePixelRatio || 1);
      var w = Math.max(1, el.clientWidth), h = Math.max(1, el.clientHeight);
      if (w !== s.w || h !== s.h || dpr !== s.dpr) {
        s.w = w; s.h = h; s.dpr = dpr;
        el.width = Math.round(w * dpr);
        el.height = Math.round(h * dpr);
        s.resized = true;
      }
      s.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return s;
    };
    watch(el);
    return s;
  }

  function loop(fn, fpsCap) {
    var last = 0, lastDraw = 0, logged = false, cap = fpsCap || 60;
    function frame(now) {
      requestAnimationFrame(frame);
      if (!visibleNow()) { last = 0; return; }
      if (now - lastDraw < 1000 / cap - 2) return;
      var dt = last ? Math.min((now - last) / 1000, 0.1) : 1 / 60;
      last = lastDraw = now;
      try { fn(dt, now / 1000); } catch (e) {
        if (!logged) { logged = true; console.error('[cyber-kit]', e); }
      }
    }
    requestAnimationFrame(frame);
  }

  function resetCtx(ctx) {
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.shadowBlur = 0;
    ctx.lineWidth = 1;
    ctx.setLineDash([]);
  }

  // ------------------------------------------------------------------ small utils
  function hash(str) {
    var h = 2166136261;
    str = String(str);
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return ((h >>> 0) % 100000) / 100000;
  }

  function prng(seed) {
    var a = (seed * 4294967296) >>> 0 || 1;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = Math.imul(a ^ (a >>> 15), a | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function fmtBytes(b) {
    if (hasSdk && moltamp.fmt && moltamp.fmt.bytes) return moltamp.fmt.bytes(b);
    var u = ['B', 'KB', 'MB', 'GB'], i = 0;
    while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
    return b.toFixed(i ? 1 : 0) + ' ' + u[i];
  }

  // Skin switches update CSS variables live; re-resolve once a second.
  poll(1000, refreshColors);

  return {
    c: c, rgb: rgb, rgba: rgba, mix: mix, lum: lum, refreshColors: refreshColors,
    poll: poll, subscribe: subscribe, call: call, font: font,
    state: currentState, stateInfo: state, onState: function (cb) { stateListeners.push(cb); },
    telemetry: telemetry, telemetryLevel: telemetryLevel,
    onEvents: onEvents, isFailure: isFailure, toolLabel: toolLabel,
    surface: surface, loop: loop, resetCtx: resetCtx, isVisible: visibleNow,
    hash: hash, prng: prng, fmtBytes: fmtBytes,
    meta: (hasSdk && moltamp.meta) || { context: 'panel' }
  };
})();

// Session Orbits: every Claude Code session seen in the hook events is a planet orbiting Claude (the sun).
(function () {
  'use strict';
  var S = CK.surface(document.getElementById('cy-canvas'));
  var label = document.getElementById('cy-label');
  var MAX_PLANETS = 8, ACTIVE_MS = 20000, QUIET_MS = 10 * 60e3, TRAIL = 26;
  var COLS = ['accent', 'cyan', 'magenta', 'green', 'yellow', 'blue'];
  var sessions = {}, t = 0, lastText = '', picked = null, pickedUntil = 0, drawn = [];
  var bg = (function () {
    var r = CK.prng(0.4242), list = [];
    for (var i = 0; i < 120; i++) list.push({ x: r(), y: r(), s: 0.3 + r() * 1.1, p: r() * 6.283 });
    return list;
  })();

  function project(cwd) {
    var parts = String(cwd || '').split('/').filter(Boolean);
    return parts.length ? parts[parts.length - 1] : '';
  }

  function session(id, cwd) {
    var s = sessions[id];
    if (!s) {
      s = sessions[id] = { id: id, name: '', calls: 0, agents: 0, first: Infinity, last: 0, phase: CK.hash(id) * 6.283,
        col: COLS[Math.floor(CK.hash(id + '#c') * COLS.length)], flare: 0, fail: 0, waiting: false, trail: [], ctx: null, model: '' };
    }
    if (!s.name && cwd) s.name = project(cwd);
    return s;
  }

  function ingest(events, history) {
    for (var i = 0; i < events.length; i++) {
      var e = events[i], id = e._session || e.session_id;
      if (!id) continue;
      var s = session(String(id), e.cwd), ts = Number(e._ts) || Date.now();
      var hook = String(e.hook_event_name || e._hook || '');
      s.first = Math.min(s.first, ts);
      s.last = Math.max(s.last, ts);
      if (/^Pre/i.test(hook) && e.tool_name) {
        s.calls++;
        if (/^(Agent|Task)$/.test(e.tool_name)) s.agents++;
        if (!history) s.flare = 1;
        s.waiting = false;
      } else if (/^Notification$/i.test(hook)) {
        // Claude Code notifies both "needs your permission" and "waiting for your input"; only the first blocks a tool.
        s.waiting = /permission/i.test(String(e.message || ''));
      } else if (/^(UserPromptSubmit|PostToolUse|Stop|SessionEnd)$/i.test(hook)) {
        s.waiting = false;
      }
      if (!history && CK.isFailure(e)) s.fail = 1;
    }
  }
  CK.onEvents(ingest);

  // claude.sessions (model, context, cost) was always empty in the probes; read it defensively when it fills up.
  CK.subscribe('claude', 'sessions', function (v) {
    if (!v || typeof v !== 'object') return;
    Object.keys(v).forEach(function (k) {
      var x = v[k];
      if (!x || typeof x !== 'object') return;
      var id = String(x.sessionId || x.session_id || x.id || k), s = sessions[id];
      if (!s) return;
      var ctx = x.contextPct !== undefined ? x.contextPct : x.context_pct !== undefined ? x.context_pct : x.context && x.context.pct;
      ctx = Number(ctx);
      s.ctx = isFinite(ctx) ? Math.max(0, Math.min(100, ctx > 0 && ctx <= 1 ? ctx * 100 : ctx)) : null;
      s.model = String(x.model && (x.model.display_name || x.model.id) || x.model || '');
    });
  });

  // Click a planet: its details stay in the label for a few seconds.
  document.getElementById('cy-canvas').addEventListener('click', function (ev) {
    var r = ev.currentTarget.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, best = null, bd = 1e9;
    drawn.forEach(function (d) {
      var dd = Math.hypot(d.x - x, d.y - y);
      if (dd < Math.max(18, d.r * 2.5) && dd < bd) { bd = dd; best = d.s; }
    });
    picked = best;
    pickedUntil = Date.now() + 8000;
  });

  function ago(ms) {
    var s = Math.round(ms / 1000);
    return s < 60 ? s + 's ago' : s < 3600 ? Math.round(s / 60) + 'm ago' : Math.round(s / 3600) + 'h ago';
  }

  var SUN = { idle: [0.35, 'accent'], thinking: [0.6, 'blue'], streaming: [0.85, 'cyan'], 'tool-use': [1, 'yellow'],
    permission: [0.55, 'magenta'], error: [0.7, 'red'], complete: [0.9, 'green'] };

  CK.loop(function (dt) {
    S.fit();
    S.resized = false;
    var ctx = S.ctx, w = S.w, h = S.h, light = CK.lum('bg') > 0.5, now = Date.now();
    t += dt;

    ctx.fillStyle = CK.c.bg;
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = CK.c.fg;
    for (var b = 0; b < bg.length; b++) {
      var s0 = bg[b];
      ctx.globalAlpha = 0.12 + 0.3 * (0.5 + 0.5 * Math.sin(t * 1.1 + s0.p));
      ctx.fillRect(s0.x * w, s0.y * h, s0.s, s0.s);
    }
    ctx.globalAlpha = 1;

    // The most recently active sessions, kept in first-seen order so orbits don't swap places.
    var list = Object.keys(sessions).map(function (k) { return sessions[k]; })
      .sort(function (a, c) { return c.last - a.last; }).slice(0, MAX_PLANETS)
      .sort(function (a, c) { return a.first - c.first; });
    var cx = w / 2, cy = h / 2, unit = Math.min(w, h);
    var sunInfo = SUN[CK.state()] || SUN.idle, sunR = Math.max(5, unit * 0.07);
    var rxMax = w * 0.46, ryMax = h * 0.4, n = Math.max(1, list.length);
    var planets = [];
    drawn = [];

    list.forEach(function (s, i) {
      var k = (i + 1) / n, rx = sunR * 2.2 + (rxMax - sunR * 2.2) * k, ry = sunR * 1.4 + (ryMax - sunR * 1.4) * k;
      var active = now - s.last < ACTIVE_MS, quiet = now - s.last > QUIET_MS;
      // Inner orbits run faster (Kepler-ish); the active session speeds up.
      s.phase += dt * 0.35 / Math.sqrt(0.3 + k) * (active ? 2.5 : quiet ? 0.25 : 1);
      var x = cx + Math.cos(s.phase) * rx, y = cy + Math.sin(s.phase) * ry;
      var pr = Math.max(2.5, Math.min(unit * 0.06, (2.5 + 2.6 * Math.log(1 + s.calls) / Math.LN10) * unit / 260));
      s.flare *= Math.exp(-dt * 2.5);
      s.fail *= Math.exp(-dt * 1.3);
      if (active) { s.trail.push([x, y]); if (s.trail.length > TRAIL) s.trail.shift(); } else if (s.trail.length) s.trail.shift();
      planets.push({ s: s, x: x, y: y, r: pr, rx: rx, ry: ry, active: active, quiet: quiet, front: Math.sin(s.phase) > 0 });
    });

    // Orbits
    planets.forEach(function (p) {
      ctx.strokeStyle = CK.rgba(p.active ? p.s.col : 'dim', p.active ? 0.35 : 0.14);
      ctx.lineWidth = p.active ? 1.2 : 0.8;
      ctx.beginPath(); ctx.ellipse(cx, cy, p.rx, p.ry, 0, 0, 6.283); ctx.stroke();
    });

    function drawPlanet(p) {
      var s = p.s, col = s.fail > 0.05 && Math.sin(t * 28) > 0 ? 'red' : s.col, alpha = p.quiet ? 0.35 : 1;
      // Comet trail of the busy session
      if (s.trail.length > 2) {
        ctx.lineCap = 'round';
        for (var j = 1; j < s.trail.length; j++) {
          ctx.strokeStyle = CK.rgba(s.col, 0.5 * j / s.trail.length);
          ctx.lineWidth = p.r * 1.1 * j / s.trail.length;
          ctx.beginPath(); ctx.moveTo(s.trail[j - 1][0], s.trail[j - 1][1]); ctx.lineTo(s.trail[j][0], s.trail[j][1]); ctx.stroke();
        }
      }
      if (p.active || s.flare > 0.05) {
        var gr = p.r * (3 + s.flare * 3), g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, gr);
        g.addColorStop(0, CK.rgba(col, 0.45 + 0.4 * s.flare));
        g.addColorStop(1, CK.rgba(col, 0));
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(p.x, p.y, gr, 0, 6.283); ctx.fill();
      }
      // Lit side towards the sun
      var lx = (cx - p.x), ly = (cy - p.y), ll = Math.hypot(lx, ly) || 1;
      var body = ctx.createRadialGradient(p.x + lx / ll * p.r * 0.4, p.y + ly / ll * p.r * 0.4, p.r * 0.1, p.x, p.y, p.r);
      body.addColorStop(0, CK.rgba(col, alpha));
      body.addColorStop(1, CK.mix(col, 'bg', 0.6, alpha));
      ctx.fillStyle = body;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
      // Context ring, when MOLTamp knows it
      if (s.ctx !== null) {
        ctx.strokeStyle = CK.rgba(s.ctx > 80 ? 'red' : s.ctx > 60 ? 'yellow' : 'text', 0.8 * alpha);
        ctx.lineWidth = Math.max(1, p.r * 0.25);
        ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r * 1.9, p.r * 0.6, -0.35, 0, 6.283 * s.ctx / 100); ctx.stroke();
      }
      // Sub-agents become moons
      for (var m = 0; m < Math.min(3, s.agents); m++) {
        var ma = t * (1.6 + m * 0.7) + m * 2.1, md = p.r * (2 + m * 0.8);
        ctx.fillStyle = CK.rgba('fg', 0.8 * alpha);
        ctx.beginPath(); ctx.arc(p.x + Math.cos(ma) * md, p.y + Math.sin(ma) * md * 0.6, Math.max(1, p.r * 0.28), 0, 6.283); ctx.fill();
      }
      // Waiting for your permission
      if (s.waiting) {
        var pulse = (t * 1.2) % 1;
        ctx.strokeStyle = CK.rgba('magenta', 1 - pulse);
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1.5 + pulse * 3), 0, 6.283); ctx.stroke();
      }
      drawn.push(p);
    }

    ctx.globalCompositeOperation = light ? 'source-over' : 'lighter';
    planets.filter(function (p) { return !p.front; }).forEach(drawPlanet);
    ctx.globalCompositeOperation = 'source-over';

    // The sun: Claude itself, brighter and warmer the busier it is
    var energy = sunInfo[0], sunCol = sunInfo[1], throb = 1 + 0.08 * Math.sin(t * (2 + energy * 5));
    var corona = ctx.createRadialGradient(cx, cy, 0, cx, cy, sunR * 3.2 * throb);
    corona.addColorStop(0, CK.rgba(sunCol, 0.55 * energy + 0.2));
    corona.addColorStop(1, CK.rgba(sunCol, 0));
    ctx.fillStyle = corona;
    ctx.beginPath(); ctx.arc(cx, cy, sunR * 3.2 * throb, 0, 6.283); ctx.fill();
    ctx.fillStyle = CK.mix(sunCol, 'fg', 0.45);
    ctx.beginPath(); ctx.arc(cx, cy, sunR * throb, 0, 6.283); ctx.fill();

    ctx.globalCompositeOperation = light ? 'source-over' : 'lighter';
    planets.filter(function (p) { return p.front; }).forEach(drawPlanet);
    ctx.globalCompositeOperation = 'source-over';

    if (!planets.length) {
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = CK.font(Math.max(9, Math.min(w, h) / 16));
      ctx.fillStyle = CK.rgba('dim', 0.8);
      ctx.fillText('観測中 · waiting for Claude sessions', cx, cy + sunR * 3.4);
    } else if (w > 220 && h > 90) {
      ctx.font = CK.font(9);
      ctx.textBaseline = 'middle';
      planets.forEach(function (p) {
        if (p.quiet && p.s !== picked) return;
        ctx.textAlign = p.x > cx ? 'left' : 'right';
        ctx.fillStyle = CK.rgba('text', p.active ? 0.95 : 0.6);
        ctx.fillText((p.s.name || p.s.id.slice(0, 6)) + ' ' + p.s.calls, p.x + (p.x > cx ? 1 : -1) * (p.r + 6), p.y - p.r - 4);
      });
    }
    CK.resetCtx(ctx);

    var text;
    if (picked && pickedUntil > now && sessions[picked.id]) {
      var ps = picked;
      text = '軌道 · ' + (ps.name || ps.id.slice(0, 6)) + ' · ' + ps.calls + ' calls' + (ps.agents ? ' · ' + ps.agents + ' agents' : '') +
        (ps.ctx !== null ? ' · ctx ' + Math.round(ps.ctx) + '%' : '') + ' · ' + ago(now - ps.last);
    } else {
      var act = planets.filter(function (p) { return p.active; }).sort(function (a, c) { return c.s.last - a.s.last; })[0];
      text = !planets.length ? '軌道 · no session yet' : '軌道 · ' + planets.length + ' session' + (planets.length > 1 ? 's' : '') +
        (act ? ' · ◉ ' + (act.s.name || act.s.id.slice(0, 6)) : ' · all quiet');
    }
    if (text !== lastText) { lastText = text; label.textContent = text; }
  });
})();
</script>
