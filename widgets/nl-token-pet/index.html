<!--
  Token Pet — Night Lounge pack for MOLTamp
  A pixel creature that lives off Claude's work: it munches tokens while Claude writes, gets busy during tool calls, panics on errors, naps when things go quiet and levels up with every finished task and commit, hatching and evolving as it grows. Click it to pet it.
  Author: j0j0 · License: MIT
-->
<div id="cy-root"><canvas id="cy-canvas"></canvas><div id="cy-label"></div></div>

<style>
  #cy-root { position: absolute; inset: 0; overflow: hidden; background: var(--c-chrome-bg); container-type: size; }
  #cy-canvas { display: block; width: 100%; height: 100%; }
  #cy-label {
    position: absolute; left: 8px; bottom: 6px; pointer-events: none; letter-spacing: 0.08em;
    color: var(--c-chrome-dim); text-shadow: 0 0 6px var(--c-chrome-bg);
    font: calc(clamp(8px, 3.4cqw, 12px) * var(--user-text-scale, 1)) 'SF Mono', Menlo, 'Hiragino Sans', monospace;
  }
</style>

<script>
// cyber-kit — shared runtime of the Cyberpunk widget pack (MIT, j0j0).
// Skin colours resolved for canvas use, DPR-aware canvas, pause when hidden, Claude state, telemetry.
var CK = (function () {
  'use strict';

  var hasSdk = typeof window.moltamp !== 'undefined';

  // ------------------------------------------------------------------ skin colours
  var VARS = {
    bg: '--c-chrome-bg', text: '--c-chrome-text', accent: '--c-chrome-accent', dim: '--c-chrome-dim',
    border: '--c-chrome-border', fg: '--t-foreground', termBg: '--t-background', red: '--t-red',
    green: '--t-green', yellow: '--t-yellow', blue: '--t-blue', cyan: '--t-cyan', magenta: '--t-magenta'
  };
  // A colour missing from the skin borrows another skin colour, never a hardcoded value.
  var BORROW = {
    text: ['fg', 'accent'], fg: ['text', 'accent'], accent: ['text', 'fg'], dim: ['text', 'fg'], border: ['dim', 'text'],
    bg: ['termBg'], termBg: ['bg'], red: ['magenta', 'accent'], green: ['cyan', 'accent'], yellow: ['accent', 'red'],
    blue: ['cyan', 'accent'], cyan: ['blue', 'accent'], magenta: ['red', 'accent']
  };
  var probeEl = document.createElement('span');
  probeEl.style.display = 'none';
  (document.body || document.documentElement).appendChild(probeEl);
  var pc = document.createElement('canvas');
  pc.width = pc.height = 1;
  var pctx = pc.getContext('2d', { willReadFrequently: true });
  var rgb = {};
  var c = {};

  // Resolves any CSS colour the skin may use (hex, rgb, var(), color-mix()) to RGB bytes.
  function readVar(name) {
    var raw = getComputedStyle(document.documentElement).getPropertyValue(VARS[name]).trim();
    if (!raw) return null;
    probeEl.style.color = '';
    probeEl.style.color = raw;
    var computed = getComputedStyle(probeEl).color;
    pctx.fillStyle = '#010203';
    pctx.fillStyle = computed;
    if (pctx.fillStyle === '#010203' && computed !== 'rgb(1, 2, 3)') return null;
    pctx.clearRect(0, 0, 1, 1);
    pctx.fillRect(0, 0, 1, 1);
    var d = pctx.getImageData(0, 0, 1, 1).data;
    return [d[0], d[1], d[2]];
  }

  function refreshColors() {
    var name, raw = {};
    for (name in VARS) raw[name] = readVar(name);
    for (name in VARS) {
      var v = raw[name], chain = BORROW[name] || [];
      for (var i = 0; !v && i < chain.length; i++) v = raw[chain[i]];
      if (!v) {
        // Last resort: the host's own text colour, still a skin value.
        probeEl.style.color = '';
        var m = /(\d+)\D+(\d+)\D+(\d+)/.exec(getComputedStyle(document.body || document.documentElement).color) || [0, 128, 128, 128];
        v = [+m[1], +m[2], +m[3]];
      }
      rgb[name] = v;
      c[name] = 'rgb(' + v[0] + ',' + v[1] + ',' + v[2] + ')';
    }
  }
  refreshColors();

  function rgba(name, a) {
    var v = rgb[name] || rgb.text;
    return 'rgba(' + v[0] + ',' + v[1] + ',' + v[2] + ',' + a + ')';
  }

  function mix(a, b, t, alpha) {
    var x = rgb[a] || rgb.text, y = rgb[b] || rgb.text;
    var r = Math.round(x[0] + (y[0] - x[0]) * t), g = Math.round(x[1] + (y[1] - x[1]) * t), bl = Math.round(x[2] + (y[2] - x[2]) * t);
    return alpha === undefined ? 'rgb(' + r + ',' + g + ',' + bl + ')' : 'rgba(' + r + ',' + g + ',' + bl + ',' + alpha + ')';
  }

  function lum(name) {
    var v = rgb[name] || rgb.text;
    return (0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2]) / 255;
  }

  // ------------------------------------------------------------------ sdk wrappers
  // moltamp.poll only: it cleans itself up when the widget unloads (store rule: no raw setInterval).
  function poll(ms, fn) {
    if (hasSdk && moltamp.poll) return moltamp.poll(ms, fn);
    return function () {};
  }

  function subscribe(store, selector, cb) {
    if (!hasSdk || !moltamp.subscribe) return function () {};
    try { return moltamp.subscribe(store, selector, cb) || function () {}; } catch (e) { return function () {}; }
  }

  function call(channel) {
    if (!hasSdk || !moltamp.call) return Promise.reject(new Error('no sdk'));
    try { return Promise.resolve(moltamp.call.apply(moltamp, arguments)); } catch (e) { return Promise.reject(e); }
  }

  // ------------------------------------------------------------------ text scale (Settings > Display)
  var textScale = 1;
  if (hasSdk && moltamp.settings) {
    moltamp.settings.read().then(function (cfg) {
      cfg = cfg || {};
      if (typeof cfg.widgetTextScale === 'number') textScale = cfg.widgetTextScale;
      document.documentElement.style.setProperty('--user-text-scale', String(textScale));
    }).catch(function () { /* first run: no settings */ });
  }

  function font(size, weight) {
    return (weight || 'normal') + ' ' + Math.max(7, size * textScale).toFixed(1) +
      'px "SF Mono", Menlo, "Hiragino Sans", "Hiragino Kaku Gothic ProN", monospace';
  }

  // ------------------------------------------------------------------ Claude shell state
  var STATES = ['idle', 'thinking', 'streaming', 'tool-use', 'permission', 'error', 'complete'];
  var state = { name: 'idle', since: performance.now(), seen: false };
  var stateListeners = [];
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.type !== 'moltamp:push' || d.subscriptionId !== 'shell-state' || STATES.indexOf(d.data) < 0) return;
    var prev = state.name;
    state.name = d.data;
    state.since = performance.now();
    state.seen = true;
    for (var i = 0; i < stateListeners.length; i++) {
      try { stateListeners[i](state.name, prev); } catch (err) { /* keep other listeners alive */ }
    }
  });

  function currentState() {
    // "complete" is a moment, not a mode: fall back to idle after a few seconds.
    if (state.name === 'complete' && performance.now() - state.since > 4000) return 'idle';
    return state.name;
  }

  // ------------------------------------------------------------------ terminal telemetry
  var tel = { bytes: 0, activity: 'idle', level: 0, started: false };
  function telemetry() {
    if (!tel.started) {
      tel.started = true;
      subscribe('telemetry', 'bytesPerSec', function (v) { tel.bytes = Number(v) || 0; });
      subscribe('telemetry', 'activity', function (v) { tel.activity = v || 'idle'; });
    }
    return tel;
  }

  // 0..1 terminal energy, log-scaled bytes plus the activity level, smoothed by the caller's dt.
  function telemetryLevel(dt) {
    var target = Math.min(1, Math.log(1 + tel.bytes) / Math.log(1 + 200000)) * 0.75 +
      (tel.activity === 'high' ? 0.35 : tel.activity === 'low' ? 0.15 : 0);
    tel.level += (Math.min(1, target) - tel.level) * (1 - Math.exp(-(dt || 0.016) / 0.5));
    return tel.level;
  }

  // ------------------------------------------------------------------ Claude Code hook events
  // event.events is a ring buffer of the last ~200 hook payloads from every session; callers only
  // want what is new, so entries are de-duplicated by timestamp, hook, tool and session.
  var evSeen = {}, evQueue = [], evListeners = [], evStarted = false;
  function eventKey(e) { return [e._ts, e._hook || e.hook_event_name, e.tool_name, e._session || e.session_id].join('|'); }
  function onEvents(cb) {
    evListeners.push(cb);
    if (evStarted) return;
    evStarted = true;
    var first = true;
    subscribe('event', 'events', function (v) {
      var list = Array.isArray(v) ? v : v && typeof v === 'object' ? Object.keys(v).map(function (k) { return v[k]; }) : [];
      var fresh = [];
      for (var i = 0; i < list.length; i++) {
        var e = list[i];
        if (!e || typeof e !== 'object') continue;
        var k = eventKey(e);
        if (evSeen[k]) continue;
        evSeen[k] = true;
        evQueue.push(k);
        fresh.push(e);
      }
      while (evQueue.length > 800) delete evSeen[evQueue.shift()];
      var history = first;
      first = false;
      if (fresh.length) for (var j = 0; j < evListeners.length; j++) {
        try { evListeners[j](fresh, history); } catch (err) { /* keep other listeners alive */ }
      }
    });
  }

  // A failure is read from the tool's response or the hook name, never from its input
  // (a command that merely contains the word "error" is not a failure).
  function isFailure(e) {
    var hook = String(e.hook_event_name || e._hook || '');
    if (/fail|error/i.test(hook)) return true;
    var r = e.tool_response;
    if (!r || typeof r !== 'object') return false;
    if (r.is_error === true || r.isError === true || r.success === false || r.interrupted === true) return true;
    var code = r.exitCode !== undefined ? r.exitCode : r.exit_code !== undefined ? r.exit_code : r.code;
    if (typeof code === 'number' && code !== 0) return true;
    return typeof r.error === 'string' && r.error.length > 0;
  }

  function toolLabel(name) {
    name = String(name || '?');
    if (name.indexOf('mcp__') !== 0) return name;
    // mcp__plugin_chrome-devtools-mcp_chrome-devtools__take_screenshot -> chrome-devtools
    var server = name.split('__')[1] || 'mcp';
    server = server.replace(/^plugin_/, '').replace(/^claude_ai_/, '').split('_').pop();
    return 'mcp:' + server;
  }

  // ------------------------------------------------------------------ Claude session stats
  // In MOLTamp 3.2.2, telemetry.read hands over Claude's raw status line payload (context_window, cost,
  // rate_limits) and stats.read only holds lifetime aggregates, contrary to the docs. Both are read so the
  // documented shape (contextPct, cost, rate5h…) still works if a later version fixes stats.read.
  // Resolves to a normalised object, or null when no session data is flowing.
  function sessNum(v) { var n = typeof v === 'string' ? parseFloat(v) : v; return typeof n === 'number' && isFinite(n) ? n : null; }
  function sessPick(o, paths) {
    for (var i = 0; i < paths.length; i++) {
      var v = o, parts = paths[i].split('.');
      for (var j = 0; j < parts.length && v !== null && v !== undefined; j++) v = v[parts[j]];
      v = sessNum(v);
      if (v !== null) return v;
    }
    return null;
  }
  function normaliseSession(s) {
    var rl = s.rate_limits || s.rateLimits || {}, m = s.model;
    var out = {
      contextPct: sessPick(s, ['context_window.used_percentage', 'contextPct', 'context_pct']),
      cost: sessPick(s, ['cost.total_cost_usd', 'cost', 'costUsd', 'cost_usd']),
      tokensIn: sessPick(s, ['context_window.total_input_tokens', 'tokensIn', 'tokens_in']),
      tokensOut: sessPick(s, ['context_window.total_output_tokens', 'tokensOut', 'tokens_out']),
      apiMs: sessPick(s, ['cost.total_api_duration_ms', 'apiTime']),
      model: m && typeof m === 'object' ? String(m.display_name || m.id || '') : String(m || ''),
      modelId: m && typeof m === 'object' ? String(m.id || '') : String(m || ''),
      rate5h: rl.five_hour !== undefined ? rl.five_hour : s.rate5h !== undefined ? s.rate5h : null,
      rate7d: rl.seven_day !== undefined ? rl.seven_day : s.rate7d !== undefined ? s.rate7d : null,
      sessionId: String(s.session_id || s.sessionId || ''),
      raw: s
    };
    var any = out.contextPct !== null || out.cost !== null || out.tokensIn !== null || out.rate5h !== null;
    return any ? out : null;
  }
  // telemetry.read returns whichever session refreshed its status line last; with several Claude sessions open,
  // stay on one while it keeps reporting (within a minute) so readings don't flip between sessions.
  var sessCache = {}, sessFocus = '';
  function readSession() {
    return call('telemetry.read').catch(function () { return null; }).then(function (t) {
      var fromStatus = t && typeof t === 'object' ? normaliseSession(t) : null;
      if (fromStatus) {
        var id = fromStatus.sessionId || 'session', now = Date.now();
        sessCache[id] = { s: fromStatus, at: now };
        var cur = sessCache[sessFocus];
        if (!cur || now - cur.at > 60000) sessFocus = id;
        Object.keys(sessCache).forEach(function (k) { if (now - sessCache[k].at > 3600e3) delete sessCache[k]; });
        return sessCache[sessFocus].s;
      }
      return call('stats.read').then(function (s) { return s && typeof s === 'object' ? normaliseSession(s) : null; })
        .catch(function () { return null; });
    });
  }

  // ------------------------------------------------------------------ canvas + loop
  // Paused while off screen (hidden tab) or while the whole page is hidden; both must clear to resume.
  var onScreen = true, pageVisible = !document.hidden, watching = false;
  function visibleNow() { return onScreen && pageVisible; }
  function watch(el) {
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (entries) { onScreen = entries[entries.length - 1].isIntersecting; }).observe(el);
    }
    if (!watching) {
      watching = true;
      document.addEventListener('visibilitychange', function () { pageVisible = !document.hidden; });
    }
  }

  function surface(el) {
    var s = { el: el, ctx: el.getContext('2d'), w: 0, h: 0, dpr: 1, resized: true };
    s.fit = function () {
      var dpr = Math.min(2, window.devicePixelRatio || 1);
      var w = Math.max(1, el.clientWidth), h = Math.max(1, el.clientHeight);
      if (w !== s.w || h !== s.h || dpr !== s.dpr) {
        s.w = w; s.h = h; s.dpr = dpr;
        el.width = Math.round(w * dpr);
        el.height = Math.round(h * dpr);
        s.resized = true;
      }
      s.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return s;
    };
    watch(el);
    return s;
  }

  function loop(fn, fpsCap) {
    var last = 0, lastDraw = 0, logged = false, cap = fpsCap || 60;
    function frame(now) {
      requestAnimationFrame(frame);
      if (!visibleNow()) { last = 0; return; }
      if (now - lastDraw < 1000 / cap - 2) return;
      var dt = last ? Math.min((now - last) / 1000, 0.1) : 1 / 60;
      last = lastDraw = now;
      try { fn(dt, now / 1000); } catch (e) {
        if (!logged) { logged = true; console.error('[cyber-kit]', e); }
      }
    }
    requestAnimationFrame(frame);
  }

  function resetCtx(ctx) {
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.shadowBlur = 0;
    ctx.lineWidth = 1;
    ctx.setLineDash([]);
  }

  // ------------------------------------------------------------------ small utils
  function hash(str) {
    var h = 2166136261;
    str = String(str);
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return ((h >>> 0) % 100000) / 100000;
  }

  function prng(seed) {
    var a = (seed * 4294967296) >>> 0 || 1;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = Math.imul(a ^ (a >>> 15), a | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function fmtBytes(b) {
    if (hasSdk && moltamp.fmt && moltamp.fmt.bytes) return moltamp.fmt.bytes(b);
    var u = ['B', 'KB', 'MB', 'GB'], i = 0;
    while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
    return b.toFixed(i ? 1 : 0) + ' ' + u[i];
  }

  // Skin switches update CSS variables live; re-resolve once a second.
  poll(1000, refreshColors);

  return {
    c: c, rgb: rgb, rgba: rgba, mix: mix, lum: lum, refreshColors: refreshColors,
    poll: poll, subscribe: subscribe, call: call, font: font,
    state: currentState, stateInfo: state, onState: function (cb) { stateListeners.push(cb); },
    telemetry: telemetry, telemetryLevel: telemetryLevel,
    onEvents: onEvents, isFailure: isFailure, toolLabel: toolLabel, readSession: readSession,
    surface: surface, loop: loop, resetCtx: resetCtx, isVisible: visibleNow,
    hash: hash, prng: prng, fmtBytes: fmtBytes,
    meta: (hasSdk && moltamp.meta) || { context: 'panel' }
  };
})();

// Token Pet: an original pixel creature fed by Claude's activity; XP from finished tasks and commits.
(function () {
  'use strict';
  var canvas = document.getElementById('cy-canvas');
  var S = CK.surface(canvas);
  var label = document.getElementById('cy-label');
  var DAY_HUNGER = 100 / (8 * 3600); // a full belly lasts about eight hours
  var SLEEP_AFTER = 45; // seconds of calm before a nap

  // ------------------------------------------------------------------ sprites (16x16, eyes and mouth drawn on top)
  // o outline, b body, l belly, a antenna, t glowing tip, s spot, f foot, w wing
  var SPRITES = [
    { name: 'egg', eyes: null, mouth: null, rows: [
      '................', '.......oo.......', '.....oobboo.....', '....obbbbbbo....', '...obbsbbbbbo...', '...obbbbbbbbo...',
      '..obbbbbbbsbbo..', '..obbbbbbbbbbo..', '..obsbbbbbbbbo..', '..obbbbbbbbsbo..', '..obbbbbbbbbbo..', '..obbbsbbbbbbo..',
      '...obbbbbbbbo...', '....oobbbboo....', '......oooo......', '................'] },
    { name: 'blip', eyes: [6, 5, 9], mouth: [9, 7], rows: [
      '................', '.......tt.......', '.......aa.......', '.....oooooo.....', '....obbbbbbo....', '...obbbbbbbbo...',
      '...obbbbbbbbo...', '..obbbbbbbbbbo..', '..obbbbbbbbbbo..', '..obbllllllbbo..', '..obbllllllbbo..', '...obbllllbbo...',
      '....obbbbbbo....', '....off..ffo....', '................', '................'] },
    { name: 'byte', eyes: [6, 4, 10], mouth: [9, 7], rows: [
      '.......tt.......', '..oo...aa...oo..', '..obo.oooo.obo..', '..obbobbbbobbo..', '...obbbbbbbbo...', '..obbbbbbbbbbo..',
      '..obbbbbbbbbbo..', '.obbbbbbbbbbbbo.', '.obbbbbbbbbbbbo.', 'obobbllllllbbobo', 'obobbllllllbbobo', '.o.obbllllbbo.o.',
      '....obbbbbbo....', '...obbo..obbo...', '...offo..offo...', '....oo....oo....'] },
    { name: 'kernel', eyes: [6, 4, 10], mouth: [9, 7], rows: [
      '....t..tt..t....', '....a..aa..a....', '....oooooooo....', '...obbbbbbbbo...', '..obbbbbbbbbbo..', '.obbbbbbbbbbbbo.',
      '.obbbbbbbbbbbbo.', 'wobbbbbbbbbbbbow', 'wwobbllllllbboww', 'wwobllllllllboww', '.wobllllllllbow.', '..obbllllllbbo..',
      '...obbbbbbbbo...', '...obbo..obbo...', '...offo..offo...', '....oo....oo....'] }
  ];
  var STAGE_NAMES = ['egg', 'blip', 'byte', 'kernel'];

  function levelOf(xp) { return 1 + Math.floor(Math.sqrt(xp / 4)); }
  function xpFor(level) { return 4 * (level - 1) * (level - 1); }
  function stageOf(level) { return level < 2 ? 0 : level < 5 ? 1 : level < 10 ? 2 : 3; }

  // ------------------------------------------------------------------ persistent pet
  var pet = { name: 'Bit', xp: 0, born: Date.now(), hunger: 80, savedAt: Date.now() };
  var loaded = false, saveTimer = null, hungerBand = 4;
  function hasSettings() { return typeof moltamp !== 'undefined' && moltamp.settings; }
  if (hasSettings()) {
    moltamp.settings.read().then(function (c) {
      var p = c && c.pet;
      if (p && typeof p === 'object') {
        pet.name = typeof p.name === 'string' && p.name ? p.name.slice(0, 12) : pet.name;
        pet.xp = Math.max(0, Number(p.xp) || 0);
        pet.born = Number(p.born) || pet.born;
        var away = Math.max(0, (Date.now() - (Number(p.savedAt) || Date.now())) / 1000);
        pet.hunger = Math.max(0, Math.min(100, (Number(p.hunger) || 0) - away * DAY_HUNGER));
      }
      hungerBand = Math.floor(pet.hunger / 20);
      loaded = true;
    }).catch(function () { loaded = true; });
  } else {
    loaded = true;
  }

  // Writes are rare and batched: only XP changes and big hunger steps are saved.
  function scheduleSave() {
    if (!hasSettings() || !loaded) return;
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      saveTimer = null;
      pet.savedAt = Date.now();
      moltamp.settings.read().then(function (c) {
        var next = Object.assign({}, c || {}, { pet: { name: pet.name, xp: pet.xp, born: pet.born, hunger: Math.round(pet.hunger), savedAt: pet.savedAt } });
        return moltamp.settings.write(next);
      }).catch(function () { /* try again on the next change */ });
    }, 4000);
  }

  // ------------------------------------------------------------------ effects
  var floaters = [], sparkles = [], pellets = [], zs = [];
  var jump = 0, flashRed = 0, petted = 0, levelUp = 0, chomp = 0, pelletClock = 0, zClock = 0, lastActive = performance.now();
  var t = 0, lastText = '';

  function gainXp(n, why) {
    if (!loaded) return;
    var before = levelOf(pet.xp);
    pet.xp += n;
    floaters.push({ text: '+' + n + ' XP' + (why ? ' ' + why : ''), age: 0, col: 'yellow' });
    var after = levelOf(pet.xp);
    if (after > before) {
      levelUp = 2.2;
      for (var i = 0; i < 24; i++) sparkles.push({ a: Math.random() * 6.283, v: 0.6 + Math.random(), age: 0, col: ['yellow', 'cyan', 'magenta'][i % 3] });
    }
    scheduleSave();
  }

  CK.onState(function (now, prev) {
    lastActive = performance.now();
    if (now === 'complete' && prev !== 'complete') { jump = 1; gainXp(1); }
    if (now === 'error') flashRed = 1;
  });

  // Every fresh tool call is a crumb.
  CK.onEvents(function (fresh, history) {
    if (history) return;
    for (var i = 0; i < fresh.length; i++) {
      if (/^Pre/i.test(String(fresh[i].hook_event_name || fresh[i]._hook || ''))) { pet.hunger = Math.min(100, pet.hunger + 0.6); lastActive = performance.now(); }
    }
  });

  // New commits: +3 XP each. The first payload only records what already exists.
  var known = null;
  CK.subscribe('git', 'status', function (s) {
    if (!s || typeof s !== 'object' || !Array.isArray(s.recentCommits)) return;
    var hashes = s.recentCommits.map(function (c) { return String(c && c.hash || '').slice(0, 7); }).filter(Boolean);
    if (known === null) { known = {}; hashes.forEach(function (x) { known[x] = true; }); return; }
    hashes.forEach(function (x) {
      if (known[x]) return;
      known[x] = true;
      jump = 1;
      gainXp(3, 'commit');
    });
  });

  // Left button only: right-click and ctrl-click belong to MOLTamp's slot menu.
  canvas.addEventListener('click', function (e) {
    if (e.button !== 0 || e.ctrlKey) return;
    petted = 1.6;
    lastActive = performance.now();
    floaters.push({ text: '♥', age: 0, col: 'red', big: true });
  });

  // ------------------------------------------------------------------ drawing
  function palette(light, hungry) {
    var body = hungry ? CK.mix('accent', 'dim', 0.35) : CK.c.accent;
    return {
      o: light ? CK.mix('accent', 'fg', 0.55) : CK.mix('accent', 'bg', 0.55),
      b: body, h: body,
      l: CK.mix(hungry ? 'dim' : 'accent', light ? 'bg' : 'fg', 0.45),
      a: light ? CK.mix('accent', 'fg', 0.55) : CK.mix('accent', 'bg', 0.4),
      t: CK.c.yellow, s: CK.c.magenta, f: CK.mix('accent', light ? 'fg' : 'bg', 0.3), w: CK.rgba('cyan', 0.85),
      eye: light ? CK.mix('fg', 'bg', 0.05) : CK.mix('bg', 'fg', 0.05), glint: light ? CK.c.bg : CK.c.fg, cheek: CK.rgba('red', 0.55)
    };
  }

  function drawSprite(ctx, sp, ox, oy, px, sy, pal) {
    for (var r = 0; r < 16; r++) {
      var row = sp.rows[r], y = oy + (r - 15) * px * sy;
      for (var c = 0; c < 16; c++) {
        var ch = row.charAt(c);
        if (ch === '.') continue;
        if (ch === 't') { ctx.fillStyle = CK.rgba('yellow', 0.3); ctx.fillRect(ox + c * px - px * 0.5, y - px * 0.5, px * 2, px * 2 * sy); }
        ctx.fillStyle = pal[ch] || pal.b;
        ctx.fillRect(ox + c * px, y, px + 0.5, px * sy + 0.5);
      }
    }
  }

  // Eyes: open (with blink), closed, happy arcs, panic crosses, sad droop, looking up.
  function drawFace(ctx, sp, ox, oy, px, sy, pal, mood) {
    if (!sp.eyes) return;
    var er = sp.eyes[0], cols = [sp.eyes[1], sp.eyes[2]];
    var y = oy + (er - 15) * px * sy;
    var blink = Math.sin(t * 0.9) > 0.985;
    for (var i = 0; i < 2; i++) {
      var x = ox + cols[i] * px;
      ctx.fillStyle = pal.eye;
      if (mood === 'sleep' || (blink && mood === 'calm')) ctx.fillRect(x, y + px * sy, px * 2, px * 0.6);
      else if (mood === 'happy') { ctx.fillRect(x, y + px * sy * 0.6, px * 0.6, px * 0.6); ctx.fillRect(x + px * 0.6, y, px * 0.8, px * 0.6); ctx.fillRect(x + px * 1.4, y + px * sy * 0.6, px * 0.6, px * 0.6); }
      else if (mood === 'panic') { ctx.fillRect(x, y, px * 0.7, px * 0.7); ctx.fillRect(x + px * 1.3, y, px * 0.7, px * 0.7); ctx.fillRect(x + px * 0.65, y + px * 0.65, px * 0.7, px * 0.7); ctx.fillRect(x, y + px * 1.3, px * 0.7, px * 0.7); ctx.fillRect(x + px * 1.3, y + px * 1.3, px * 0.7, px * 0.7); }
      else if (mood === 'sad') ctx.fillRect(x, y + px * sy * 0.8, px * 2, px * sy * 1.2);
      else {
        var lift = mood === 'think' ? -px * 0.6 : 0;
        ctx.fillRect(x, y + lift, px * 2, px * 2 * sy);
        ctx.fillStyle = pal.glint;
        ctx.fillRect(x + px * 0.2, y + lift + px * 0.2, px * 0.6, px * 0.6);
      }
    }
    if (mood === 'happy' || petted > 0) {
      ctx.fillStyle = pal.cheek;
      ctx.fillRect(ox + (cols[0] - 1) * px, y + px * 2.2 * sy, px * 1.4, px * 0.8);
      ctx.fillRect(ox + (cols[1] + 1.6) * px, y + px * 2.2 * sy, px * 1.4, px * 0.8);
    }
    // Mouth
    var mr = sp.mouth[0], mc = sp.mouth[1], my = oy + (mr - 15) * px * sy, mx = ox + mc * px;
    ctx.fillStyle = pal.eye;
    if (mood === 'eat') {
      var open = chomp > 0.5;
      ctx.fillRect(mx, my, px * 2, open ? px * 1.6 : px * 0.5);
    } else if (mood === 'panic' || mood === 'alert') {
      ctx.fillRect(mx + px * 0.4, my, px * 1.2, px * 1.2);
    } else if (mood === 'sad') {
      ctx.fillRect(mx, my + px * 0.6, px * 0.6, px * 0.5); ctx.fillRect(mx + px * 0.5, my, px, px * 0.5); ctx.fillRect(mx + px * 1.4, my + px * 0.6, px * 0.6, px * 0.5);
    } else if (mood !== 'sleep') {
      ctx.fillRect(mx, my, px * 0.6, px * 0.5); ctx.fillRect(mx + px * 0.5, my + px * 0.5, px, px * 0.5); ctx.fillRect(mx + px * 1.4, my, px * 0.6, px * 0.5);
    }
  }

  function bubble(ctx, x, y, s, text, col) {
    ctx.fillStyle = CK.rgba('bg', 0.85);
    ctx.strokeStyle = CK.rgba(col, 0.9);
    ctx.lineWidth = Math.max(1, s * 0.06);
    ctx.beginPath(); ctx.arc(x, y, s, 0, 6.283); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(x - s * 1.05, y + s * 1.05, s * 0.22, 0, 6.283); ctx.fill(); ctx.stroke();
    ctx.fillStyle = CK.c[col];
    ctx.font = CK.font(s * 1.05, 'bold');
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x, y + s * 0.05);
  }

  function hud(ctx, x, y, size, level, align) {
    var hearts = Math.ceil(pet.hunger / 20), next = xpFor(level + 1), cur = xpFor(level);
    ctx.textAlign = align;
    ctx.textBaseline = 'top';
    ctx.font = CK.font(size, 'bold');
    ctx.fillStyle = CK.c.text;
    ctx.fillText(pet.name + '  Lv ' + level, x, y);
    ctx.font = CK.font(size * 0.95);
    var hs = '';
    for (var i = 0; i < 5; i++) hs += i < hearts ? '♥' : '♡';
    ctx.fillStyle = pet.hunger < 25 ? CK.c.red : CK.c.magenta;
    ctx.fillText(hs, x, y + size * 1.35);
    var bw = size * 6, bh = Math.max(2, size * 0.28), bx = align === 'right' ? x - bw : x, by = y + size * 2.75;
    ctx.fillStyle = CK.rgba('dim', 0.25);
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = CK.c.yellow;
    ctx.fillRect(bx, by, bw * Math.min(1, (pet.xp - cur) / Math.max(1, next - cur)), bh);
  }

  CK.loop(function (dt) {
    S.fit();
    S.resized = false;
    var ctx = S.ctx, w = S.w, h = S.h, light = CK.lum('bg') > 0.5;
    t += dt;
    var st = CK.state(), calmFor = (performance.now() - lastActive) / 1000;
    pet.hunger = Math.max(0, pet.hunger - dt * DAY_HUNGER);
    var band = Math.floor(pet.hunger / 20);
    if (band !== hungerBand) { hungerBand = band; scheduleSave(); }

    var hungry = pet.hunger < 20;
    var mood = petted > 0 || jump > 0 ? 'happy' : st === 'error' ? 'panic' : st === 'permission' ? 'alert' : st === 'streaming' ? 'eat'
      : st === 'thinking' ? 'think' : st === 'tool-use' ? 'busy' : st === 'idle' && calmFor > SLEEP_AFTER ? 'sleep' : hungry ? 'sad' : 'calm';
    if (st !== 'idle' && st !== 'complete') lastActive = performance.now();

    ctx.fillStyle = CK.c.bg;
    ctx.fillRect(0, 0, w, h);
    if (flashRed > 0.01) {
      ctx.fillStyle = CK.rgba('red', flashRed * 0.25);
      ctx.fillRect(0, 0, w, h);
      flashRed *= Math.exp(-dt * 3);
    }

    var level = levelOf(pet.xp), sp = SPRITES[stageOf(level)], pal = palette(light, hungry);
    var wide = w > h * 1.8;
    var px = Math.max(2, Math.floor(Math.min(wide ? h * 0.68 : h * 0.5, w * 0.55) / 16));
    var cx = wide ? w * 0.42 : w / 2, ground = wide ? h * 0.88 : h * 0.72;

    // Body motion per mood
    var sy = 1 + Math.sin(t * (mood === 'sleep' ? 1.2 : 2.4)) * (mood === 'sleep' ? 0.04 : 0.025), dx = 0, dy = 0;
    if (jump > 0) { dy = -Math.abs(Math.sin(jump * Math.PI * 2)) * px * 5; jump = Math.max(0, jump - dt * 0.9); }
    else if (mood === 'calm') dy = -Math.max(0, Math.sin(t * 1.4)) * px * 0.6;
    else if (mood === 'alert') dy = -Math.abs(Math.sin(t * 6)) * px * 1.5;
    if (mood === 'panic') dx = Math.sin(t * 45) * px * 0.7;
    if (sp.name === 'egg') { dx = Math.sin(t * (mood === 'busy' || mood === 'eat' ? 9 : 2)) * px * 0.4; dy = Math.min(dy, 0) * 0.3; }
    var ox = cx - 8 * px + dx, oy = ground + dy;

    // Shadow
    ctx.fillStyle = CK.rgba(light ? 'fg' : 'dim', 0.18);
    ctx.beginPath(); ctx.ellipse(cx, ground + px * 0.6, px * 6 * (1 + dy / (px * 20)), px * 1.2, 0, 0, 6.283); ctx.fill();

    drawSprite(ctx, sp, ox, oy, px, sy, pal);
    drawFace(ctx, sp, ox, oy, px, sy, pal, mood);

    // Mood props
    var headX = cx + px * 5, headY = oy - 16 * px * sy;
    if (mood === 'think') {
      var dots = '.'.repeat(1 + Math.floor(t * 2.5) % 3);
      bubble(ctx, headX + px * 3, headY + px, px * 2.6, dots, 'cyan');
    } else if (mood === 'alert') {
      bubble(ctx, headX + px * 3, headY + px, px * 2.6, '!', 'yellow');
    } else if (mood === 'panic') {
      ctx.fillStyle = CK.rgba('cyan', 0.8);
      for (var d = 0; d < 3; d++) {
        var ph = (t * 1.5 + d / 3) % 1;
        ctx.fillRect(cx + (d - 1) * px * 6, headY + px * 3 + ph * px * 8, px * 0.8, px * 1.4);
      }
    } else if (mood === 'busy') {
      // A little wrench that taps away, throwing sparks.
      var hx = cx + px * 8.5, hy = oy - px * 6, ang = -0.6 + Math.abs(Math.sin(t * 9)) * 1.1;
      ctx.save(); ctx.translate(hx, hy); ctx.rotate(ang);
      ctx.fillStyle = CK.mix('dim', 'fg', 0.4);
      ctx.fillRect(-px * 0.4, -px * 4, px * 0.8, px * 4);
      ctx.fillRect(-px * 1.2, -px * 5, px * 2.4, px * 1.2);
      ctx.restore();
      if (Math.sin(t * 9) > 0.9) for (var k = 0; k < 3; k++) sparkles.push({ x: hx + px * 3, y: hy, a: Math.random() * 6.283, v: 0.5 + Math.random(), age: 0, col: 'yellow', small: true });
    }
    if (mood === 'sleep') {
      zClock -= dt;
      if (zClock <= 0) { zClock = 1.1; zs.push({ age: 0 }); }
    }
    for (var zi = zs.length - 1; zi >= 0; zi--) {
      var z = zs[zi];
      z.age += dt;
      if (z.age > 3 || mood !== 'sleep') { zs.splice(zi, 1); continue; }
      ctx.fillStyle = CK.rgba('text', 1 - z.age / 3);
      ctx.font = CK.font(px * (2 + z.age), 'bold');
      ctx.textAlign = 'left';
      ctx.fillText('z', headX + z.age * px * 2, headY - z.age * px * 3);
    }

    // Token pellets fly into the mouth while Claude streams.
    if (mood === 'eat' && sp.mouth) {
      pelletClock -= dt;
      if (pelletClock <= 0) { pelletClock = 0.3; pellets.push({ x: w + px, y: oy - (15 - sp.mouth[0]) * px * sy + (Math.random() - 0.5) * px * 6, col: ['cyan', 'yellow', 'magenta', 'green'][(Math.random() * 4) | 0] }); }
    }
    var mouthX = ox + (sp.mouth ? sp.mouth[1] + 1 : 8) * px, mouthY = oy - (15 - (sp.mouth ? sp.mouth[0] : 8)) * px * sy;
    chomp = Math.max(0, chomp - dt * 4);
    for (var pi = pellets.length - 1; pi >= 0; pi--) {
      var p = pellets[pi];
      p.x += (mouthX - p.x) * Math.min(1, dt * 4);
      p.y += (mouthY - p.y) * Math.min(1, dt * 4);
      if (Math.abs(p.x - mouthX) < px * 1.5) { pellets.splice(pi, 1); chomp = 1; pet.hunger = Math.min(100, pet.hunger + 1); continue; }
      ctx.fillStyle = CK.c[p.col];
      ctx.fillRect(p.x - px * 0.6, p.y - px * 0.6, px * 1.2, px * 1.2);
    }
    if (mood !== 'eat' && pellets.length) pellets.length = 0;

    // Sparkles, floating texts, level-up banner
    for (var si = sparkles.length - 1; si >= 0; si--) {
      var s2 = sparkles[si];
      s2.age += dt;
      if (s2.age > (s2.small ? 0.4 : 1.2)) { sparkles.splice(si, 1); continue; }
      var sx = (s2.x !== undefined ? s2.x : cx) + Math.cos(s2.a) * s2.v * s2.age * px * (s2.small ? 12 : 18);
      var sy2 = (s2.y !== undefined ? s2.y : oy - 8 * px) + Math.sin(s2.a) * s2.v * s2.age * px * (s2.small ? 12 : 18);
      ctx.fillStyle = CK.c[s2.col];
      ctx.fillRect(sx, sy2, px * (s2.small ? 0.5 : 0.8), px * (s2.small ? 0.5 : 0.8));
    }
    for (var fi = floaters.length - 1; fi >= 0; fi--) {
      var f = floaters[fi];
      f.age += dt;
      if (f.age > 1.8) { floaters.splice(fi, 1); continue; }
      ctx.globalAlpha = 1 - f.age / 1.8;
      ctx.fillStyle = CK.c[f.col];
      // Floating texts rise from the right of the head, clear of the HUD in the top-left corner.
      ctx.font = CK.font(f.big ? px * 3 : Math.max(9, px * 1.8), 'bold');
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(f.text, cx + px * (f.big ? 4 : 6.5), Math.max(px * 2, oy - 13 * px - f.age * px * 4));
      ctx.globalAlpha = 1;
    }
    if (levelUp > 0) {
      levelUp -= dt;
      ctx.fillStyle = Math.sin(t * 12) > 0 ? CK.c.yellow : CK.c.accent;
      ctx.font = CK.font(Math.max(10, px * 2.4), 'bold');
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('LEVEL UP!', cx, Math.max(wide ? px * 2 : 12 + Math.min(14, h * 0.07) * 3.6, oy - 19 * px));
    }
    petted = Math.max(0, petted - dt);

    // HUD
    var hs = Math.max(9, Math.min(14, (wide ? h * 0.13 : h * 0.07), w * 0.05));
    if (wide) hud(ctx, cx + px * 12, h / 2 - hs * 1.6, hs, level, 'left');
    else hud(ctx, 8, 8, hs, level, 'left');
    CK.resetCtx(ctx);

    var words = { happy: 'yay!', panic: 'panic!', alert: 'needs you!', eat: 'munching', think: 'thinking', busy: 'busy', sleep: 'zzz', sad: 'hungry', calm: 'chilling' };
    var text = 'ペット · ' + STAGE_NAMES[stageOf(level)] + ' · ' + words[mood] + ' · ' + pet.xp + ' XP';
    if (text !== lastText) { lastText = text; label.textContent = text; }
  });
})();
</script>
