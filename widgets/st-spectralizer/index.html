    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    var fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { tex: t, fb: fb };
  }

  // ---------------------------------------------------------------- programs
  var VS = isGL2
    ? '#version 300 es\nlayout(location = 0) in vec2 pos;\nvoid main() { gl_Position = vec4(pos, 0.0, 1.0); }\n'
    : 'attribute vec2 pos;\nvoid main() { gl_Position = vec4(pos, 0.0, 1.0); }\n';

  function samplerType(inp) {
    if (!inp) return 'sampler2D';
    if (inp.kind === 'gen' && inp.gen === 'sky') return 'samplerCube';
    if (inp.kind === 'gen' && inp.gen === 'volume') return 'sampler3D';
    return 'sampler2D';
  }

  function header(pass) {
    var h;
    if (isGL2) {
      h = '#version 300 es\nprecision highp float;\nprecision highp int;\nprecision highp sampler2D;\nprecision highp sampler3D;\nprecision highp samplerCube;\n';
    } else {
      h = (ext.deriv ? '#extension GL_OES_standard_derivatives : enable\n' : '') +
        (ext.lod ? '#extension GL_EXT_shader_texture_lod : enable\n' : '') +
        'precision highp float;\nprecision highp int;\n';
    }
    h += '#define HW_PERFORMANCE ' + (opts.hwPerformance === 0 ? 0 : 1) + '\n';
    h += 'uniform vec3 iResolution;\nuniform float iTime;\nuniform float iTimeDelta;\nuniform float iFrameRate;\n' +
      'uniform int iFrame;\nuniform float iChannelTime[4];\nuniform vec3 iChannelResolution[4];\nuniform vec4 iMouse;\n' +
      'uniform vec4 iDate;\nuniform float iSampleRate;\n' +
      '// MOLTamp extras: x = activity energy 0..1, y = time speed, z = state code, w = event pulse\nuniform vec4 iMoltamp;\n';
    for (var c = 0; c < 4; c++) h += 'uniform ' + samplerType(pass.byChannel[c]) + ' iChannel' + c + ';\n';
    if (isGL2) {
      h += 'out vec4 st_FragColor;\n';
    } else {
      h += 'vec4 texture(sampler2D s, vec2 c) { return texture2D(s, c); }\n' +
        'vec4 texture(sampler2D s, vec2 c, float b) { return texture2D(s, c, b); }\n' +
        'vec4 texture(samplerCube s, vec3 c) { return textureCube(s, c); }\n' +
        (ext.lod ? 'vec4 textureLod(sampler2D s, vec2 c, float l) { return texture2DLodEXT(s, c, l); }\n' : '');
    }
    return h;
  }

  function footer(pass) {
    var outVar = isGL2 ? 'st_FragColor' : 'gl_FragColor';
    return '\nvoid main() {\n  vec4 c = vec4(0.0, 0.0, 0.0, 1.0);\n  mainImage(c, gl_FragCoord.xy);\n' +
      (pass.output === 'image' ? '  c.w = 1.0;\n' : '') + '  ' + outVar + ' = c;\n}\n';
  }

  function countLines(s) { return s.split('\n').length - 1; }

  var vsObj = gl.createShader(gl.VERTEX_SHADER);
  gl.shaderSource(vsObj, VS);
  gl.compileShader(vsObj);

  var compileStart = performance.now();
  var passes = cfg.passes.map(function (p) {
    var pass = { name: p.name, output: p.output, inputs: p.inputs || [], byChannel: {} };
    pass.inputs.forEach(function (inp) { pass.byChannel[inp.channel] = inp; });
    var head = header(pass) + (cfg.common ? cfg.common + '\n' : '');
    pass.lineOffset = countLines(head);
    pass.fs = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(pass.fs, head + p.code + footer(pass));
    gl.compileShader(pass.fs);
    pass.prog = gl.createProgram();
    gl.attachShader(pass.prog, vsObj);
    gl.attachShader(pass.prog, pass.fs);
    gl.bindAttribLocation(pass.prog, 0, 'pos');
    gl.linkProgram(pass.prog);
    return pass;
  });

  function remapLog(pass, log) {
    // Report line numbers relative to the pass source (Common lines included in the offset).
    return log.replace(/ERROR: 0:(\d+)/g, function (_, n) { return 'line ' + (Number(n) - pass.lineOffset); });
  }

  function finishLink() {
    for (var i = 0; i < passes.length; i++) {
      var p = passes[i];
      if (!gl.getProgramParameter(p.prog, gl.LINK_STATUS)) {
        var log = gl.getShaderInfoLog(p.fs) || gl.getProgramInfoLog(p.prog) || 'link failed';
        fail('[' + p.name + '] ' + remapLog(p, log).slice(0, 600));
        return false;
      }
      p.u = {};
      ['iResolution', 'iTime', 'iTimeDelta', 'iFrameRate', 'iFrame', 'iMouse', 'iDate', 'iSampleRate', 'iMoltamp'].forEach(function (n) {
        p.u[n] = gl.getUniformLocation(p.prog, n);
      });
      p.u.iChannelTime = gl.getUniformLocation(p.prog, 'iChannelTime');
      p.u.iChannelResolution = gl.getUniformLocation(p.prog, 'iChannelResolution');
      p.u.ch = [0, 1, 2, 3].map(function (c) { return gl.getUniformLocation(p.prog, 'iChannel' + c); });
      p.inputs.forEach(function (inp) {
        if (inp.kind === 'audio') inp.res = makeAudio();
        else if (inp.kind === 'gen') inp.res = makeGenerated(inp);
        else if (inp.kind === 'image') inp.res = makeImage(inp);
        else if (inp.kind === 'buffer' && inp.filter === 'mipmap') buffers[inp.buffer].wantMips = true;
      });
    }
    debug.compileMs = Math.round(performance.now() - compileStart);
    return true;
  }

  // ---------------------------------------------------------------- buffers
  var buffers = {};
  passes.forEach(function (p) { if (p.output !== 'image') buffers[p.output] = { pair: null, cur: 0, w: 0, h: 0, wantMips: false }; });

  function ensureBuffers(w, h) {
    Object.keys(buffers).forEach(function (k) {
      var b = buffers[k];
      if (b.w === w && b.h === h) return;
      if (b.pair) b.pair.forEach(function (t) { gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fb); });
      b.pair = [makeTarget(w, h), makeTarget(w, h)];
      b.cur = 0; b.w = w; b.h = h;
    });
  }

  // ---------------------------------------------------------------- geometry
  var vbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  // ---------------------------------------------------------------- MOLTamp reactivity
  // Claude's shell state drives the time speed and the energy of the simulated audio spectrum
  // (widgets get no audio data); terminal throughput adds on top.
  var STATES = {
    unknown: { speed: 1.0, energy: 0.5, code: 0 },
    idle: { speed: 0.35, energy: 0.12, code: 1 },
    thinking: { speed: 0.8, energy: 0.45, code: 2 },
    streaming: { speed: 1.25, energy: 0.8, code: 3 },
    'tool-use': { speed: 1.6, energy: 0.9, code: 4 },
    permission: { speed: 0.5, energy: 0.35, code: 5 },
    error: { speed: 0.25, energy: 0.2, code: 6 },
    complete: { speed: 1.0, energy: 0.6, code: 7 }
  };
  var react = { state: 'unknown', since: 0, activity: 'idle', bytes: 0, speed: 1, energy: 0.5, pulse: 0 };
  var reactive = opts.reactive !== false;

  window.addEventListener('message', function (e) {
    var d = e.data;
    if (d && d.type === 'moltamp:push' && d.subscriptionId === 'shell-state' && STATES[d.data]) {
      react.state = d.data;
      react.since = performance.now();
      if (d.data === 'complete' || d.data === 'error' || d.data === 'permission') react.pulse = 1;
    }
  });

  if (window.moltamp && moltamp.subscribe) {
    try { moltamp.subscribe('telemetry', 'activity', function (v) { react.activity = v || 'idle'; }); } catch (e) { /* store missing */ }
    try { moltamp.subscribe('telemetry', 'bytesPerSec', function (v) { react.bytes = Number(v) || 0; }); } catch (e) { /* store missing */ }
  }

  function updateReactivity(now, dt) {
    var name = react.state;
    // "complete" is a transient state: fall back to idle after a few seconds.
    if (name === 'complete' && now - react.since > 4000) name = react.state = 'idle';
    var s = STATES[name] || STATES.unknown;
    var act = react.activity === 'high' ? 0.35 : react.activity === 'low' ? 0.15 : 0;
    var bytes = Math.min(0.3, Math.log(1 + react.bytes) / Math.LN10 / 20);
    var targetSpeed = reactive ? s.speed + act * 0.8 + bytes : 1;
    var targetEnergy = reactive ? Math.min(1, s.energy + act + bytes) : 0.5;
    var k = 1 - Math.exp(-dt / 0.6);
    react.speed += (targetSpeed * (opts.speed || 1) - react.speed) * k;
    react.energy += (targetEnergy - react.energy) * k;
    react.pulse *= Math.exp(-dt / 0.5);
  }

  var fftSmooth = new Float32Array(AUDIO_W);
  function updateFakeAudio(t) {
    var e = react.energy, bpm = 70 + 80 * e, ph = (t * bpm / 60) % 1, kick = Math.exp(-ph * 7);
    for (var i = 0; i < AUDIO_W; i++) {
      var f = i / AUDIO_W;
      var base = Math.pow(1 - f, 2.2);
      var wob = 0.5 + 0.5 * Math.sin(i * 0.37 + t * 3.1) * Math.sin(i * 0.11 - t * 1.7);
      var v = e * (0.55 * base + 0.3 * wob * (1 - 0.6 * f));
      if (f < 0.06) v += kick * e * 0.9 * (1 - f / 0.06);
      v += react.pulse * 0.4 * base;
      fftSmooth[i] = fftSmooth[i] * 0.8 + Math.min(1, v) * 0.2;
      audioData[i] = (fftSmooth[i] * 255) | 0;
      var w = Math.sin(6.2831853 * f * 4 + t * 8) * 0.6 + Math.sin(6.2831853 * f * 17 + t * 13) * 0.3;
      audioData[AUDIO_W + i] = 128 + ((w * 127 * e * (0.5 + 0.5 * kick)) | 0);
    }
    gl.bindTexture(gl.TEXTURE_2D, audioTex.tex);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, AUDIO_W, 2, isGL2 ? gl.RED : gl.LUMINANCE, gl.UNSIGNED_BYTE, audioData);
  }

  // ---------------------------------------------------------------- mouse (Shadertoy iMouse semantics)
  var mouse = [0, 0, 0, 0], mouseDown = false, clickFrame = false;
  function mousePos(e) {
    var r = canvas.getBoundingClientRect();
    return [(e.clientX - r.left) * canvas.width / r.width, canvas.height - (e.clientY - r.top) * canvas.height / r.height];
  }
  canvas.addEventListener('pointerdown', function (e) {
    // Left button only, like Shadertoy: right-click and ctrl-click stay with the host (widget context menu).
    if (e.button !== 0 || e.ctrlKey) return;
    var p = mousePos(e);
    mouseDown = true; clickFrame = true;
    mouse = [p[0], p[1], p[0], p[1]];
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!mouseDown) return;
    var p = mousePos(e);
    mouse[0] = p[0]; mouse[1] = p[1];
  });
  function release() { if (mouseDown) { mouseDown = false; mouse[2] = -Math.abs(mouse[2]); } }
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);

  // ---------------------------------------------------------------- visibility: skip GPU work when hidden
  var visible = true;
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (entries) { visible = entries[entries.length - 1].isIntersecting; }).observe(canvas);
  }
  document.addEventListener('visibilitychange', function () { if (document.hidden) visible = false; });

  // ---------------------------------------------------------------- frame loop
  var simTime = 0, frameNo = 0, lastNow = 0, fpsAcc = 0, fpsFrames = 0, fps = 60, started = false;
  var chanTime = new Float32Array(4), chanRes = new Float32Array(12);

  function resize() {
    var dpr = window.devicePixelRatio || 1, scale = opts.scale || 1;
    var cw = canvas.clientWidth * dpr, ch = canvas.clientHeight * dpr;
    // Pixel budget keeps heavy raymarchers smooth on Retina or very large panels.
    var budget = opts.maxPixels || 600000;
    if (cw * ch * scale * scale > budget) scale = Math.sqrt(budget / (cw * ch));
    var w = Math.max(1, Math.round(cw * scale));
    var h = Math.max(1, Math.round(ch * scale));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    ensureBuffers(w, h);
    return [w, h];
  }

  function bindInputs(pass) {
    for (var c = 0; c < 4; c++) {
      var inp = pass.byChannel[c], res = null, target = gl.TEXTURE_2D, hasMips = false;
      gl.activeTexture(gl.TEXTURE0 + c);
      chanRes[c * 3] = chanRes[c * 3 + 1] = chanRes[c * 3 + 2] = 0;
      if (inp) {
        if (inp.kind === 'buffer') {
          var b = buffers[inp.buffer];
          if (b && b.pair) {
            res = { tex: b.pair[b.cur].tex, target: gl.TEXTURE_2D };
            hasMips = b.wantMips;
            chanRes[c * 3] = b.w; chanRes[c * 3 + 1] = b.h; chanRes[c * 3 + 2] = 1;
          }
        } else if (inp.res) {
          res = inp.res; target = res.target; hasMips = res.mips;
          chanRes[c * 3] = res.w; chanRes[c * 3 + 1] = res.h; chanRes[c * 3 + 2] = res.d;
        }
      }
      if (res) {
        gl.bindTexture(res.target, res.tex);
        var filter = inp.filter || 'linear';
        if (inp.kind === 'buffer' && filter !== 'nearest' && !rtFormat.linear) filter = 'nearest';
        applySampler(res.target, filter, isGL2 || res.target !== gl.TEXTURE_2D || inp.kind !== 'buffer' ? inp.wrap : 'clamp', hasMips);
      } else {
        gl.bindTexture(gl.TEXTURE_2D, null);
      }
      gl.uniform1i(pass.u.ch[c], c);
    }
  }

  function draw(now) {
    var dt = lastNow ? Math.min((now - lastNow) / 1000, 0.1) : 1 / 60;
    lastNow = now;
    fpsAcc += dt; fpsFrames++;
    if (fpsAcc > 0.5) { fps = fpsFrames / fpsAcc; fpsAcc = 0; fpsFrames = 0; debug.fps = Math.round(fps); }

    updateReactivity(now, dt);
    var simDt = dt * react.speed;
    simTime += simDt;
    if (audioTex) updateFakeAudio(simTime);

    var size = resize(), w = size[0], h = size[1];
    var date = new Date();
    var secs = date.getHours() * 3600 + date.getMinutes() * 60 + date.getSeconds() + date.getMilliseconds() / 1000;
    for (var c = 0; c < 4; c++) chanTime[c] = simTime;
    if (!clickFrame) mouse[3] = -Math.abs(mouse[3]);

    for (var i = 0; i < passes.length; i++) {
      var p = passes[i], target = null, b = null;
      if (p.output !== 'image') { b = buffers[p.output]; target = b.pair[1 - b.cur]; }
      gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fb : null);
      gl.viewport(0, 0, w, h);
      gl.useProgram(p.prog);
      bindInputs(p);
      gl.uniform3f(p.u.iResolution, w, h, 1);
      gl.uniform1f(p.u.iTime, simTime);
      gl.uniform1f(p.u.iTimeDelta, simDt);
      gl.uniform1f(p.u.iFrameRate, fps);
      gl.uniform1i(p.u.iFrame, frameNo);
      gl.uniform4f(p.u.iMouse, mouse[0], mouse[1], mouse[2], mouse[3]);
      gl.uniform4f(p.u.iDate, date.getFullYear(), date.getMonth(), date.getDate(), secs);
      gl.uniform1f(p.u.iSampleRate, 44100);
      gl.uniform4f(p.u.iMoltamp, react.energy, react.speed, (STATES[react.state] || STATES.unknown).code, react.pulse);
      if (p.u.iChannelTime) gl.uniform1fv(p.u.iChannelTime, chanTime);
      if (p.u.iChannelResolution) gl.uniform3fv(p.u.iChannelResolution, chanRes);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      if (b) {
        b.cur = 1 - b.cur;
        if (b.wantMips) { gl.bindTexture(gl.TEXTURE_2D, b.pair[b.cur].tex); gl.generateMipmap(gl.TEXTURE_2D); }
      }
    }
    clickFrame = false;
    frameNo++;
    debug.frame = frameNo;
  }

  var lastDraw = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    if (!started) {
      if (ext.parallel && !passes.every(function (p) { return gl.getProgramParameter(p.prog, ext.parallel.COMPLETION_STATUS_KHR); })) return;
      started = true;
      if (!finishLink()) { started = 'failed'; return; }
      debug.ready = true;
    }
    if (started !== true || !visible) { lastNow = 0; return; }
    var cap = opts.fpsCap || 60;
    if (now - lastDraw < 1000 / cap - 2) return;
    lastDraw = now;
    draw(now);
  }

  // Per-widget overrides persisted with moltamp.settings: { scale, maxPixels, fpsCap, speed, reactive }.
  (function () {
    if (!window.moltamp || !moltamp.settings) { requestAnimationFrame(loop); return; }
    moltamp.settings.read().then(function (saved) {
      saved = saved || {};
      ['scale', 'maxPixels', 'fpsCap', 'speed', 'reactive'].forEach(function (k) { if (saved[k] !== undefined) opts[k] = saved[k]; });
      reactive = opts.reactive !== false;
    }).catch(function () { /* first run: no settings yet */ }).then(function () { requestAnimationFrame(loop); });
  })();
})();

</script>
